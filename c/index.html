<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contrato</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0D0F0E">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0D0F0E;--panel:#151816;--line:#272D29;--ink:#F4F0E4;--mute:#9A968A;--dim:#5f5c55;--accent:#F2A541;--accent-ink:#17130B;--papel:#FBF8F1;--tinta:#1d1b16;--cinza:#6b665a;--regua:#e4dccb;--ok:#2f8f57;--selo:#C2412D;
  --f:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;--serif:"Source Serif 4",Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--ink);font:16px/1.5 var(--f);min-height:100vh;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:center;gap:10px;margin-bottom:18px;min-height:38px}
.av{width:38px;height:38px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--accent-ink);font-weight:850;font-stretch:115%;font-size:15px}
.nm{font-weight:800;font-stretch:112%;font-size:15px;line-height:1.15}
.nm small{display:block;font-weight:500;font-stretch:100%;color:var(--mute);font-size:12px}
.papel{position:relative;background:var(--papel);color:var(--tinta);border-radius:10px;padding:28px 22px 26px;box-shadow:0 24px 70px rgba(0,0,0,.5);overflow:hidden}
.papel .olho{font-size:11.5px;font-weight:750;letter-spacing:.09em;text-transform:uppercase;color:#a8772a}
.papel h1{font-weight:850;font-stretch:114%;font-size:clamp(24px,6.6vw,30px);line-height:1.08;letter-spacing:-.02em;margin:6px 0 4px;text-wrap:balance;word-break:break-word}
.papel .quando{color:var(--cinza);font-size:13.5px}
.itens{margin-top:20px;border-top:1px solid var(--regua)}
.item{padding:13px 0;border-bottom:1px solid var(--regua)}
.item span{display:block;font-size:11.5px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--cinza);margin-bottom:2px}
.item p{font-size:16px;line-height:1.45;word-break:break-word;white-space:pre-line}
.total{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:20px;flex-wrap:wrap}
.total span{font-size:11.5px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--cinza)}
.total b{font-weight:900;font-stretch:116%;font-size:clamp(34px,10vw,44px);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.total small{display:block;color:var(--cinza);font-size:13.5px;margin-top:6px;width:100%}
.selo{display:inline-block;border:3px solid var(--ok);color:var(--ok);font:900 13px/1 var(--f);font-stretch:118%;letter-spacing:.12em;padding:7px 9px 6px;border-radius:8px;transform:rotate(-4deg);margin:0 0 14px}
.doc .selo-l{text-align:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;cursor:pointer;font-weight:750;font-size:16.5px;border-radius:16px;padding:17px 18px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);transition:transform .12s,filter .15s;text-decoration:none;margin-top:14px}
.btn:active{transform:scale(.985)}.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.zap{background:#25D366;border-color:#25D366;color:#06210f}
.nota{color:var(--mute);font-size:13.5px;text-align:center;margin-top:14px;line-height:1.45}
.aviso{background:rgba(242,165,65,.10);border:1px solid rgba(242,165,65,.35);border-radius:14px;padding:12px 14px;font-size:14.5px;margin-top:14px}
.ok-box{background:rgba(127,206,143,.10);border:1px solid rgba(127,206,143,.35);border-radius:16px;padding:16px;margin-top:16px}
.ok-box b{display:block;font-size:17px;font-weight:800}
.ok-box span{display:block;color:var(--mute);font-size:14px;margin-top:2px}
label{display:block;font-size:13.5px;font-weight:650;color:var(--mute);margin:14px 0 6px 2px}
.inp{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:16px;outline:none}
.inp:focus{border-color:var(--accent)}.inp.erro{border-color:#ff8f7a}
textarea.inp{min-height:92px;resize:vertical}
.err{color:#ff8f7a;font-size:14px;min-height:20px;margin-top:8px}
.caixa{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:16px}
.caixa h2{font-size:18px;font-weight:800;font-stretch:108%;margin-bottom:2px}
.caixa p.s{color:var(--mute);font-size:14px}
.tog{display:flex;gap:12px;align-items:flex-start;margin-top:14px;font-size:14.5px;cursor:pointer;color:var(--ink);font-weight:500}
.tog input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin-top:1px}
.fim{text-align:center;padding-top:12vh}
.fim h1{font-weight:850;font-stretch:116%;font-size:28px;line-height:1.1;margin-bottom:8px}
.fim p{color:var(--mute)}
.gira{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:gira .8s linear infinite;margin:20vh auto 0}
@keyframes gira{to{transform:rotate(360deg)}}
.foot{color:var(--dim);font-size:12px;margin-top:26px;text-align:center}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.papel.doc{font:15.5px/1.62 var(--serif);padding:30px 22px 34px}
.papel.doc h1{font-family:var(--f);text-align:center;font-size:clamp(19px,5.4vw,23px)}
.papel.doc .sb{text-align:center;color:var(--cinza);font:13px/1.4 var(--f);margin:4px 0 18px}
.papel.doc h3{font:750 14.5px/1.3 var(--f);margin:18px 0 3px}
.papel.doc p{margin:0 0 6px;word-break:break-word}
.resumo{background:#f1ebde;border-radius:10px;padding:14px 14px 4px;margin:16px 0 4px;font-family:var(--f)}
.resumo div{margin-bottom:10px}
.resumo span{display:block;font-size:10.5px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--cinza)}
.resumo p{font-size:14.5px;line-height:1.4;margin:0}
.loc{margin-top:22px;text-align:right;font:13.5px var(--f)}
.ass{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:34px;font:13px/1.35 var(--f);text-align:center}
.ass div{border-top:1px solid var(--tinta);padding-top:6px;word-break:break-word}
.ass small{display:block;color:var(--cinza);font-size:11.5px}
.registro{margin-top:22px;border:1px solid var(--ok);border-radius:10px;padding:12px 14px;font:13.5px/1.45 var(--f);color:#1f5c38;background:#eef7f0}
@media print{
  @page{margin:16mm}
  html,body{background:#fff}header,.noprint,.foot{display:none!important}
  .wrap{max-width:none;padding:0}.papel{box-shadow:none;border-radius:0;padding:0;background:#fff}.resumo{background:#f4f4f4}
}
</style>
</head>
<body>
<div class="wrap">
  <header id="topo"></header>
  <main id="tela"><div class="gira" role="status" aria-label="Carregando"></div></main>
</div>
<script>
/* Página do CLIENTE. Mostra só este documento. Não há ferramentas nem dados internos do editor aqui. */
const SUPA = { url:'https://otlaexuqyavpzxwzcsfo.supabase.co', key:'sb_publishable_bAaw1t6NpZEgH8ePBztQWg_tE4kDfQR' };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const primeiro = n => String(n || '').trim().split(/\s+/)[0] || '';
const dinheiro = v => 'R$ ' + (+v || 0).toLocaleString('pt-BR', { minimumFractionDigits: (+v % 1) ? 2 : 0, maximumFractionDigits:2 });
const dia = iso => { if (!iso) return ''; const d = new Date(String(iso).length <= 10 ? iso + 'T12:00:00' : iso); return isNaN(d) ? '' : d.toLocaleDateString('pt-BR', { day:'numeric', month:'long', year:'numeric' }); };
const diaHora = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('pt-BR', { day:'numeric', month:'long', year:'numeric' }) + ' às ' + d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' }); };
const TOKEN = (location.hash.slice(1).match(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i) || [''])[0];
// conversa só com as funções públicas deste documento (sem login)
function pub(fn, corpo){
  return fetch(SUPA.url + '/rest/v1/rpc/' + fn, { method:'POST', headers:{ apikey:SUPA.key, 'Content-Type':'application/json' }, body:JSON.stringify(corpo) })
    .then(r => r.ok ? r.json() : Promise.reject(new Error('falhou')));
}
function indisponivel(msg){ $('#topo').innerHTML = ''; $('#tela').innerHTML = `<div class="fim"><h1>Link indisponível</h1><p>${msg || 'Este link não está ativo. Peça um link novo para quem te mandou.'}</p></div>`; }
function semRede(){ $('#tela').innerHTML = `<div class="fim"><h1>Sem conexão</h1><p>Não deu para carregar agora. Confira a internet e tente de novo.</p><button class="btn ghost" onclick="location.reload()">Tentar de novo</button></div>`; }
function topo(ed, rotulo){ $('#topo').innerHTML = `<div class="av">${esc(primeiro(ed?.nome)[0]?.toUpperCase() || '•')}</div><div class="nm">${esc(ed?.nome || '')}<small>${rotulo}</small></div>`; }
const zapUrl = (ed, txt) => 'https://api.whatsapp.com/send?' + (ed?.whatsapp ? 'phone=' + String(ed.whatsapp).replace(/\D/g, '') + '&' : '') + 'text=' + encodeURIComponent(txt);
addEventListener('hashchange', () => location.reload());

let C = null;
function desenha(){
  const c = C.contrato, ed = C.editor || {}, aceito = C.status === 'aceito', ac = C.aceite || {};
  const a = c.contratado || {}, b = c.contratante || {}, r = c.resumo || {};
  document.title = 'Contrato · ' + (a.nome || ed.nome || '');
  topo({ nome: a.nome || ed.nome }, c.formato === 'rapido' ? 'Termo de serviço' : 'Contrato');
  const linha = (rot, v) => v ? `<div><span>${rot}</span><p>${esc(v)}</p></div>` : '';
  const rev = +r.revisoes ? (+r.revisoes === 1 ? '1 rodada de ajustes' : r.revisoes + ' rodadas de ajustes') : '';
  $('#tela').innerHTML = `
    <article class="papel doc">
      ${aceito ? '<div class="selo-l"><div class="selo">ACEITO</div></div>' : ''}
      <h1>${esc(c.titulo)}</h1>
      <div class="sb">Entre ${esc(a.nome)} e ${esc(b.nome)}</div>
      <p><b>CONTRATADO:</b> ${esc(a.nome)}${a.doc ? ', CPF/CNPJ ' + esc(a.doc) : ''}${a.cidade ? ', ' + esc(a.cidade) : ''}.</p>
      <p><b>CONTRATANTE:</b> ${esc(b.nome)}${(ac.doc || b.doc) ? ', CPF/CNPJ ' + esc(ac.doc || b.doc) : ''}.</p>
      ${(r.servico || r.valor) ? `<div class="resumo">${linha('Serviço', r.servico)}${linha('Entrega', r.entrega)}${linha('Prazo', r.prazo)}${linha('Revisões', rev)}${linha('Valor total', r.valor ? dinheiro(r.valor) : '')}${linha('Pagamento', r.pagamento)}</div>` : ''}
      ${(c.clausulas || []).map(([t, p]) => `<h3>${esc(t)}</h3><p>${esc(p)}</p>`).join('')}
      ${c.local_data ? `<p class="loc">${esc(c.local_data)}</p>` : ''}
      <div class="ass"><div>${esc(a.nome)}<small>Contratado</small></div><div>${esc(aceito && ac.nome ? ac.nome : b.nome)}<small>Contratante</small></div></div>
      ${aceito ? `<div class="registro"><b>Aceite eletrônico registrado.</b><br>${esc(ac.nome || '')}${ac.doc ? ' · CPF/CNPJ ' + esc(ac.doc) : ''}<br>${diaHora(ac.em)}</div>` : ''}
    </article>
    <div id="acoes" class="noprint"></div>
    <p class="foot noprint">Contrato enviado por ${esc(a.nome || ed.nome || 'seu editor')}.</p>`;
  const z = $('#acoes'), nomeEd = primeiro(a.nome || ed.nome);
  if (aceito){
    z.innerHTML = `<div class="ok-box"><b>Contrato aceito ✓</b><span>Guarde uma cópia. ${esc(nomeEd)} também tem o registro.</span></div>
      <button class="btn" id="pdf">Salvar em PDF</button>
      <a class="btn zap" target="_blank" rel="noopener" href="${esc(zapUrl(ed, `Oi, ${nomeEd}! Li e aceitei o contrato. Podemos começar!`))}">Avisar ${esc(nomeEd)} no WhatsApp</a>`;
    $('#pdf').onclick = () => window.print();
    return;
  }
  z.innerHTML = `<div class="caixa">
      <h2>Aceitar este contrato</h2>
      <p class="s">Leia com calma. Estando de acordo, confirme com o seu nome.</p>
      <label for="nome">Seu nome completo</label><input class="inp" id="nome" autocomplete="name" maxlength="80">
      <label for="doc">CPF ou CNPJ <span style="font-weight:500;color:var(--dim)">(opcional)</span></label><input class="inp" id="doc" inputmode="numeric" maxlength="20" value="${esc(b.doc || '')}">
      <label class="tog"><input type="checkbox" id="li"><span>Li o contrato acima e estou de acordo com tudo.</span></label>
      <button class="btn" id="ok">Aceitar contrato</button><div class="err" id="erro"></div>
    </div>
    <button class="btn ghost" id="pdf">Salvar em PDF para ler depois</button>
    <a class="btn ghost" target="_blank" rel="noopener" href="${esc(zapUrl(ed, `Oi, ${nomeEd}! Tenho uma dúvida sobre o contrato: `))}">Tirar uma dúvida com ${esc(nomeEd)}</a>
    <p class="nota">O aceite fica registrado com o seu nome, a data e a hora.</p>`;
  $('#pdf').onclick = () => window.print();
  $('#ok').onclick = async () => {
    const n = $('#nome'), v = n.value.trim().replace(/\s+/g, ' ');
    $('#erro').textContent = '';
    if (v.length < 5 || !/\s/.test(v)){ n.classList.add('erro'); n.focus(); $('#erro').textContent = 'Coloque o seu nome completo.'; return; }
    if (!$('#li').checked){ $('#erro').textContent = 'Marque que você leu e está de acordo.'; return; }
    const bt = $('#ok'); bt.disabled = true;
    try {
      const r = await pub('pub_contrato_aceitar', { p_token:TOKEN, p_nome:v, p_doc:$('#doc').value.trim() || null });
      if (!r || !r.ok) throw new Error('recusado');
      C = await pub('pub_contrato', { p_token:TOKEN });
      desenha(); window.scrollTo({ top:0, behavior:'smooth' });
    } catch { $('#erro').textContent = 'Não deu para registrar agora. Confira a internet e tente de novo.'; bt.disabled = false; }
  };
}
(async () => {
  if (!TOKEN) return indisponivel();
  try { C = await pub('pub_contrato', { p_token:TOKEN }); } catch { return semRede(); }
  if (!C || !C.ok) return indisponivel('Este contrato não está mais disponível. Peça um link novo para quem te mandou.');
  desenha();
})();

</script>
</body>
</html>
