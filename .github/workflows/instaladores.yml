name: Gerar instaladores do FL Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            nome: mac
            args: --target universal-apple-darwin
          - os: windows-latest
            nome: windows
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.nome == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2

      - name: Instalar a ferramenta do Tauri
        run: npm ci

      - name: Gerar o instalador
        run: npx tauri build ${{ matrix.args }}

      - name: Guardar o instalador
        uses: actions/upload-artifact@v4
        with:
          name: FL-Hub-${{ matrix.nome }}
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/nsis/*.exe
          if-no-files-found: error
