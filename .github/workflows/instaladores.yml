name: Gerar instaladores do Pluga & Edita

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            nome: mac
            args: --target universal-apple-darwin
          - os: windows-latest
            nome: windows
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.nome == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2

      - name: Instalar a ferramenta do Tauri
        run: npm ci

      - name: Gerar o instalador
        run: npx tauri build ${{ matrix.args }}

      - name: Dar nome fixo ao instalador
        shell: bash
        run: |
          mkdir -p saida
          if [ "${{ matrix.nome }}" = "mac" ]; then
            cp "$(find target -path '*bundle/dmg/*.dmg' | head -1)" saida/Pluga-Edita-Mac.dmg
          else
            cp "$(find target -path '*bundle/nsis/*.exe' | head -1)" saida/Pluga-Edita-Windows.exe
          fi
          ls -la saida

      - name: Guardar o instalador
        uses: actions/upload-artifact@v4
        with:
          name: Pluga-Edita-${{ matrix.nome }}
          path: saida/*
          if-no-files-found: error

  publicar:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ler a versão do app
        id: versao
        run: echo "v=$(node -p "require('./app/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: saida
          merge-multiple: true

      - name: Publicar no GitHub Releases (links fixos)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.v }}
          name: Pluga & Edita ${{ steps.versao.outputs.v }}
          make_latest: true
          overwrite_files: true
          body: |
            Instaladores do app Pluga & Edita.
            Mac: Pluga-Edita-Mac.dmg · Windows: Pluga-Edita-Windows.exe
          files: |
            saida/Pluga-Edita-Mac.dmg
            saida/Pluga-Edita-Windows.exe
