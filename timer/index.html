<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChronoCut — o timer do editor | Base FL</title>
<meta name="description" content="ChronoCut: registre o tempo de cada projeto de edição, separe revisões e exportações e veja quanto você recebe por hora.">
<meta name="theme-color" content="#0D0F0E">
<meta name="robots" content="noindex">
<link rel="icon" href="/timer/favicon-32.png">
<link rel="apple-touch-icon" href="/timer/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ChronoCut · mesmo esqueleto visual das outras ferramentas do Base FL (fundo, painéis, botões, campos). Só a cor de destaque é dele. */
:root{--bg:#0D0F0E;--panel:#151816;--panel2:#1B1F1C;--line:#272D29;--ink:#F4F0E4;--mute:#9A968A;--dim:#8A877E;--accent:#FF5A5F;--accent-ink:#1c0607;--ok:#7fce8f;--warn:#F2A541;--err:#ff8f7a;
  --f:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;--m:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--bg-reta:#13100D}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--ink);font:16px/1.5 var(--f);min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(700px 420px at 85% -8%,rgba(255,90,95,.08),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
[hidden]{display:none!important}
.wrap{position:relative;max-width:720px;margin:0 auto;padding:16px 18px 90px}
header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
header img{width:38px;height:38px;border-radius:11px;box-shadow:0 0 0 1px rgba(255,255,255,.10);flex:none}
header .nm{font-weight:800;font-stretch:112%;font-size:15px;letter-spacing:-.01em;line-height:1.1}
header .nm small{display:block;font-weight:500;font-stretch:100%;color:var(--mute);font-size:12px}
header .sp{flex:1}
.sinc{font-size:12px;color:var(--dim);display:inline-flex;align-items:center;gap:6px}
.sinc i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.sinc.erro{color:var(--warn)}.sinc.erro i{background:var(--warn)}
.link{background:none;border:0;color:var(--mute);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;min-height:32px}
h1{font-weight:850;font-stretch:118%;font-size:clamp(26px,7vw,34px);line-height:1.04;letter-spacing:-.025em;margin-bottom:8px;text-wrap:balance}
h2{font-weight:800;font-stretch:110%;font-size:19px;letter-spacing:-.01em;line-height:1.2}
h3{font-weight:750;font-size:14.5px}
.sub{color:var(--mute);font-size:15px;margin-bottom:20px;max-width:52ch}
.dica{color:var(--mute);font-size:13.5px}
label{display:block;font-size:13px;font-weight:700;color:var(--mute);margin:14px 0 6px}
label small{font-weight:500;color:var(--dim)}
.inp{width:100%;min-height:48px;background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:0 14px;font-size:16px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--accent)}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 14px) 21px;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:16px;cursor:pointer;padding:0 20px;text-decoration:none;transition:transform .15s,filter .2s}
.btn:active{transform:scale(.985)}.btn:disabled{opacity:.5;cursor:default}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:#3a423c;filter:none}
.btn.full{width:100%}
.btn.p{min-height:40px;font-size:14px;padding:0 14px;border-radius:11px}
.btn.perigo{background:transparent;color:var(--err);border:1px solid rgba(255,143,122,.4)}
.cartao{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px 16px;margin-top:14px}
/* navegação: o cronômetro é a tela principal; o resto é secundário */
.abas{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--panel);border:1px solid var(--line);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.abas button{flex:1;min-width:max-content;border:0;background:transparent;color:var(--mute);font-weight:650;font-size:14px;padding:9px 14px;border-radius:10px;cursor:pointer;min-height:40px}
.abas button[aria-selected=true]{background:var(--ink);color:#141615}
/* cronômetro */
.cron{text-align:center;padding:22px 16px 20px}
.cron .linha{display:flex;gap:8px;align-items:center}
.cron .linha .inp{flex:1;min-width:0;font-weight:700}
.etapas{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.etapas::-webkit-scrollbar{display:none}
.etapas button{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--mute);border-radius:99px;padding:8px 13px;font-size:13.5px;font-weight:650;cursor:pointer;min-height:38px;white-space:nowrap}
.etapas button[aria-pressed=true]{border-color:var(--accent);color:var(--ink);background:rgba(255,90,95,.12)}
.etapas .sep{flex:none;width:1px;background:var(--line);margin:6px 4px}
.revl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:center;margin-top:12px;font-size:13.5px;color:var(--mute)}
.revl .conta{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-weight:700}
.revl .conta button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:800}
.seg{display:inline-flex;padding:3px;border-radius:11px;border:1px solid var(--line);background:var(--bg)}
.seg button{border:0;background:transparent;color:var(--mute);font-size:13px;font-weight:650;padding:6px 11px;border-radius:8px;cursor:pointer;min-height:32px}
.seg button[aria-pressed=true]{background:var(--panel2);color:var(--ink)}
.tempo{font-weight:850;font-stretch:112%;font-variant-numeric:tabular-nums;font-size:clamp(60px,19vw,116px);line-height:1;letter-spacing:-.04em;margin:22px 0 4px}
.tempo.pausado{color:var(--mute)}
.estado{font-size:13.5px;color:var(--mute);min-height:20px}
.estado b{color:var(--accent)}
.acoes{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.acoes .btn{min-width:150px}
.extra{display:grid;gap:10px;margin-top:18px;text-align:left}
.foco{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--mute)}
.noproj{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);text-align:left;font-size:14px;color:var(--mute);display:grid;gap:8px}
.noproj b{color:var(--ink)}
.barra{height:7px;border-radius:7px;background:var(--panel2);overflow:hidden}
.barra i{display:block;height:100%;border-radius:7px;background:var(--accent);transition:width .4s}
.barra.ok i{background:var(--ok)}.barra.warn i{background:var(--warn)}
.aviso{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:12px;border:1px solid rgba(242,165,65,.35);background:rgba(242,165,65,.07);font-size:13.5px;color:var(--ink);text-align:left}
.aviso svg{flex:none;width:18px;height:18px;margin-top:1px;fill:none;stroke:var(--warn);stroke-width:2;stroke-linecap:round}
.aviso .ac{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.espera{display:flex;gap:12px;align-items:center;text-align:left}
.espera .tx{flex:1;min-width:0}
.espera b{display:block;font-size:14.5px}
.espera small{color:var(--mute);font-size:13px}
.espera .t{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px}
/* listas */
.lista{list-style:none;display:grid;gap:8px;margin-top:12px}
.item{display:flex;gap:12px;align-items:center;padding:13px 14px;border-radius:15px;border:1px solid var(--line);background:var(--panel);cursor:pointer;text-align:left;width:100%}
.item:hover{border-color:#3a423c}
.item .tx{flex:1;min-width:0}
.item b{display:block;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{color:var(--mute);font-size:13px}
.item .n{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;white-space:nowrap}
.selo{display:inline-block;font-size:11.5px;font-weight:750;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.07);color:var(--mute);margin-left:6px;vertical-align:1px}
.selo.atraso{background:rgba(255,143,122,.14);color:var(--err)}.selo.ok{background:rgba(127,206,143,.14);color:var(--ok)}.selo.on{background:rgba(255,90,95,.16);color:var(--accent)}
.kp{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.kp div{padding:13px 14px;border-radius:15px;border:1px solid var(--line);background:var(--bg)}
.kp small{display:block;color:var(--mute);font-size:12.5px}
.kp b{font-size:21px;font-weight:850;font-stretch:108%;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kp em{display:block;font-style:normal;color:var(--dim);font-size:12px;margin-top:2px}
@media (min-width:620px){.kp{grid-template-columns:repeat(4,1fr)}.kp.t3{grid-template-columns:repeat(3,1fr)}}
.bar-l{display:grid;gap:9px;margin-top:12px}
.bar-l .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:13.5px}
.bar-l .r span:nth-child(2){font-variant-numeric:tabular-nums;font-weight:700}
.bar-l .r .barra{grid-column:1/-1}
.reg{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:2px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.reg small{grid-column:1/-1;color:var(--mute);font-size:12.5px}
.reg .d{font-variant-numeric:tabular-nums;font-weight:700}
.reg button{border:1px solid var(--line);background:var(--bg);color:var(--mute);border-radius:9px;min-height:32px;padding:0 10px;font-size:12.5px;font-weight:650;cursor:pointer}
.filtros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
@media (max-width:560px){.filtros{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
.vazio{padding:26px 14px;text-align:center;color:var(--mute);font-size:14px;border:1.5px dashed var(--line);border-radius:16px;margin-top:12px}
.tog{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;font-size:14.5px}
.tog input{width:20px;height:20px;accent-color:var(--accent);margin-top:2px;flex:none}
.tog small{display:block;color:var(--mute);font-size:13px}
.el{display:grid;grid-template-columns:minmax(0,1fr) 130px 40px;gap:6px;margin-top:6px}
.el .inp{min-height:42px;font-size:14.5px}
.el button{border:1px solid var(--line);background:var(--bg);border-radius:11px;color:var(--mute);cursor:pointer}
/* folha (formulários por cima) */
.folha{position:fixed;inset:0;z-index:60;background:rgba(6,7,7,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;align-items:end;justify-items:center;padding:0}
.folha .cx{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom))}
@media (min-width:640px){.folha{align-items:center;padding:20px}.folha .cx{border-radius:22px}}
.folha .fh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.folha .x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);cursor:pointer;display:grid;place-items:center;flex:none}
.folha .x svg{width:15px;height:15px;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;fill:none}
.folha .pe{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.folha .pe .btn{flex:1;min-width:140px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:#141615;padding:11px 18px;border-radius:13px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:90;max-width:calc(100vw - 30px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.lock ul{list-style:none;display:grid;gap:9px;margin:4px 0 18px;font-size:15px}
.lock li{padding-left:26px;position:relative}
.lock li::before{content:"";position:absolute;left:2px;top:7px;width:11px;height:6px;border-left:2.5px solid var(--accent);border-bottom:2.5px solid var(--accent);transform:rotate(-45deg)}
/* modo compacto: só o essencial, para deixar num canto da tela */
body.mini .wrap{max-width:340px;padding:10px 10px 12px}
body.mini header,body.mini .abas,body.mini .foot,body.mini .so-cheio{display:none}
body.mini .cron{padding:14px 12px}
body.mini .tempo{font-size:54px;margin:12px 0 2px}
body.mini .acoes .btn{min-width:0;flex:1;min-height:44px}
body.mini .cartao{margin-top:0}
.foot{margin-top:26px;text-align:center;color:var(--dim);font-size:12.5px}
@media (max-width:430px){.abas button{padding:9px 8px;font-size:13px}}
/* ===================== DESAFIO (modo foco com prazo) =====================
   O desafio é uma timeline: título = nome do clipe, timecode = tempo, playhead indo até o FIM.
   Tudo com prefixo d- para não colidir com o cronômetro. */
body.d-largo .wrap{max-width:1120px}
body.d-reta{background:var(--bg-reta)}
body{transition:background-color 1.2s cubic-bezier(.2,.7,.2,1)}
.d-rot{font:700 11px/1.2 var(--m);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.d-faixa{display:flex;align-items:center;gap:10px;width:100%;margin-bottom:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;text-align:left;font-size:14px}
.d-faixa b{font:700 14px var(--m);font-variant-numeric:tabular-nums}
.d-faixa .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-faixa .ab{color:var(--mute);text-decoration:underline;text-underline-offset:3px}
.d-rel{width:20px;height:20px;flex:none;color:var(--ink)}
.d-rel .pont{transform-origin:12px 13.5px;animation:d-gira 60s linear infinite}
body.d-reta .d-rel .pont{animation-duration:6s}
body.d-reta .d-rel{color:var(--warn)}
.d-pausado .d-rel .pont{animation-play-state:paused}
@keyframes d-gira{to{transform:rotate(360deg)}}
.d-cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:850;font-size:17px;padding:0 24px;cursor:pointer;transition:transform .12s}
.d-cta:active{transform:scale(.98)}.d-cta:disabled{opacity:.4;cursor:default}
.d-cta.full{width:100%}
.d-b2{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:13px;border:1px solid #343B36;background:transparent;color:var(--ink);font-weight:700;font-size:15px;padding:0 18px;cursor:pointer}

/* configurar */
.d-cfg{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:880px){.d-cfg{grid-template-columns:1fr}}
.d-cfg h1{font-size:clamp(30px,5vw,52px);margin:6px 0 4px}
.d-passo{display:block;margin:24px 0 10px}
.d-chips{display:flex;flex-wrap:wrap;gap:6px}
.d-chips button{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--mute);font-weight:650;font-size:14.5px;padding:0 14px;cursor:pointer}
.d-chips button[aria-pressed=true]{border-color:var(--ink);color:var(--ink);background:var(--panel2)}
.d-chips .meu{border-style:dashed;border-color:#343B36;color:var(--ink);display:inline-flex;align-items:center;gap:8px}
.d-chips .meu svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none}
.d-chips .meu[aria-pressed=true]{border-style:solid;border-color:var(--accent);background:rgba(255,90,95,.1)}
.d-chips .num{font-family:var(--m);font-weight:700}
.d-campo{display:block;width:100%;background:transparent;border:0;border-bottom:2px solid #343B36;padding:8px 0 12px;font-weight:800;font-stretch:112%;font-size:clamp(24px,3.6vw,36px);letter-spacing:-.02em;outline:none;color:var(--ink);border-radius:0}
.d-campo::placeholder{color:#55584f}
.d-campo:focus{border-color:var(--accent)}
.d-ajuda{display:flex;justify-content:space-between;gap:10px;color:var(--mute);font-size:13px;margin-top:8px}
.d-ajuda .cont{font-family:var(--m);font-size:12px}
.d-sug{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--mute)}
.d-sug button{border:1px solid #343B36;background:var(--ink);color:#141615;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:650;cursor:pointer;min-height:34px}
.d-qtd{margin-top:12px;color:var(--ink);font-weight:500;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-size:14px;cursor:pointer}
.d-qtd input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.d-qtd small{display:block;color:var(--mute);font-size:12.5px}
.d-livre{margin-top:12px;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--panel)}
.d-modo{display:inline-flex;padding:3px;border-radius:11px;border:1px solid var(--line);background:var(--bg);margin-bottom:14px}
.d-modo button{border:0;background:transparent;color:var(--mute);font-size:13px;font-weight:650;padding:6px 12px;border-radius:8px;cursor:pointer;min-height:34px}
.d-modo button[aria-pressed=true]{background:var(--panel2);color:var(--ink)}
.d-hms{display:flex;align-items:flex-end;gap:6px}
.d-hms .u{display:grid;justify-items:center;gap:4px}
.d-hms .u label{font:700 10.5px var(--m);letter-spacing:.12em;color:var(--mute);text-transform:uppercase;margin:0}
.d-hms .cx{display:grid;grid-template-columns:36px 64px 36px;align-items:center;border:1px solid #343B36;border-radius:12px;background:var(--bg);overflow:hidden}
.d-hms .cx button{height:52px;border:0;background:transparent;color:var(--mute);font-size:20px;cursor:pointer}
.d-hms .cx button:hover{color:var(--ink);background:var(--panel2)}
.d-hms input{width:64px;height:52px;border:0;background:transparent;text-align:center;font:700 26px var(--m);font-variant-numeric:tabular-nums;outline:none;color:var(--ink)}
.d-hms .dp{font:700 26px var(--m);color:var(--dim);padding-bottom:12px}
@media (max-width:440px){.d-hms .cx{grid-template-columns:28px 46px 28px}.d-hms input{width:46px;font-size:22px}.d-hms .cx button{height:48px}}
.d-hora{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.d-hora input{height:52px;border:1px solid #343B36;border-radius:12px;background:var(--bg);padding:0 14px;font:700 24px var(--m);color:var(--ink)}
.d-hora span{color:var(--mute);font-size:14px}
.d-valida{margin-top:10px;font-size:13.5px;color:var(--mute);min-height:20px}
.d-valida.erro{color:var(--warn)}
.d-opts{margin-top:18px}
.d-opts .tog:first-child{border-top:0}
.d-plano{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;position:sticky;top:16px}
@media (max-width:880px){.d-plano{position:static}}

<body>
<div class="wrap" id="wrap">
  <header id="topo"></header>
  <nav class="abas" id="abas" role="tablist" hidden></nav>
  <main id="tela"><p class="sub">Carregando…</p></main>
  <p class="foot" id="foot"></p>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="d-desf" id="d-desf" role="status"><span>Concluído.</span><button type="button" id="d-desf-b">Desfazer</button></div>

<script src="/catalogo.js"></script>
<script src="/base.js?v=4"></script>
<script>
'use strict';
// =====================================================================================
// ChronoCut — o timer do editor.
// Regra de ouro: o tempo NUNCA sai de um contador na tela. Cada registro guarda início, fim e pausas,
// e toda conta é feita em cima desses horários. Por isso fechar a aba ou trocar de aparelho não perde nada.
// =====================================================================================
const PACK = 'fl-timer';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = Base.esc, brl = v => 'R$ ' + (+v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const calmo = matchMedia('(prefers-reduced-motion: reduce)').matches;
const api = (c, o) => Base.api(c, o);
const TIPOS = { reels:'Reels', anuncio:'Anúncio', youtube:'YouTube', institucional:'Institucional', evento:'Evento', outro:'Outro' };
const CAT = { trabalho:'Trabalho ativo', revisao:'Revisões', espera:'Processamento e espera', outro:'Outras atividades' };
const ETAPAS_PADRAO = [
  { n:'Organização do material', c:'trabalho' }, { n:'Seleção de cenas', c:'trabalho' }, { n:'Corte e montagem', c:'trabalho' }, { n:'Áudio', c:'trabalho' }, { n:'Cor', c:'trabalho' },
  { n:'Legendas e títulos', c:'trabalho' }, { n:'Animações e efeitos', c:'trabalho' }, { n:'Revisão', c:'revisao' }, { n:'Exportação e entrega', c:'trabalho' },
  { n:'Briefing', c:'outro' }, { n:'Reunião', c:'outro' }, { n:'Organização geral', c:'outro' } ];
const CFG_PADRAO = { etapas: null, foco: 0, descanso: 0, som: false, atalhos: { pausa: '', fim: '' } };

let PJ = [], RG = [], CFG = { ...CFG_PADRAO }, ABA = 'agora', SEL = null, ETP = null, REVN = 1, REVT = 'cliente', OBJ = '', pip = null;
const mem = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const etapas = () => (Array.isArray(CFG.etapas) && CFG.etapas.length ? CFG.etapas : ETAPAS_PADRAO);
const catDe = n => (etapas().find(e => e.n === n) || {}).c || 'trabalho';

// ---------- tempo ----------
const ms = d => +new Date(d);
function dur(r, agora = Date.now()){            // tempo ativo de um registro: (fim − início) − pausas
  const fim = r.fim ? ms(r.fim) : agora; let d = fim - ms(r.inicio);
  for (const p of r.pausas || []) d -= Math.max(0, Math.min(fim, p[1] ? ms(p[1]) : fim) - ms(p[0]));
  return Math.max(0, d);
}
const pausado = r => !!(r && (r.pausas || []).some(p => !p[1]));
const relogio = t => { const s = Math.floor(t / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (h ? h + ':' : '') + String(m).padStart(h ? 2 : 1, '0') + ':' + String(s % 60).padStart(2, '0'); };
const horas = t => { const m = Math.round(t / 60000); if (m < 60) return m + ' min'; const h = Math.floor(m / 60), r = m % 60; return h + 'h' + (r ? String(r).padStart(2, '0') : ''); };
const dataCurta = d => new Date(d).toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit' });
const hora = d => new Date(d).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
const paraCampo = d => { const x = new Date(d), z = n => String(n).padStart(2, '0'); return `${x.getFullYear()}-${z(x.getMonth() + 1)}-${z(x.getDate())}T${z(x.getHours())}:${z(x.getMinutes())}`; };
const hoje = () => paraCampo(Date.now()).slice(0, 10);

const ativo = () => RG.find(r => !r.fim && r.categoria !== 'espera') || null;
const esperas = () => RG.filter(r => !r.fim && r.categoria === 'espera');
const proj = id => PJ.find(p => p.id === id) || null;
function soma(pid){                              // totais de um projeto, por categoria e por etapa
  const o = { trabalho:0, revisao:0, espera:0, outro:0, etapas:{}, rodadas:{ interna:new Set(), cliente:new Set() }, n:0 };
  for (const r of RG) if (r.projeto_id === pid){ const d = dur(r); o[r.categoria] += d; o.n++;
    if (r.categoria !== 'espera') o.etapas[r.etapa] = (o.etapas[r.etapa] || 0) + d;
    if (r.categoria === 'revisao' && r.rev_n) o.rodadas[r.rev_tipo === 'interna' ? 'interna' : 'cliente'].add(r.rev_n); }
  o.ativo = o.trabalho + o.revisao + o.outro;     // o que conta para o valor por hora: sem pausas e sem espera
  return o;
}

// ---------- utilidades de tela ----------
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2800); }
function tela(h){ $('#tela').innerHTML = h; }
function sinc(ok){ const e = $('#sinc'); if (!e) return; e.classList.toggle('erro', !ok); e.lastChild.textContent = ok ? 'Salvo' : 'Sem conexão: não foi salvo'; }
async function grava(fn, msgErro){               // toda gravação passa por aqui: mostra o estado e nunca finge que salvou
  try { const r = await fn(); sinc(true); return r; }
  catch (e){ sinc(false); toast(msgErro || Base.traduz(e.message)); throw e; }
}
async function copia(t){ try { await navigator.clipboard.writeText(t); } catch { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); } }
function folha(titulo, corpo, aoAbrir){
  fechaFolha();
  const d = document.createElement('div'); d.className = 'folha'; d.id = 'folha'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-label', titulo);
  d.innerHTML = `<div class="cx"><div class="fh"><h2>${esc(titulo)}</h2><button class="x" type="button" aria-label="Fechar"><svg viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13"/></svg></button></div>${corpo}</div>`;
  document.body.appendChild(d);
  d.querySelector('.x').onclick = fechaFolha; d.addEventListener('mousedown', e => { if (e.target === d) fechaFolha(); });
  if (aoAbrir) aoAbrir(d); const f = d.querySelector('input,select,button.btn'); if (f) f.focus();
}
function fechaFolha(){ const f = $('#folha'); if (f) f.remove(); }

// ---------- dados ----------
async function carrega(){
  const [p, r, c] = await Promise.all([
    api('/rest/v1/timer_projetos?select=*&order=criado_em.desc'),
    api('/rest/v1/timer_registros?select=*&order=inicio.desc&limit=5000'),
    api('/rest/v1/timer_config?select=dados').catch(() => []) ]);
  PJ = p || []; RG = r || []; CFG = { ...CFG_PADRAO, ...((c && c[0] && c[0].dados) || {}) }; CFG.atalhos = { ...CFG_PADRAO.atalhos, ...(CFG.atalhos || {}) };
  await carregaD();
}
const salvaCfg = () => grava(() => api('/rest/v1/timer_config', { method:'POST', prefer:'resolution=merge-duplicates', body:{ dados: CFG, atualizado_em: new Date().toISOString() } }));
async function recarrega(){ try { await carrega(); sinc(true); } catch { sinc(false); } }

// ---------- o cronômetro ----------
async function inicia(){
  const p = proj(SEL); if (!p) return novoProjeto();
  if (ativo()) return;
  const cat = catDe(ETP), corpo = { projeto_id: p.id, etapa: ETP, categoria: cat, objetivo: OBJ.trim() || null, inicio: new Date().toISOString(), pausas: [] };
  if (cat === 'revisao'){ corpo.rev_n = REVN; corpo.rev_tipo = REVT; }
  try {
    const [r] = await grava(() => api('/rest/v1/timer_registros', { method:'POST', body: corpo, prefer:'return=representation' }), 'Não consegui iniciar.');
    RG.unshift(r); focoIni = Date.now(); focoAvisado = false; descAvisado = Date.now(); avisaOutros(); desenha();
  } catch (e){
    // o servidor só deixa UM cronômetro ligado por pessoa: se já existe (outra aba ou aparelho), mostra ele aqui
    await recarrega(); if (ativo()){ adota(); toast('Já havia um cronômetro ligado em outra aba ou aparelho. Estou mostrando ele aqui.'); } desenha();
  }
}
async function pausa(){
  const r = ativo(); if (!r || pausado(r)) return;
  const q = new Date().toISOString(), ps = [...(r.pausas || []), [q, null]];
  await grava(() => api(`/rest/v1/timer_registros?id=eq.${r.id}`, { method:'PATCH', body:{ pausas: ps } })); r.pausas = ps;
  const d = desafioAberto(); if (d && r.desafio_id === d.id) await pausaD(d, q).catch(() => {});   // o desafio ligado pausa junto
  avisaOutros(); desenha();
}
async function retoma(){
  const r = ativo(); if (!r || !pausado(r)) return;
  const q = new Date().toISOString(), ps = (r.pausas || []).map(p => p[1] ? p : [p[0], q]);
  await grava(() => api(`/rest/v1/timer_registros?id=eq.${r.id}`, { method:'PATCH', body:{ pausas: ps } })); r.pausas = ps; descAvisado = Date.now();
  const d = desafioAberto(); if (d && r.desafio_id === d.id) await retomaD(d, q).catch(() => {});
  avisaOutros(); desenha();
}
async function fecha(r, quando = new Date().toISOString()){      // encerra um registro; pausa aberta fecha junto, no mesmo instante
  const ps = (r.pausas || []).map(p => p[1] ? p : [p[0], ms(p[0]) > ms(quando) ? p[0] : quando]);
  await grava(() => api(`/rest/v1/timer_registros?id=eq.${r.id}`, { method:'PATCH', body:{ fim: quando, pausas: ps } })); r.fim = quando; r.pausas = ps;
}
async function encerra(forca){
  const r = ativo(); if (!r) return;
  const dl = desafioAberto();
  if (!forca && dl && r.desafio_id === dl.id) return folha('Encerrar o desafio também?', `<p class="sub" style="margin:6px 0 0">Esta sessão faz parte do desafio <b style="color:var(--ink)">${esc(dl.titulo)}</b>.</p>
    <div class="pe"><button class="btn ghost" id="ed-so">Só o cronômetro</button><button class="btn" id="ed-dois">Encerrar os dois</button></div>`, f => {
    f.querySelector('#ed-so').onclick = () => { fechaFolha(); encerra(true); };
    f.querySelector('#ed-dois').onclick = () => { fechaFolha(); paraD('parou'); };
  });
  await fecha(r); avisaOutros(); desenha();
  const p = proj(r.projeto_id);
  folha('Sessão salva', `<p class="sub" style="margin:6px 0 0"><b style="color:var(--ink)">${horas(dur(r))}</b> em ${esc(r.etapa)}, no projeto <b style="color:var(--ink)">${esc(p ? p.nome : '')}</b>. Encerrar a sessão não entrega o projeto: você pode continuar depois.</p>
    <div class="pe"><button class="btn ghost" id="f-dep">Continuar depois</button><button class="btn" id="f-conc">Concluir o projeto</button></div>`, d => {
    d.querySelector('#f-dep').onclick = fechaFolha;
    d.querySelector('#f-conc').onclick = async () => { await conclui(p, true); fechaFolha(); };
  });
}
async function trocaEtapa(n){
  if (n === ETP) return; const r = ativo(); ETP = n; mem.set('fl_timer_etp', n);
  if (!r){ return desenha(); }
  // com o cronômetro ligado: fecha o registro da etapa antiga e abre o da nova no MESMO instante (nenhum segundo se perde)
  const agora = new Date().toISOString(), eraPausa = pausado(r), cat = catDe(n);
  const corpo = { projeto_id: r.projeto_id, etapa: n, categoria: cat, objetivo: r.objetivo, inicio: agora, pausas: eraPausa ? [[agora, null]] : [] };
  if (cat === 'revisao'){ corpo.rev_n = REVN; corpo.rev_tipo = REVT; }
  if (r.desafio_id) corpo.desafio_id = r.desafio_id;
  try { await fecha(r, agora); const [novo] = await grava(() => api('/rest/v1/timer_registros', { method:'POST', body: corpo, prefer:'return=representation' })); RG.unshift(novo); avisaOutros(); }
  catch { await recarrega(); }
  desenha();
}
async function conclui(p, sim){
  if (!p) return; const v = sim ? new Date().toISOString() : null;
  if (sim){ const a = ativo(); if (a && a.projeto_id === p.id) await fecha(a); for (const e of esperas().filter(x => x.projeto_id === p.id)) await fecha(e); }
  await grava(() => api(`/rest/v1/timer_projetos?id=eq.${p.id}`, { method:'PATCH', body:{ concluido_em: v, atualizado_em: new Date().toISOString() } })); p.concluido_em = v;
  if (sim && SEL === p.id){ const o = PJ.find(x => !x.concluido_em); SEL = o ? o.id : null; mem.set('fl_timer_sel', SEL || ''); }
  toast(sim ? 'Projeto concluído' : 'Projeto reaberto'); avisaOutros(); desenha();
}
// espera (exportação, upload, download): corre em paralelo e NÃO entra no trabalho ativo
async function esperaIni(){
  const p = proj(SEL); if (!p) return;
  try { const [r] = await grava(() => api('/rest/v1/timer_registros', { method:'POST', prefer:'return=representation', body:{ projeto_id: p.id, etapa: 'Exportação ou envio', categoria: 'espera', inicio: new Date().toISOString(), pausas: [] } })); RG.unshift(r); }
  catch { await recarrega(); }
  avisaOutros(); desenha();
}
async function esperaFim(id){ const r = RG.find(x => x.id === id); if (r){ await fecha(r); avisaOutros(); desenha(); } }
function adota(){ const r = ativo(); if (!r) return; SEL = r.projeto_id; ETP = r.etapa; OBJ = r.objetivo || ''; if (r.rev_n){ REVN = r.rev_n; REVT = r.rev_tipo || 'cliente'; } }

// ---------- foco, descanso e avisos (nada disso pausa o cronômetro sozinho) ----------
let focoIni = Date.now(), focoAvisado = false, descAvisado = Date.now(), aviso = null;
function bip(){ if (!CFG.som) return; try { const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain(); o.frequency.value = 660; g.gain.value = .05; o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + .18); } catch {} }
function confere(){
  const r = ativo(); if (!r || pausado(r)) return;
  if (CFG.foco > 0 && !focoAvisado && Date.now() - focoIni >= CFG.foco * 60000){ focoAvisado = true; aviso = { t: `Bloco de ${CFG.foco} min concluído.`, k: 'foco' }; bip(); desenha(); }
  else if (CFG.descanso > 0 && !aviso && Date.now() - descAvisado >= CFG.descanso * 60000){ descAvisado = Date.now(); aviso = { t: `Você está há ${CFG.descanso} min direto. Uma pausa curta ajuda.`, k: 'desc' }; bip(); desenha(); }
  // estimativa: avisa uma vez em 80% e uma vez ao passar (fica guardado, não repete)
  const p = proj(r.projeto_id); if (p && +p.horas_est > 0){ const f = soma(p.id).ativo / (p.horas_est * 3600000), k = 'fl_timer_est_' + p.id, ja = +mem.get(k) || 0;
    if (f >= 1 && ja < 100){ mem.set(k, '100'); toast(`"${p.nome}" passou da estimativa de ${String(+p.horas_est).replace('.', ',')}h.`); }
    else if (f >= .8 && ja < 80){ mem.set(k, '80'); toast(`"${p.nome}" chegou a 80% da estimativa.`); } }
}

// ===================== CRONÔMETRO =====================

  $$('.foco .seg button').forEach(b => b.onclick = () => { if (b.dataset.f !== 'x') return poeFoco(b.dataset.f);
    folha('Bloco de foco', `<label for="fc-m">Quantos minutos tem o seu bloco?</label><input class="inp" id="fc-m" inputmode="numeric" value="${[0,25,50].includes(+CFG.foco) ? 40 : CFG.foco}"><p class="dica" style="margin-top:8px">Quando o bloco termina, aparece um aviso. O cronômetro continua contando até você decidir.</p><div class="pe"><button class="btn" id="fc-ok">Usar esse tempo</button></div>`, d => {
      d.querySelector('#fc-ok').onclick = () => { const v = parseInt(d.querySelector('#fc-m').value, 10); if (!(v > 0 && v <= 240)) return toast('Use um número entre 1 e 240'); fechaFolha(); poeFoco(v); }; }); });

  liga('#flut', flutua); liga('#manual', () => editaRegistro(null, SEL)); liga('#d-faixa', () => { ABA = 'desafio'; desenha(); });

function tique(){

      const corpo = { etapa, categoria: cat, inicio: i.toISOString(), fim: f ? f.toISOString() : null, pausas: pm ? [[i.toISOString(), new Date(+i + pm * 60000).toISOString()]] : [] };

      try {
        if (novo){ const [n] = await grava(() => api('/rest/v1/timer_registros', { method:'POST', prefer:'return=representation', body:{ ...corpo, projeto_id: q('#rg-p').value, manual: true } })); RG.push(n); RG.sort((a, b) => ms(b.inicio) - ms(a.inicio)); }

}

// ===================== DESAFIO (modo foco com prazo) =====================
// O desafio é um PRAZO que a pessoa se dá. O tempo de TRABALHO continua só nos registros:
// um desafio ligado a projeto usa o mesmo registro do cronômetro (desafio_id), então nada conta duas vezes.
// Regra de ouro vale aqui também: tudo sai de horários (início, pausas, fim), nunca de um contador.
let DS = [], DES = false, DESVIO = 0, DF = { marcos: {} }, RES = null, FD = null, dLaco = 0, dAgenda = 0, dTrava = null, dPreT = 0;

const cfgD = () => ({ ...CFGD_PADRAO, ...(CFG.desafio || {}) });

const pausadoD = d => !!(d && (d.pausas || []).some(p => !p[1]));

// ---------- motor (funções puras: recebem o "agora" de fora) ----------
const Dm = {
  pausaTotal: (d, t) => (d.pausas || []).reduce((a, [i, f]) => a + Math.max(0, Math.min(t, f ? ms(f) : t) - ms(i)), 0),
  usado: (d, t) => { const fim = d.fim ? ms(d.fim) : t; return Math.max(0, fim - ms(d.inicio) - Dm.pausaTotal(d, fim)); },
  prazo: d => (d.plano_s + (d.extra_s || 0)) * 1000,
  restante: (d, t) => Dm.prazo(d) - Dm.usado(d, t),
  fracao: (d, t) => Math.min(1, Dm.usado(d, t) / Dm.prazo(d)),
  reta: d => Math.min(300000, Dm.prazo(d) * .2),                     // reta final: últimos 5 min, ou 20% em desafios curtos
  terminaEm: (d, t) => ms(d.inicio) + Dm.prazo(d) + Dm.pausaTotal(d, t),
  fase(d, t){ if (d.fim) return 'fechado'; if (pausadoD(d)) return 'pausado'; const r = Dm.restante(d, t);
    if (r <= 0) return 'esgotado'; if (r <= Dm.reta(d)) return 'reta'; if (Dm.usado(d, t) >= d.plano_s * 500) return 'segunda'; return 'primeira'; }
};
// classe do resultado: sempre calculada do tempo real de foco contra o plano ORIGINAL (os +N são tempo extra)
function classeD(plano, usado){
  const econ = plano - usado, tol = Math.max(60000, plano * .05);
  if (econ >= plano * .25 && econ <= plano * .5) return 'voou';
  if (econ >= tol) return 'antes';            // inclui folga acima de 50%: estimativa folgada (não premia inflar o plano)
  if (econ > -tol) return 'prazo';
  return 'depois';
}
const tcod = t => { const s = Math.max(0, Math.round(t / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s % 60).padStart(2, '0'); };
const minExt = t => { const m = Math.round(t / 60000); if (m < 60) return m + (m === 1 ? ' minuto' : ' minutos'); const h = Math.floor(m / 60), r = m % 60; return h + 'h' + (r ? String(r).padStart(2, '0') : ''); };

function frase(k){   // nunca repete nenhuma das 3 últimas daquele grupo
  let v = {}; try { v = JSON.parse(mem.get('fl_timer_frases') || '{}') || {}; } catch {}
  const vistas = v[k] || [], op = FRASES[k].filter(f => !vistas.includes(f)), f = op[Math.floor(Math.random() * op.length)] || FRASES[k][0];
  v[k] = [f, ...vistas].slice(0, 3); mem.set('fl_timer_frases', JSON.stringify(v)); return f;
}

function planoFD(){

  let t, aviso = '', erro = '', amanha = false;
  if (f.modoT === 'dur'){
    if (f.m > 59 || f.s > 59) return { erro: 'Minutos e segundos vão de 0 a 59.' };
    t = (f.h * 3600 + f.m * 60 + f.s) * 1000;
  } else {
    if (!f.ate) return { erro: 'Escolha o horário.' };
    const [H, M] = f.ate.split(':').map(Number), alvo = new Date(agoraD()); alvo.setHours(H, M, 0, 0);
    if (+alvo <= agoraD()){ alvo.setDate(alvo.getDate() + 1); amanha = true; }
    t = Math.round((+alvo - agoraD()) / 1000) * 1000;
  }
  if (t < 60000) erro = 'O desafio precisa de pelo menos 1 minuto.';
  else if (t > 8 * 3600000) erro = 'O máximo é 8 horas. Para mais que isso, divida em dois desafios.';

}

    projeto_id: c.projeto_id, etapa: c.etapa, inicio: q, pausas: [] } }), 'Não consegui começar o desafio.'); }

async function pausaD(d, q){ if (!d || pausadoD(d)) return; await patchD(d, { pausas: [...(d.pausas || []), [q, null]] }); }

    else { if (r && !pausado(r)) await pausa(); else await pausaD(d, new Date(agoraD()).toISOString()); som('pausa'); soltaTela(); }

async function entregaD(delta){

}

  </section>`);
  const repetir = msPlano => { const s = Math.round(msPlano / 1000); FD = { ...novoFD(), livre: d.origem !== 'etapa', titulo: d.titulo, etapa: d.etapa || novoFD().etapa, etapaManual: true, projeto: d.projeto_id && proj(d.projeto_id) && !proj(d.projeto_id).concluido_em ? d.projeto_id : '', tempo: 'livre', modoT: 'dur', h: Math.floor(s / 3600), m: Math.floor(s % 3600 / 60), s: s % 60 }; RES = null; saiTelaCheia(); desenha(); };
  if ($('#dr-rep')) $('#dr-rep').onclick = e => repetir(+e.currentTarget.dataset.ms);
  $('#dr-novo').onclick = () => { RES = null; FD = null; saiTelaCheia(); desenha(); };
  $('#dr-hist').onclick = () => { RES = null; saiTelaCheia(); ABA = 'historico'; desenha(); };
  if (parou) return;
  if ($('#d-pular')) $('#d-pular').onclick = () => pulaAnim();
  $('#d-res').addEventListener('pointerdown', e => { if ($('#d-res').classList.contains('anim') && !e.target.closest('button')) pulaAnim(); });
  animaD(R, anima, cel === 'discretas');
  R.anim = false;                                         // redesenhar (outra aba, recarga) não repete a festa
}
function pulaAnim(semSom){
  const r = $('#d-res'), tocando = r && r.classList.contains('anim'); RT.forEach(clearTimeout); RT = [];
  if (r && r._final) r._final(); if (tocando && !semSom && RES && !r._som) som(RES.k);
}
addEventListener('keydown', e => { if (e.key === 'Escape' && $('#d-res.anim')) pulaAnim(); });
// coreografia (≈2,2 s): só transform, opacity e width. Pular leva ao quadro final idêntico.
function animaD(R, anima, discreta){
  RT.forEach(clearTimeout); RT = [];
  const k = R.k, pl = R.pl, u = R.u, esc_ = Math.max(pl, u), fu = u / esc_, fp = pl / esc_, res = $('#d-res'), pal = $('#d-palco');
  const uso = $('#dr-uso'), sob = $('#dr-sobra'), ext = $('#dr-extra'), lam = $('#dr-lam'), fim = $('#dr-fim'), cort = $('#dr-cort'), fa = $('#dr-fa');
  pal.classList.toggle('ima', k === 'prazo');
  $('#dr-pp').style.width = (fp * 100) + '%'; uso.style.background = k === 'depois' ? 'var(--ink)' : 'var(--ok)';
  sob.style.left = (fu * 100) + '%'; sob.style.width = Math.max(0, fp - fu) * 100 + '%';
  ext.style.left = (fp * 100) + '%'; lam.style.left = (fu * 100) + '%'; fim.style.left = (fp * 100) + '%'; cort.style.left = (fu * 100) + '%'; fa.style.left = (fu * 100) + '%';
  const textoCorte = k === 'depois' ? `+${horas(u - pl)} extra` : `−${horas(pl - u)} cortados`;
  const final = () => {
    [uso, sob, ext, lam].forEach(e => e.style.transition = 'none');
    uso.style.width = (Math.min(fu, fp) * 100) + '%'; lam.style.opacity = '0'; sob.style.opacity = '0';
    if (k === 'voou' || k === 'antes'){ fim.style.left = (fu * 100) + '%'; cort.textContent = textoCorte; cort.classList.add('on'); }
    if (k === 'depois'){ ext.style.width = ((fu - fp) * 100) + '%'; cort.style.left = '100%'; cort.classList.add('dir', 'on'); cort.textContent = textoCorte; }
    if (k === 'prazo') uso.style.width = (fp * 100) + '%';
    res.classList.remove('anim'); res.classList.add('final'); fa.innerHTML = '';
    $$('#d-res .bar i').forEach(i => i.style.width = i.dataset.w + '%');
  };
  res._final = final; res._som = false;
  if (!anima){ final(); if (R.anim) som(k); return; }
  res.classList.add('anim');
  const t = (q, f) => RT.push(setTimeout(f, q)), tocou = () => { res._som = true; };
  t(30, () => { uso.style.transition = 'width .62s cubic-bezier(.6,0,.2,1)'; uso.style.width = (Math.min(fu, fp) * 100) + '%'; });
  if (k === 'voou' || k === 'antes'){
    t(380, () => { sob.style.transition = 'opacity .2s'; sob.style.opacity = '1'; });
    t(640, () => { som('lamina'); lam.style.transition = 'transform .18s cubic-bezier(.7,0,.3,1), opacity .1s'; lam.style.opacity = '1'; lam.style.transform = 'scaleY(1)'; });
    t(800, () => { if (!discreta){ faisca(fa, k === 'voou' ? 14 : 8, k === 'voou' ? 10 : 4); try { navigator.vibrate && navigator.vibrate(k === 'voou' ? [12, 40, 18] : 12); } catch {} } });
    t(860, () => { som('cai'); sob.style.transition = 'transform .6s cubic-bezier(.5,0,.75,0), opacity .6s'; sob.style.transform = 'translateY(56px) rotate(7deg)'; sob.style.opacity = '0'; });
    t(1000, () => { fim.classList.add('mov'); fim.style.left = (fu * 100) + '%'; lam.style.transition = 'opacity .3s'; lam.style.opacity = '0'; });
    t(1250, () => { som(k); tocou(); cort.classList.add('on'); conta(cort, Math.round((pl - u) / 60000), n => `−${n} min cortados`, textoCorte); });
  } else if (k === 'prazo'){
    t(700, () => { som('prazo'); tocou(); fa.style.left = (fp * 100) + '%'; if (!discreta) faisca(fa, 8, 0, true); });
  } else {
    t(700, () => { som('depois'); tocou(); ext.style.transition = 'width .7s cubic-bezier(.2,.7,.2,1)'; ext.style.width = ((fu - fp) * 100) + '%'; });
    t(1300, () => { cort.style.left = '100%'; cort.classList.add('dir', 'on'); cort.textContent = textoCorte; });
  }
  t(1500, () => { $$('#d-res .bar i').forEach(i => i.style.width = i.dataset.w + '%'); res.classList.add('final');
    $$('#d-res .l.dest b').forEach(b => { const alvo = b.textContent, m = alvo.match(/\d+/); if (m) conta(b, +m[0], n => alvo.replace(/\d+/, n), alvo); }); });
  t(2400, () => { res._final = null; final(); });
}
function faisca(el, linhas, quadros, verde){
  el.innerHTML = Array.from({ length: linhas }, (_, i) => `<i style="--r:${-90 + (i - (linhas - 1) / 2) * (150 / linhas)}deg${verde ? ';background:var(--ok)' : ''}"></i>`).join('') +
    Array.from({ length: quadros }, () => { const a = Math.random() * Math.PI, dd = 40 + Math.random() * 70; return `<i class="f" style="--dx:${(Math.cos(a) * dd * (Math.random() < .5 ? -1 : 1)).toFixed(1)}px;--dy:${(-Math.sin(a) * dd + 30).toFixed(1)}px;--rr:${((Math.random() - .5) * 260).toFixed(0)}deg"></i>`; }).join('');
}
// números contam até o valor real; o texto final é sempre o calculado
function conta(el, n, fmt, fimTxt){ const t0 = performance.now(); const f = x => { if (!el.isConnected) return; const p = Math.min(1, (x - t0) / 750), e = 1 - Math.pow(1 - p, 3); el.textContent = p < 1 ? fmt(Math.round(n * e)) : fimTxt; if (p < 1) requestAnimationFrame(f); }; requestAnimationFrame(f); }

// ---------- desafio esquecido: página fechada e o prazo passou há mais de 10 min ----------
function confereDesafioEsquecido(){
  const d = desafioAberto(); if (!d || pausadoD(d)) return false;
  const t = agoraD(), vivo = +mem.get('fl_timer_vivo') || 0, r = Dm.restante(d, t);
  if (r > -600000 || t - Math.max(vivo, ms(d.inicio)) < 600000) return false;
  const padrao = Math.min(Math.max(vivo, ms(d.inicio) + 60000), Dm.terminaEm(d, t));
  folha('O desafio ficou aberto', `<p class="sub" style="margin:6px 0 0">“<b style="color:var(--ink)">${esc(d.titulo)}</b>” começou ${dataCurta(d.inicio)} às ${hora(d.inicio)} e o prazo terminou às ${hora(Dm.terminaEm(d, t))}. A página ficou fechada desde então.</p>
    <label for="de-f">Se você parou antes, a que horas foi?</label><input class="inp" id="de-f" type="datetime-local" value="${paraCampo(padrao)}">
    <div class="pe"><button class="btn ghost" id="de-c">Ainda estou nele</button><button class="btn ghost" id="de-p">Parei sem terminar</button><button class="btn" id="de-t">Terminei nesse horário</button></div>`, f => {
    const quando = () => { const x = new Date(f.querySelector('#de-f').value); if (isNaN(x) || x <= new Date(d.inicio) || x > Date.now()){ toast('Escolha um horário entre o início e agora'); return 0; } return +x; };
    f.querySelector('#de-c').onclick = fechaFolha;
    f.querySelector('#de-p').onclick = async () => { const q = quando(); if (!q) return; fechaFolha(); await paraD('parou', q); };
    f.querySelector('#de-t').onclick = async () => { const q = quando(); if (!q) return; fechaFolha(); ABA = 'desafio'; await concluiD(q); };
  });
  return true;
}

$('#d-desf-b').onclick = desfazD;

// ---------- outras abas e aparelhos ----------
let canal = null; try { canal = new BroadcastChannel('fl-timer'); canal.onmessage = async () => { await recarrega(); desenha(); }; } catch {}
const avisaOutros = () => { try { canal && canal.postMessage(1); } catch {} };
// sessão que ficou ligada com a página fechada: pergunta em vez de adivinhar
function confereEsquecida(){
  if (confereDesafioEsquecido()) return;
  const a = ativo(); if (!a || pausado(a)) return;
  const dl = desafioAberto(); if (dl && a.desafio_id === dl.id) return;
  const vivo = +mem.get('fl_timer_vivo') || 0, ult = Math.max(vivo, ms(a.inicio)), parado = Date.now() - ult;
  if (parado < 10 * 60000) return;
  folha('O cronômetro ficou ligado', `<p class="sub" style="margin:6px 0 0">A sessão de <b style="color:var(--ink)">${esc((proj(a.projeto_id) || {}).nome || '')}</b> está contando desde ${dataCurta(a.inicio)} às ${hora(a.inicio)}, e esta página ficou fechada por ${horas(parado)}.</p>
    <label for="eq-f">Se você parou antes, a que horas foi?</label><input class="inp" id="eq-f" type="datetime-local" value="${paraCampo(ult)}">
    <div class="pe"><button class="btn ghost" id="eq-c">Eu continuei trabalhando</button><button class="btn" id="eq-ok">Encerrar nesse horário</button></div>`, d => {
    d.querySelector('#eq-c').onclick = fechaFolha;
    d.querySelector('#eq-ok').onclick = async () => { const f = new Date(d.querySelector('#eq-f').value); if (isNaN(f) || f <= new Date(a.inicio) || f > Date.now()) return toast('Escolha um horário entre o início e agora'); await fecha(a, f.toISOString()); fechaFolha(); avisaOutros(); desenha(); toast('Sessão encerrada no horário informado'); };
  });
}

// ---------- início ----------
let relogioLigado = false;
async function inicio(){
  topo(); await Base.pronto; await Base.carrega(); topo();
  $('#foot').textContent = 'Os seus registros ficam guardados na sua conta Base FL.';
  if (!Base.tem(PACK)) return vitrine();
  try { await carrega(); } catch (e){ $('#abas').hidden = true; return tela(`<h1>Não consegui abrir.</h1><p class="sub">${esc(Base.traduz(e.message))}</p><button class="btn" onclick="location.reload()">Tentar de novo</button>`); }
  SEL = mem.get('fl_timer_sel') || null; ETP = mem.get('fl_timer_etp') || etapas()[0].n; adota();
  // o ChronoCut abre no Desafio; se o cronômetro já está contando fora de um desafio, abre nele
  await medeDesvio(); if (DES && (desafioAberto() || !ativo())) ABA = 'desafio';
  desenha(); confereEsquecida();
  if (!relogioLigado){ relogioLigado = true;
    setInterval(() => { if (!Base.tem(PACK)) return; tique(); if ((ativo() && !pausado(ativo())) || (desafioAberto() && !pausadoD(desafioAberto()))) mem.set('fl_timer_vivo', String(Date.now())); }, 1000);
    setInterval(confere, 15000);
    setInterval(async () => { if (Base.tem(PACK) && !$('#folha') && document.visibilityState === 'visible'){ const antes = (ativo() || {}).id; await recarrega(); if ((ativo() || {}).id !== antes) desenha(); } }, 45000);   // pega o que mudou em outro aparelho
    addEventListener('beforeunload', () => { if (ativo() && !pausado(ativo())) mem.set('fl_timer_vivo', String(Date.now())); });
  }
}
Base.aoMudar(() => { if (!!Base.sessao() !== ($('#conta')?.textContent === 'Sair')) inicio(); });
inicio();
</script>
