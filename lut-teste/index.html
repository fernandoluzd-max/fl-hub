<!doctype html>
<html lang="pt-BR">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mood — Base FL (teste)</title>
<meta name="description" content="Copie o mood de qualquer vídeo. Escolha a referência, ajuste e baixe a LUT pronta.">
<link rel="icon" type="image/svg+xml" href="/lut/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/lut/favicon-32.png">
<link rel="apple-touch-icon" href="/lut/apple-touch-icon.png">
<meta name="theme-color" content="#141615">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..900&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#111312; --panel:#191C1B; --panel2:#202423; --line:#2B302E; --ink:#F4F0E4; --mute:#B3B4A2; --dim:#6F7066;
  --a:#FF6FAE; --a2:#B45CFF; --ok:#7fce8f;
  --grad:linear-gradient(125deg,#FFB347,#FF6FAE 38%,#B45CFF 70%,#5AB8FF);
  --d:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --m:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--ink);font:16px/1.5 var(--f);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(760px 520px at 88% -8%,rgba(180,92,255,.16),transparent 70%),radial-gradient(620px 420px at -6% 4%,rgba(255,179,71,.07),transparent 70%)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--a);outline-offset:3px;border-radius:10px}
.wrap{position:relative;max-width:1180px;margin:0 auto;padding:16px 18px 48px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.mood{font-family:var(--d);font-weight:800;font-size:30px;line-height:1;letter-spacing:-.02em;display:inline-flex;align-items:baseline;color:var(--ink)}
.mood svg{height:.56em;width:1em;margin:0 .035em;flex:none}
header .de{font-family:var(--m);font-size:10.5px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;padding-left:12px;border-left:1px solid var(--line)}
header .sp{flex:1}
.link{background:none;border:0;color:var(--mute);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.mono{font-family:var(--m);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}

.passos{display:flex;gap:6px;margin-bottom:22px}
.passos div{flex:1;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--dim);padding:9px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);white-space:nowrap;overflow:hidden}
.passos i{flex:none;font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--panel2);border:1px solid var(--line)}
.passos .at{color:var(--ink);border-color:rgba(180,92,255,.55)}
.passos .at i{background:var(--grad);color:#111;border:0}
.passos .ok{color:var(--mute)}
.passos .ok i{background:var(--ok);color:#0b1a10;border:0}
@media (max-width:640px){.passos span{display:none}.passos div{justify-content:center}}

.sobre-t{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sobre-t::before{content:"";width:26px;height:2px;border-radius:2px;background:var(--grad)}
h1{font-family:var(--d);font-weight:800;font-size:clamp(28px,5.2vw,44px);line-height:1.02;letter-spacing:-.03em;margin-bottom:10px;text-wrap:balance}
h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);font-size:15.5px;max-width:60ch;margin-bottom:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;font-weight:750;font-size:16px;border-radius:15px;padding:15px 22px;border:0;background:var(--grad);color:#14070e;transition:transform .12s,filter .15s,box-shadow .2s;box-shadow:0 12px 34px -14px rgba(180,92,255,.85)}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.full{width:100%}
.hide{display:none!important}

/* passo 1 */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;min-height:310px;border-radius:22px;border:1.5px dashed #3d4340;background:var(--panel);cursor:pointer;overflow:hidden;transition:border-color .2s,background .2s,transform .15s}
.drop:hover,.drop.sobre{border-color:var(--a2);background:var(--panel2)}
.drop.sobre{transform:scale(1.01)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop .bola{width:62px;height:62px;border-radius:50%;margin-bottom:6px}
.drop .bola.r{background:var(--grad)}
.drop .bola.v{border:9px solid var(--ink)}
.drop .n{font-family:var(--m);font-size:11.5px;letter-spacing:.16em;color:var(--mute)}
.drop b{font-family:var(--d);font-weight:800;font-size:21px;padding:0 14px}
.drop p{color:var(--mute);font-size:14px;max-width:30ch;padding:0 10px}
.drop>canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0b0c0c}   /* a imagem aparece inteira, em pé ou deitada */
.drop.tem{border-style:solid;border-color:var(--line)}
.drop.tem .txt{display:none}
.drop.lendo::after{content:"Abrindo…";position:absolute;inset:0;display:grid;place-items:center;background:rgba(17,19,18,.82);font-weight:700;z-index:4}
.drop .tag,.drop .troca{position:absolute;top:12px;z-index:2;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(0,0,0,.62);backdrop-filter:blur(6px)}
.drop .tag{left:12px}.drop .troca{right:12px;display:none}
.drop.tem .troca{display:block}
.drop .nota{position:absolute;left:12px;right:12px;bottom:12px;z-index:2;font-size:12px;font-weight:600;padding:7px 10px;border-radius:12px;background:rgba(0,0,0,.66);backdrop-filter:blur(6px);text-align:left;line-height:1.3}
.drop .nota.al{color:#ffcf8a}
.tira{position:absolute;left:10px;right:10px;bottom:10px;z-index:3;display:flex;gap:6px;align-items:flex-end}
.tira button{flex:1;min-width:0;aspect-ratio:16/10;border-radius:9px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;background:#000;max-width:88px}
.tira button.on{border-color:#fff}
.tira canvas{width:100%;height:100%;object-fit:cover;display:block}
.tira+.nota{bottom:auto;top:46px;right:auto}
.acoes{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:20px}
.dica{color:var(--dim);font-size:13px}
.dicas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.dicas div{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px 14px;font-size:13.5px;color:var(--mute);line-height:1.4}
.dicas b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}
@media (max-width:720px){.duo{grid-template-columns:1fr}.drop{min-height:220px}.dicas{grid-template-columns:1fr}}

/* analisando: as duas bolas da marca se encontram */
.junta{position:relative;height:250px;max-width:520px;margin:26px auto 0}
/* as duas bolhas são iguais: mesmo tamanho, mesmo aro, imagem recortada em quadrado antes de entrar (nada escapa do círculo) */
.junta .b{position:absolute;top:50%;width:190px;height:190px;margin-top:-95px;border-radius:50%;padding:4px;background:#FF6FAE}
.junta .b canvas{position:absolute;left:4px;top:4px;width:182px;height:182px;border-radius:50%;display:block}
.junta .b.r{left:calc(50% - 170px);box-shadow:0 0 60px rgba(180,92,255,.5);animation:jr 2.1s cubic-bezier(.6,0,.3,1) both;z-index:2}
.junta .b.v{left:calc(50% - 20px);background:var(--ink);animation:jv 2.1s cubic-bezier(.6,0,.3,1) both;transition:background .5s,box-shadow .7s}
@keyframes jr{from{transform:translateX(-46px)}to{transform:translateX(20px)}}
@keyframes jv{from{transform:translateX(46px)}to{transform:translateX(-20px)}}
/* a transformação: a cor da referência "escorre" para o vídeo. O que aparece é o resultado de verdade, feito com a LUT pronta. */
.junta #jv2{clip-path:circle(0% at 0% 50%);transition:clip-path 1.25s cubic-bezier(.5,0,.2,1)}
.junta.muda #jv2{clip-path:circle(150% at 0% 50%)}
.junta.muda .b.v{background:var(--grad);box-shadow:0 0 70px rgba(255,111,174,.45)}
.junta .luz{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:#fff;opacity:0;pointer-events:none;z-index:3}
.junta.muda .luz{animation:jluz 1.1s ease-out both}
@keyframes jluz{0%{opacity:.8;transform:scale(.4)}40%{opacity:.28}100%{opacity:0;transform:scale(12)}}
.junta.muda .b.r{animation:jr 2.1s cubic-bezier(.6,0,.3,1) both,jpulso .7s ease both}
@keyframes jpulso{50%{box-shadow:0 0 90px rgba(255,111,174,.9)}}
.scan-t{text-align:center;margin-top:10px;color:var(--mute);font-weight:600;min-height:24px}
.barra{max-width:300px;height:5px;border-radius:5px;background:var(--panel2);margin:14px auto 0;overflow:hidden}
.barra i{display:block;height:100%;width:0;background:var(--grad);border-radius:5px;transition:width .5s ease}

/* passo 2 */
.ed{display:grid;grid-template-columns:minmax(0,1fr) 372px;grid-template-areas:"a b" "c b";gap:14px 18px;align-items:start}
.pvw{grid-area:a;min-width:0}.painel{grid-area:b}.extras{grid-area:c;min-width:0}
.modos{display:inline-flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:4px;margin-bottom:10px}
.md{cursor:pointer;border:0;background:none;font-weight:700;font-size:13px;color:var(--mute);padding:7px 12px;border-radius:9px}
.md.on{background:var(--ink);color:#111}
/* a prévia acompanha o formato do vídeo (em pé ou deitado) e nunca passa da altura da tela */
.ed{--ar:1.7778;--mh:min(68vh,640px)}
.pv{width:min(100%,calc(var(--mh) * var(--ar)));margin:0 auto;position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#0e0f0f;touch-action:none;user-select:none;-webkit-user-select:none}
.pv canvas{display:block;width:100%;height:auto}
.pv .dep{position:absolute;inset:0;width:100%;height:100%}
.pv .corte{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 14px rgba(255,255,255,.7);z-index:2;cursor:ew-resize}
.pv .corte span{position:absolute;top:50%;left:50%;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.45);display:grid;place-items:center;color:#111;font-weight:900;font-size:13px;letter-spacing:2px}
.tg{position:absolute;top:12px;z-index:3;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);pointer-events:none}
.tg.l{left:12px}.tg.r{right:12px;background:var(--grad);color:#111}
.lado{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(100%,calc(var(--mh) * var(--ar) * 2 + 8px));margin:0 auto}
.lado figure{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#0e0f0f;aspect-ratio:var(--ar);margin:0}
.lado canvas{width:100%;height:100%;object-fit:contain;display:block}
.pals{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.pal{display:flex;border-radius:9px;overflow:hidden;height:26px}
.pal i{flex:1;transition:background .25s}
.cenas{margin-top:16px}
.perfil{margin:18px 0 4px}.perfil .mono{display:block;margin-bottom:9px}.pfs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pf{font:inherit;text-align:left;cursor:pointer;padding:10px 12px;border-radius:13px;border:1px solid var(--line);background:var(--panel);color:inherit}
.pf b{display:block;font-size:14px}.pf small{display:block;color:var(--mute);font-size:11.5px;margin-top:2px;line-height:1.3}
.pf.on{background:linear-gradient(var(--panel2),var(--panel2)) padding-box,var(--grad) border-box;border:1.5px solid transparent}
.pfn{color:var(--mute);font-size:12.5px;margin-top:8px;min-height:1em}
@media (max-width:640px){.pfs{grid-template-columns:1fr 1fr}}
.guia{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:6px;background:linear-gradient(var(--panel2),var(--panel2)) padding-box,linear-gradient(125deg,rgba(255,179,71,.5),rgba(180,92,255,.5)) border-box;border:1px solid transparent}
.gcab{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:6px}.gcab b{display:block;font-size:14.5px}.gcab small{display:block;color:var(--mute);font-size:12px;margin-top:2px;max-width:420px}
.gtudo{padding:10px 14px;font-size:13.5px;border-radius:11px;flex:none}
.gi{display:grid;grid-template-columns:118px 1fr 190px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.gi:first-child{border-top:0}
.gi .gn b{display:block;font-size:13.5px}.gi .gn small{color:var(--mute);font-size:11.5px}
.gm{position:relative;height:30px}.gm .tr{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:4px;background:rgba(255,255,255,.12)}
.gm .ok{position:absolute;top:8px;height:14px;border-radius:5px;background:rgba(123,224,160,.35);border:1px solid rgba(123,224,160,.8)}
.gm .eu{position:absolute;top:5px;width:20px;height:20px;border-radius:50%;transform:translateX(-50%);background:var(--grad);border:2.5px solid #111;box-shadow:0 0 0 1px rgba(255,255,255,.3)}
.gm .rf{position:absolute;top:7px;width:2px;height:16px;transform:translateX(-50%);background:#fff;opacity:.8}
.gm .ex{position:absolute;top:24px;font-size:10px;color:var(--mute)}.gm .ex.l{left:0}.gm .ex.r{right:0}
.ga{display:flex;align-items:center;gap:8px;justify-content:flex-end;font-size:12.5px;text-align:right}.ga .st{color:#7BE0A0}.ga .fz{color:#FFB347}
.ga button{font:inherit;font-size:12px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:inherit;cursor:pointer;white-space:nowrap}.ga button:hover{border-color:#FF6FAE}
.gnota{color:var(--mute);font-size:11.5px;margin-top:8px}
@media (max-width:640px){.gcab{flex-direction:column;align-items:stretch}.gi{grid-template-columns:1fr;gap:6px}.ga{justify-content:space-between;text-align:left}}
.lsub{color:var(--mute);font-size:12.5px;margin:-4px 0 10px}
.lres{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.lres span{font-size:12.5px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel2)}
.lres span.ok{border-color:rgba(123,224,160,.45)}.lres span.al{border-color:rgba(255,179,71,.55)}
.lcard{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:rgba(255,255,255,.015)}
.lcab{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}.lcab b{font-size:14px}.lcab span{color:var(--mute);font-size:12px}
.lluz{width:100%;height:96px;display:block;border-radius:10px}
.lzon{display:flex;justify-content:space-between;color:var(--mute);font-size:11px;margin-top:4px;font-family:var(--m);letter-spacing:.06em;text-transform:uppercase}
.lleg{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:12px;margin-top:8px}.lleg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:6px}.lleg i:first-child{margin-left:0}
.lleg i.r{background:rgba(255,255,255,.55)}.lleg i.r.o{background:transparent;border:2px solid #fff;border-radius:50%}.lleg i.v{background:var(--grad);border-radius:50%}
.lfr{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}.lfr li{font-size:13.5px;display:flex;gap:8px;align-items:baseline}.lfr li b{flex:none;width:18px;text-align:center}
.ldois{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start}.scp canvas.ltom{width:200px;height:200px;display:block;background:transparent}
.lsat{position:relative;height:26px;margin-top:4px}.lsat .trilho{position:absolute;inset:9px 0;border-radius:6px;background:linear-gradient(90deg,#8a8a8a,#b98d6a 50%,#ff5a3c)}
.lsat i{position:absolute;top:2px;width:22px;height:22px;border-radius:50%;transform:translateX(-50%);border:2.5px solid #111}.lsat i.mr{background:#fff}.lsat i.mv{background:var(--grad)}
details.pro{margin-top:12px}details.pro summary{cursor:pointer;color:var(--mute);font-size:12.5px}details.pro .tabs{margin-top:10px}
@media (max-width:640px){.ldois{grid-template-columns:1fr}.ltom{margin:0 auto}}
.scp{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.scp .tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.scp .tabs button{font:inherit;font-size:12px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--mute);cursor:pointer}
.scp .tabs button.on{color:#111;background:var(--grad);border-color:transparent}
.scp .par{display:grid;grid-template-columns:1fr 1fr;gap:10px}.scp figure{margin:0}.scp canvas{width:100%;display:block;border-radius:10px;background:#000;image-rendering:auto}
.scp figcaption{font-size:11px;color:var(--mute);margin-top:4px;font-family:var(--m);letter-spacing:.08em;text-transform:uppercase}
.qa{margin-top:12px;display:grid;gap:6px}.qa div{display:flex;gap:8px;align-items:baseline;font-size:13px}.qa b{flex:none;width:18px;text-align:center}.qa small{color:var(--mute);margin-left:auto;font-family:var(--m);font-size:11px}
@media (max-width:640px){.scp .par{grid-template-columns:1fr}}
.cenas h3{font-size:14px;font-weight:700;margin-bottom:4px}
.cenas p{color:var(--mute);font-size:13px;margin-bottom:10px}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(100%,calc(var(--mh) * var(--ar) * 1.5));}
.cn{position:relative;aspect-ratio:var(--ar);border-radius:14px;overflow:hidden;border:1.5px dashed #3d4340;background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--mute);font-size:13px;font-weight:600;text-align:center}
.cn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.cn canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cn.tem{border-style:solid;border-color:var(--line)}
.cn .x{position:absolute;right:6px;top:6px;z-index:3;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:13px;cursor:pointer;display:none}
.cn.tem .x{display:block}

.painel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px}
.med{display:flex;align-items:center;gap:14px;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.med .anel{flex:none;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(from 210deg,#FFB347,#FF6FAE,#B45CFF,#5AB8FF var(--p,0%),#2c322e 0);transition:--p .3s}
.med .anel b{width:60px;height:60px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-family:var(--d);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.med strong{display:block;font-size:15px;line-height:1.25}
.med small{display:block;color:var(--mute);font-size:12.5px;line-height:1.35;margin-top:2px}
.painel .mono{display:block;margin-bottom:9px}
.est{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:16px}
.es{cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:10px 6px;text-align:center;transition:border-color .15s,background .15s}
.es b{display:block;font-size:14px}.es small{display:block;color:var(--mute);font-size:11.5px;line-height:1.25}
.es.on{border-color:transparent;background:linear-gradient(var(--panel2),var(--panel2)) padding-box,var(--grad) border-box;border:1.5px solid transparent}
.ctl{margin-bottom:14px}

<script>
// ===================== CONFIG =====================
const PACK = 'fl-lut';
const NOME_LUT = 'LUT Base FL';     // nome fixo das LUTs: a pessoa não escolhe nem edita
const N = 33;                       // tamanho padrão do .cube

// ===================== utilidades =====================
const $ = s => document.querySelector(s);
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch {} } };
const calmo = matchMedia('(prefers-reduced-motion: reduce)').matches;
const espera = ms => new Promise(r => setTimeout(r, calmo ? Math.min(ms, 60) : ms));
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 3200); }
function tela(html){ const m = $('#tela'); m.className = 'entra'; m.innerHTML = html; window.scrollTo({ top:0 }); }
function passos(at){
  const P = ['Referência e seu vídeo','Ajuste','Pronto'];
  $('#passos').innerHTML = P.map((p, i) => `<div class="${i < at ? 'ok' : i === at ? 'at' : ''}"><i>${i < at ? '✓' : i + 1}</i><span>${p}</span></div>`).join('');
}

// ===================== cor: sRGB <-> Lab =====================
const lin = c => c <= .04045 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4);
const gam = c => c <= .0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - .055;
const fL = t => t > .008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;
const fI = t => t > .206893 ? t * t * t : (t - 16 / 116) / 7.787;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const suave = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
function lab(r, g, b){   // r,g,b em 0..1
  r = lin(r); g = lin(g); b = lin(b);
  const x = (.4124564*r + .3575761*g + .1804375*b) / .95047, y = .2126729*r + .7151522*g + .072175*b, z = (.0193339*r + .119192*g + .9503041*b) / 1.08883;
  const fx = fL(x), fy = fL(y), fz = fL(z);
  return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
}
function linear(L, a, b){   // Lab -> RGB linear (pode sair da faixa 0..1)
  const fy = (L + 16) / 116, fx = fy + a / 500, fz = fy - b / 200;
  const x = fI(fx) * .95047, y = fI(fy), z = fI(fz) * 1.08883;
  return [3.2404542*x - 1.5371385*y - .4985314*z, -.969266*x + 1.8760108*y + .041556*z, .0556434*x - .2040259*y + 1.0572252*z];
}
function rgb(L, a, b){   // Lab -> sRGB. Cor que não cabe na tela perde saturação aos poucos, sem mudar de tom.
  let v = linear(L, a, b);
  const fora = v => v[0] < -.0005 || v[1] < -.0005 || v[2] < -.0005 || v[0] > 1.0005 || v[1] > 1.0005 || v[2] > 1.0005;
  if (fora(v)){
    let lo = 0, hi = 1;
    for (let i = 0; i < 7; i++){ const m = (lo + hi) / 2; if (fora(linear(L, a * m, b * m))) hi = m; else lo = m; }
    v = linear(L, a * lo, b * lo);
  }
  return [gam(clamp(v[0], 0, 1)), gam(clamp(v[1], 0, 1)), gam(clamp(v[2], 0, 1))];
}

// ===================== GRAVADO EM LOG =====================
// Converte o sinal Log da câmera para imagem normal (Rec.709) com as fórmulas oficiais publicadas pelos fabricantes:
// curva Log -> luz da cena -> cores da câmera para Rec.709 -> curva de exibição suave (sem estourar) -> tela.
// O valor que o navegador entrega é o sinal do arquivo (faixa de vídeo já esticada para 0..1).
const PERFIS = {
  normal: { nome:'Normal', curto:'Normal', dica:'Gravou no modo normal da câmera ou do celular' },
  applelog: { nome:'Apple Log (iPhone)', curto:'Apple Log', dica:'iPhone 15 Pro em diante',
    dec: v => { const R0 = -.05641088, sg = 47.28711236, Pt = sg * (.01 - R0) ** 2; return v >= Pt ? Math.pow(2, (v - .69336945) / .08550479) - .00964052 : v >= 0 ? Math.sqrt(v / sg) + R0 : R0; },
    M: [[1.660491, -.58764114, -.07284986], [-.12455047, 1.1328999, -.00834942], [-.01815076, -.1005789, 1.11872966]] },
  slog3: { nome:'Sony S-Log3 · S-Gamut3.Cine', curto:'S-Log3', dica:'Sony A7, FX3, FX30, ZV-E1…',
    dec: v => { const y = (64 + 876 * v) / 1023; return y >= 171.2102946929 / 1023 ? Math.pow(10, (y * 1023 - 420) / 261.5) * .19 - .01 : (y * 1023 - 95) * .01125 / (171.2102946929 - 95); },
    M: [[1.62694741, -.54013854, -.08680887], [-.17851553, 1.41794093, -.2394254], [-.04443611, -.19591997, 1.24035608]] },
  slog2: { nome:'Sony S-Log2 · S-Gamut', curto:'S-Log2', dica:'Sony A7 III, A6500 e anteriores',
    dec: v => (v >= .030001222851889303 ? Math.pow(10, (v - .646596) / .432699) - .037584 : (v - .030001222851889303) / 5) * .9 * 219 / 155,
    M: [[1.87791513, -.79416876, -.08374637], [-.17680698, 1.35099962, -.17419264], [-.02620113, -.14842226, 1.17462339]] },
};
let PERFIL = (() => { const p = store.get('fl_mood_perfil'); return PERFIS[p] && p !== 'normal' ? p : null; })();
const exibe = x => { x = Math.max(0, x) * .6; return clamp(x * (2.51 * x + .03) / (x * (2.43 * x + .59) + .14), 0, 1); };   // curva de exibição com roll-off (cinza 18% vai a ~41%)
function entrada(r, g, b, o){   // sinal do arquivo -> imagem normal (sRGB 0..1)
  const P = PERFIL && PERFIS[PERFIL]; if (!P){ o[0] = r; o[1] = g; o[2] = b; return o; }
  const lr = P.dec(r), lg = P.dec(g), lb = P.dec(b), M = P.M;
  let R = M[0][0]*lr + M[0][1]*lg + M[0][2]*lb, G = M[1][0]*lr + M[1][1]*lg + M[1][2]*lb, B = M[2][0]*lr + M[2][1]*lg + M[2][2]*lb;
  // cor que não cabe no Rec.709: perde saturação em direção ao cinza da mesma luz (mantém o tom, sem canal negativo)
  const Y = .2126*R + .7152*G + .0722*B, mn = Math.min(R, G, B);
  if (mn < 0 && Y > 0){ const t = Y / (Y - mn); R = Y + (R - Y) * t; G = Y + (G - Y) * t; B = Y + (B - Y) * t; }
  o[0] = gam(exibe(R)); o[1] = gam(exibe(G)); o[2] = gam(exibe(B)); return o;
}
function paraNormal(cv){   // canvas em Log -> canvas normal (para mostrar o "antes" de verdade)
  if (!PERFIL) return cv;
  const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height; const g = c.getContext('2d', { willReadFrequently:true });
  g.drawImage(cv, 0, 0); const im = g.getImageData(0, 0, c.width, c.height), d = im.data, o = [0,0,0];
  for (let i = 0; i < d.length; i += 4){ entrada(d[i] / 255, d[i+1] / 255, d[i+2] / 255, o); d[i] = o[0] * 255 + .5; d[i+1] = o[1] * 255 + .5; d[i+2] = o[2] * 255 + .5; }
  g.putImageData(im, 0, 0); return c;
}
function pareceLog(cvs){   // vídeo muito lavado (pretos altos, pouco contraste e pouca cor) costuma ser Log
  const s = amostra(cvs, 120), L = Float32Array.from(canal(s.P, 0)).sort(); let c = 0; for (let i = 0; i < s.P.length; i += 3) c += Math.hypot(s.P[i+1], s.P[i+2]);
  const p2 = pct(L, 2), p98 = pct(L, 98); return p98 < 72 && p98 - p2 < 62 && c / (s.P.length / 3) < 11;   // só sugere: quem escolhe é a pessoa
}

// ===================== imagens e vídeos =====================
const ehVideo = f => /^video\//.test(f.type) || /\.(mp4|mov|m4v|webm|mkv)$/i.test(f.name || '');
function carrega(file){
  return new Promise((ok, erro) => {
    if (!file || !/^image\//.test(file.type)) return erro(new Error('Envie um print (PNG ou JPG) ou o arquivo do vídeo.'));
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => { URL.revokeObjectURL(u); ok(im); }; im.onerror = () => erro(new Error('Não consegui abrir essa imagem.')); im.src = u;
  });
}
function paraCanvas(im, max){
  const W = im.videoWidth || im.width, H = im.videoHeight || im.height;
  const k = Math.min(1, max / Math.max(W, H)), c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(W * k)); c.height = Math.max(1, Math.round(H * k));
  c.getContext('2d', { willReadFrequently:true }).drawImage(im, 0, 0, c.width, c.height); return c;
}
function semBarras(cv){   // tira as barras pretas do print (elas estragam a leitura das cores)
  const s = paraCanvas(cv, 160), w = s.width, h = s.height, d = s.getContext('2d').getImageData(0, 0, w, h).data;
  const escura = (x0, y0, x1, y1) => { let mx = 0, sm = 0, n = 0; for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++){ const i = (y * w + x) * 4, v = Math.max(d[i], d[i+1], d[i+2]); sm += v; n++; if (v > mx) mx = v; } return sm / n < 9 && mx < 40; };
  let t = 0, b = h, l = 0, r = w;
  while (t < h * .42 && escura(0, t, w, t + 1)) t++;
  while (b > h * .58 && escura(0, b - 1, w, b)) b--;
  while (l < w * .42 && escura(l, t, l + 1, b)) l++;
  while (r > w * .58 && escura(r - 1, t, r, b)) r--;
  if ((t + (h - b)) / h < .02 && (l + (w - r)) / w < .02) return { cv, cortou:false };
  const fx = cv.width / w, fy = cv.height / h, m = 1;   // 1px de folga para não sobrar risco preto
  const X = Math.round((l ? l + m : 0) * fx), Y = Math.round((t ? t + m : 0) * fy), W2 = Math.round((r < w ? r - m : w) * fx) - X, H2 = Math.round((b < h ? b - m : h) * fy) - Y;
  if (W2 < 40 || H2 < 40) return { cv, cortou:false };
  const c = document.createElement('canvas'); c.width = W2; c.height = H2; c.getContext('2d', { willReadFrequently:true }).drawImage(cv, X, Y, W2, H2, 0, 0, W2, H2);
  return { cv:c, cortou:true };
}
function brilhoMedio(cv){ const s = paraCanvas(cv, 48), d = s.getContext('2d').getImageData(0, 0, s.width, s.height).data; let t = 0; for (let i = 0; i < d.length; i += 4) t += d[i]*.3 + d[i+1]*.59 + d[i+2]*.11; return t / (d.length / 4); }
async function quadros(file, n = 5){   // pega alguns quadros espalhados pelo vídeo
  const u = URL.createObjectURL(file), v = document.createElement('video'); v.muted = true; v.playsInline = true; v.preload = 'auto';
  const falha = new Error('Não consegui abrir esse vídeo aqui. Tire um print dele e envie a imagem.');
  try {
    await new Promise((ok, er) => { v.onloadeddata = ok; v.onerror = () => er(falha); setTimeout(() => er(falha), 15000); v.src = u; });
    if (!v.videoWidth) throw falha;
    const dur = isFinite(v.duration) ? v.duration : 0, out = [];
    const vai = t => new Promise((ok, er) => { v.onseeked = ok; setTimeout(() => er(falha), 8000); v.currentTime = t; });
    for (let i = 0; i < n; i++){
      if (dur) await vai(dur * (i + .5) / n);
      const c = paraCanvas(v, 900); if (brilhoMedio(c) > 6 || !dur) out.push(c);
      if (!dur) break;
    }
    if (!out.length) throw new Error('Esse vídeo parece todo escuro. Envie um print de um trecho mais claro.');
    return out;
  } finally { URL.revokeObjectURL(u); }
}
function paleta(cv, k = 5){   // k-means simples: as cores principais
  const s = paraCanvas(cv, 80), d = s.getContext('2d').getImageData(0, 0, s.width, s.height).data, px = [];
  for (let i = 0; i < d.length; i += 4) px.push([d[i], d[i+1], d[i+2]]);
  px.sort((a, b) => (a[0]*.3 + a[1]*.59 + a[2]*.11) - (b[0]*.3 + b[1]*.59 + b[2]*.11));
  let c = Array.from({ length:k }, (_, i) => px[Math.floor((i + .5) * px.length / k)].slice());
  for (let it = 0; it < 6; it++){
    const sm = c.map(() => [0,0,0,0]);
    for (const p of px){ let b = 0, bd = 1e9; for (let j = 0; j < k; j++){ const dd = (p[0]-c[j][0])**2 + (p[1]-c[j][1])**2 + (p[2]-c[j][2])**2; if (dd < bd){ bd = dd; b = j; } } sm[b][0] += p[0]; sm[b][1] += p[1]; sm[b][2] += p[2]; sm[b][3]++; }
    c = sm.map((s2, j) => s2[3] ? [s2[0]/s2[3], s2[1]/s2[3], s2[2]/s2[3]] : c[j]);
  }
  return c.sort((a, b) => (a[0]*.3 + a[1]*.59 + a[2]*.11) - (b[0]*.3 + b[1]*.59 + b[2]*.11)).map(v => `rgb(${v.map(Math.round).join(',')})`);
}

// =====================================================================
// O CORAÇÃO: leitura das duas imagens e montagem da LUT
// 1) Luz: a curva de claridade do seu vídeo é levada para a da referência,
//    ponto a ponto (pretos, sombras, meios-tons, luzes e brancos).
// 2) Cor por faixa de luz: sombras, meios e luzes recebem cada um a cor que
//    têm na referência (é isso que copia sombra azulada + luz quente, etc.).

// Cada indicador mostra: onde está o seu vídeo (bolinha), a referência (risco branco) e a faixa ideal (verde).

const GUIA = [

    passo:(v, alvo) => ((1 + A.contr * .006) * alvo / Math.max(v.p90 - v.p10, 1) - 1) / .006 - A.contr, txt:d => d > 0 ? 'Mais contraste' : 'Menos contraste' },

function avaliaGuia(v, r){

    const x = g.val(v), al = g.alvo ? g.alvo(v, r) : null;

    const ok = x >= fx[0] - 1e-9 && x <= fx[1] + 1e-9;
    let d = ok ? 0 : g.passo(v, al != null ? (x < fx[0] ? fx[0] + (fx[1] - fx[0]) * .3 : fx[1] - (fx[1] - fx[0]) * .3) : null);
    const lo = FINO.find(f => f[0] === g.ctl), cur = A[g.ctl];
    d = clamp(cur + d, -LIM_GUIA[g.ctl], LIM_GUIA[g.ctl]) - cur; d = Math.round(d);   // teto absoluto: o guia nunca passa de ±LIM no total

// só sugere o que é seguro: testa a sugestão na LUT (pele, estouro, saturação, brancos) e diminui até passar

}

  tela(`<div class="fim"><div class="sobre-t"><span class="mono">Sua LUT</span></div><h1>O mood está <em>copiado</em>.</h1><p class="sub" style="margin:0 auto">A LUT leva a cor da referência para o seu vídeo, com os ajustes que você fez.</p>
    <div class="arq"><span class="ic">.cube</span><span><b>${nome}</b><small>Arquivo ${nome}.cube · padrão ${N}×${N}×${N} · funciona no CapCut, Premiere, DaVinci e Final Cut${PERFIL ? `<br><span style="color:#fff;font-weight:600">Para vídeo em ${PERFIS[PERFIL].curto}: aplique direto no vídeo em Log, sem outra LUT de conversão antes.</span>` : ''}</small></span></div>
    ${acesso ? `<button class="btn full" id="baixar">Baixar ${nome}</button>` : trava}
    <div class="capcut"><span><b>Instalar direto no CapCut</b><small>Um clique no app Base FL e a LUT aparece em Ajuste › LUT.</small></span><span class="breve">Em breve</span></div>
    <div class="como"><h3>Como usar no seu programa</h3>
      <div class="progs" id="progs">${Object.keys(PROGS).map((k, i) => `<button class="pg${i ? '' : ' on'}" data-k="${k}">${k}</button>`).join('')}</div>
      <ol id="progOl"></ol></div>
    <div class="acoes" style="justify-content:center"><button class="btn ghost" id="aj">← Voltar ao ajuste</button><button class="btn ghost" id="nova">Criar outra LUT</button></div></div>`);
  const prog = k => { $('#progOl').innerHTML = PROGS[k].map(t => `<li>${t.replace('{arq}', `<b>${nome}.cube</b>`)}</li>`).join(''); document.querySelectorAll('.pg').forEach(b => b.classList.toggle('on', b.dataset.k === k)); };
  document.querySelectorAll('.pg').forEach(b => b.onclick = () => prog(b.dataset.k)); prog('CapCut');
  $('#aj').onclick = passo2;
  $('#nova').onclick = () => { VIDS = []; REFS = []; iV = iR = 0; NOTAS = { V:'', R:'' }; CENAS = [null, null, null]; M = null; LUT = null; passo1(); };
  if ($('#baixar')) $('#baixar').onclick = () => {
    const { n, nome: nm } = proximoNome();
    const blob = new Blob([arquivoCube(nm)], { type:'text/plain' }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = nm + '.cube'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    store.set('fl_lut_n', String(n)); toast(nm + ' baixada'); $('#baixar').textContent = 'Baixar de novo';
  };
  if ($('#comprar')) $('#comprar').onclick = () => Base.comprar('mood', 'ferramenta');
  if ($('#entrar')) $('#entrar').onclick = async () => { if (await Base.login()){ sincAcesso(); toast(acesso ? 'Ferramenta desbloqueada' : 'Entrou, mas o Mood não está nas compras deste e-mail'); passo3(); } };
}

// ===================== conta (pelo núcleo: a mesma sessão de todas as ferramentas) =====================
function botaoConta(){
  const b = $('#conta'); b.textContent = Base.sessao() ? 'Sair' : 'Entrar';
  b.onclick = async () => {
    if (Base.sessao()){ Base.sair(); sincAcesso(); toast('Você saiu.'); if ($('.fim')) passo3(); }
    else if (await Base.login()){ sincAcesso(); toast(acesso ? 'Ferramenta desbloqueada' : 'Entrou, mas o Mood não está nas compras deste e-mail'); if ($('.fim')) passo3(); }
  };
}

// ===================== início =====================
botaoConta(); passo1();
Base.pronto.then(() => { sincAcesso(); if ($('.fim')) passo3(); });
Base.aoMudar(() => { const era = acesso; sincAcesso(); if (era !== acesso && $('.fim')) passo3(); });

// aula da ferramenta: o botão só aparece quando existe aula cadastrada
if (window.Aulas) Aulas.liga('#aula', ['fl-lut'], { titulo:'Mood', cor:'180,92,255', dono: () => acesso });
</script>
</body>
