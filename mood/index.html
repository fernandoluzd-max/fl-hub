<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mood — Base FL</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111312">
<link rel="icon" type="image/svg+xml" href="/lut/favicon.svg">
<!-- Link universal do Mood: basefl.com/mood/
     Quem já tem o Mood (conta logada neste aparelho) abre a ferramenta (/lut/).
     Quem não tem vai para a página de vendas (/conheca/mood/), levando a origem do link para o checkout.
     Origem: ?de=app (vira utm_source=app, utm_medium=app, src=basefl-app) ou utm_* explícitos, que têm prioridade. -->
<style>
html,body{margin:0;min-height:100%;background:#111312;color:#B3B4A2;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{min-height:100vh;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;padding:24px}
.m{font-weight:850;font-size:26px;letter-spacing:-.02em;background:linear-gradient(125deg,#FFB347,#FF6FAE 38%,#B45CFF 70%,#5AB8FF);-webkit-background-clip:text;background-clip:text;color:transparent}
i{width:26px;height:26px;border-radius:50%;border:3px solid #2B302E;border-top-color:#F2A541;animation:g .8s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
a{color:#F4F0E4}
</style>
</head>
<body>
<main><span class="m">Mood</span><i aria-hidden="true"></i><span id="msg">Abrindo…</span></main>
<script src="/catalogo.js"></script>
<script src="/base.js"></script>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const de = /^[a-z0-9-]{2,40}$/i.test(q.get('de') || '') ? q.get('de') : '';
  // página de vendas com a origem: ?de= vira utm; utm_* que vierem no link ganham
  const venda = () => {
    const u = new URL('/conheca/mood/', location.origin);
    if (de) { u.searchParams.set('utm_source', de); u.searchParams.set('utm_medium', de); u.searchParams.set('utm_campaign', 'mood'); u.searchParams.set('src', 'basefl-' + de); }
    ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'src'].forEach(k => { const v = q.get(k); if (v && /^[A-Za-z0-9_.-]{1,60}$/.test(v)) u.searchParams.set(k, v); });
    return u.toString();
  };
  let foi = false;
  const vai = () => {
    if (foi) return; foi = true;
    let tem = false; try { tem = Base.tem('fl-lut'); } catch (e) {}
    location.replace(tem ? '/lut/' : venda());
  };
  // espera a conta confirmar (no máximo 2,5 s); sem internet ou sem conta, decide com o que já sabe
  try { Promise.resolve(Base.pronto).then(vai, vai); } catch (e) { vai(); }
  setTimeout(vai, 2500);
  setTimeout(() => { if (!foi) return; document.getElementById('msg').innerHTML = 'Não abriu? <a href="/conheca/mood/">Toque aqui</a>.'; }, 5000);
})();
</script>
</body>
</html>
