<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfólio — CaseUp</title>
<meta name="description" content="Portfólio de edição de vídeo. Veja os trabalhos e os links de contato.">
<meta name="theme-color" content="#0B0C0C">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta property="og:title" content="Portfólio de edição de vídeo">
<meta property="og:description" content="Veja os trabalhos e os links de contato.">
<meta property="og:image" content="https://basefl.com/capas/caseup.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0C0C;--card:#151816;--card2:#1B1F1C;--line:#272D29;--ink:#F4F0E4;--mute:#A8A89A;--dim:#6b6a61;--a:#D4E157;--ai:#171A06;
  --f:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--ink);font:16px/1.5 var(--f);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}a{color:inherit}
:focus-visible{outline:2px solid var(--a);outline-offset:3px;border-radius:10px}
.capa{height:150px;background:radial-gradient(120% 130% at 18% 0%,color-mix(in srgb,var(--a) 85%,#fff 0%) 0%,color-mix(in srgb,var(--a) 30%,#0B0C0C) 46%,#0B0C0C 100%)}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 40px}
.eu{margin-top:-46px}
.foto{width:92px;height:92px;border-radius:50%;border:4px solid var(--bg);background:var(--a);color:var(--ai);display:grid;place-items:center;font-weight:900;font-stretch:115%;font-size:36px}
h1{font-weight:850;font-stretch:112%;font-size:clamp(26px,6.4vw,38px);letter-spacing:-.025em;line-height:1.08;margin-top:12px;overflow-wrap:anywhere}
.frase{color:var(--mute);font-size:17px;margin-top:6px;max-width:52ch}
.selos{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.selos span{font-size:13px;border:1px solid var(--line);border-radius:99px;padding:6px 12px;color:#cfd0c2}
.cta{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{flex:1 1 200px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 20px;border-radius:15px;border:0;background:var(--a);color:var(--ai);font-weight:800;font-size:16.5px;text-decoration:none;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn.gh{background:transparent;color:var(--ink);border:1px solid var(--line)}
/* botões de link */
.links{display:grid;gap:10px;margin-top:14px}
.lk{display:flex;align-items:center;gap:12px;min-height:58px;padding:0 16px;border-radius:16px;text-decoration:none;font-weight:700;font-size:16px;border:1px solid var(--line);background:var(--card2);transition:transform .15s,border-color .2s,background .2s}
.lk:hover{border-color:var(--a);transform:translateY(-1px)}.lk:active{transform:scale(.985)}
.lk svg{flex:none;width:22px;height:22px;fill:none;stroke:var(--a);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.lk span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk i{flex:none;font-style:normal;color:var(--dim);font-size:18px}
.e-contorno .lk{background:transparent;border-color:color-mix(in srgb,var(--a) 55%,transparent)}
.e-vidro .lk{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:99px;padding:0 20px}
.so-links .wrap{max-width:520px}.so-links .eu{text-align:center}.so-links .foto{margin:0 auto}.so-links .selos,.so-links .cta{justify-content:center}.so-links .frase{margin-left:auto;margin-right:auto}
.filtros{display:flex;gap:6px;margin:30px -18px 14px;padding:0 18px;overflow-x:auto;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}
.filtros button{flex:none;font-size:14px;font-weight:650;border:1px solid var(--line);border-radius:99px;padding:8px 15px;color:var(--mute);background:none;transition:background .2s,color .2s}
.filtros button[aria-pressed=true]{background:var(--ink);color:#141414;border-color:var(--ink)}
.grade{display:grid;gap:8px}.gv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.gh{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.v.h{aspect-ratio:16/9}.v .fora{position:absolute;right:9px;top:8px;z-index:2;font-size:10.5px;font-weight:800;color:rgba(255,255,255,.72)}
.foto{position:relative}.foto img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover}
.v{position:relative;aspect-ratio:9/16;border-radius:14px;overflow:hidden;border:0;padding:0;background:linear-gradient(160deg,color-mix(in srgb,var(--a) 22%,#1b1f1c),#0f1110);text-align:left;display:block;width:100%}
.v img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.v::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.75));z-index:1}
.v .pl{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:2;display:grid;place-items:center;transition:transform .2s,background .2s}
.v .pl::after{content:"";border:8px solid transparent;border-left:13px solid #fff;margin-left:6px}
.v:hover .pl{transform:scale(1.08);background:var(--a)}.v:hover .pl::after{border-left-color:var(--ai)}
.v .site{position:absolute;left:10px;top:10px;z-index:2;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.72)}
.v .rod{position:absolute;left:10px;right:10px;bottom:9px;z-index:2;display:flex;flex-direction:column;gap:3px}
.v .rod b{font-size:13.5px;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.v .rod small{align-self:flex-start;font-size:10.5px;font-weight:800;background:rgba(0,0,0,.55);padding:2px 7px;border-radius:6px}
.vazio{color:var(--mute);text-align:center;padding:40px 0}
.fim{margin-top:34px;border:1px solid var(--line);border-radius:22px;background:var(--card);padding:26px 20px;text-align:center}
.fim b{display:block;font-weight:850;font-stretch:110%;font-size:22px;letter-spacing:-.02em}
.fim p{color:var(--mute);margin:4px 0 16px}
.fim .cta{justify-content:center;margin-top:0}.fim .btn{flex:0 1 280px}
footer{margin-top:28px;text-align:center;font-size:12.5px;color:var(--dim)}
footer a{color:var(--mute)}
/* player */
.tela{position:fixed;inset:0;z-index:50;background:rgba(4,4,4,.93);display:grid;place-items:center;padding:16px}
.tela .cx{position:relative;width:min(100%,960px);aspect-ratio:16/9;max-height:calc(100vh - 96px);border-radius:16px;overflow:hidden;background:#000}
.tela .cx.vert{width:min(100%,calc((100vh - 110px)*9/16),420px);aspect-ratio:9/16}
.tela iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.tela .x{position:fixed;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:24px;line-height:1}
.tela .fora{position:fixed;bottom:16px;left:0;right:0;text-align:center;font-size:13.5px}
.tela .fora a{color:#fff}
.erro{max-width:420px;margin:18vh auto 0;text-align:center;padding:0 22px}
.erro b{display:block;font-weight:850;font-size:24px;letter-spacing:-.02em;margin-bottom:6px}.erro p{color:var(--mute)}
.esq{opacity:.5}.esq .foto,.esq .l{background:var(--card2);color:transparent;border-radius:12px}.esq .l{height:22px;margin-top:12px;width:60%}
@media (min-width:700px){.grade,.gv,.gh{gap:10px}.gv{grid-template-columns:repeat(4,minmax(0,1fr))}.gh{grid-template-columns:repeat(2,minmax(0,1fr))}.capa{height:190px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="capa"></div><div class="wrap esq"><div class="eu"><div class="foto">.</div><div class="l"></div><div class="l" style="width:40%"></div></div></div></div>
<script src="/case/video.js"></script>
<script>
/* Página PÚBLICA do portfólio. O visitante é o cliente do editor: aqui não existe nenhum dado interno da conta. */
const SUPA = { url:'https://otlaexuqyavpzxwzcsfo.supabase.co', key:'sb_publishable_bAaw1t6NpZEgH8ePBztQWg_tE4kDfQR' };
const ICO = {
  whatsapp:'<path d="M4 20l1.300-4.200A8 8 0 1 1 8.400 19z"/><path d="M9 9.500c0 3 2.500 5.500 5.500 5.500l1.200-1.500-2-1-.800.800a4 4 0 0 1-2.200-2.200l.800-.800-1-2z"/>',
  instagram:'<rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.600"/><path d="M16.800 7.200v.01"/>',
  tiktok:'<path d="M14 4v10.500a3.500 3.500 0 1 1-3.500-3.500"/><path d="M14 4c.400 2.600 2 4.200 4.500 4.500"/>',
  youtube:'<rect x="3" y="6" width="18" height="12" rx="4"/><path d="M10.500 9.500v5l4.200-2.500z"/>',
  email:'<rect x="3.500" y="5.500" width="17" height="13" rx="2.500"/><path d="M4.500 7.500l7.500 5.500 7.500-5.500"/>',
  site:'<circle cx="12" cy="12" r="8.500"/><path d="M3.500 12h17M12 3.500c2.500 2.600 2.500 14.400 0 17M12 3.500c-2.500 2.600-2.500 14.400 0 17"/>' };
const ROTULO = { whatsapp:'Chamar no WhatsApp', instagram:'Instagram', tiktok:'TikTok', youtube:'YouTube', email:'Mandar um e-mail', site:'Meu site' };
const destino = l => l.k === 'whatsapp' ? 'https://wa.me/' + l.v : l.k === 'email' ? 'mailto:' + l.v : l.v;
const CORES = { lima:['#D4E157','#171A06'], agua:['#3FD0C2','#04201D'], ambar:['#F2A541','#1A1206'], roxo:['#A98BFF','#120B26'], rosa:['#FF6FAE','#26081A'], azul:['#5AB8FF','#06182A'] };
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
// o final do link: basefl.com/e/?joao  (também aceita /e/#joao)
function slug(){
  const q = location.search.replace(/^\?/, '').split('&')[0].split('=')[0], h = location.hash.replace(/^#/, '');
  const c = /^\/e\/?$/.test(location.pathname) ? '' : location.pathname.replace(/^\/|\/$/g, '');     // basefl.com/joao
  let s = ''; try { s = decodeURIComponent(c || q || h || '').toLowerCase(); } catch (e) {}
  return /^[a-z0-9-]{3,30}$/.test(s) ? s : null;
}
const PREVIA = slug() === 'previa';       // a tela do editor mostra a prévia aqui dentro, enquanto ele monta
const EXEMPLO = { ok:true, nome:'João Editor', frase:'Edito Reels e anúncios para negócios locais', cor:'lima', estilo:'cheio', selos:['Reels','Anúncios','Entrega em 3 dias'], briefing:null, exemplo:true,
  links:[{k:'whatsapp',v:'5511999999999',r:'Chamar no WhatsApp'},{k:'instagram',v:'https://instagram.com/',r:'Meu Instagram'},{k:'site',v:'https://basefl.com/',r:'Tabela de pacotes'}],
  videos:[{u:'https://www.youtube.com/shorts/exemplo0001',t:'reels',n:'Reels de receita'},{u:'https://www.youtube.com/shorts/exemplo0002',t:'anuncio',n:'Anúncio de loja'},{u:'https://www.youtube.com/shorts/exemplo0003',t:'reels',n:'Bastidores'},
          {u:'https://www.youtube.com/shorts/exemplo0004',t:'youtube',n:'Corte de podcast'},{u:'https://www.youtube.com/shorts/exemplo0005',t:'anuncio',n:'Lançamento'},{u:'https://www.youtube.com/shorts/exemplo0006',t:'reels',n:'Antes e depois'}] };
async function busca(s){
  if (s === 'exemplo') return EXEMPLO;
  const r = await fetch(SUPA.url + '/rest/v1/rpc/pub_portfolio', { method:'POST', headers:{ apikey:SUPA.key, 'Content-Type':'application/json' }, body:JSON.stringify({ p_slug:s }) });
  if (!r.ok) throw new Error('rede'); return r.json();
}
const CURTO = !/^\/e\/?$/.test(location.pathname);      // aberto como basefl.com/nome (é a página 404 do site que desenha)
function erro(t, p){ $('#app').innerHTML = `<div class="erro"><b>${t}</b><p>${p}</p>${CURTO ? '<p style="margin-top:16px"><a href="/">Ir para o início do Base FL</a></p>' : ''}</div>`; }

let P = null, filtro = 'todos';
function orcamento(){
  // o botão só existe para o editor que tem o Gerador de Briefing: o cliente responde e o pedido chega organizado
  return P.briefing ? { href:'/b/#' + P.briefing, rot:'Pedir orçamento', alvo:'' } : null;
}
function desenha(){
  const [a, ai] = CORES[P.cor] || CORES.lima;
  document.documentElement.style.setProperty('--a', a); document.documentElement.style.setProperty('--ai', ai);
  document.title = P.nome + ' — portfólio';
  const vs = (P.videos || []).map((v, i) => ({ ...v, i, info: CaseVideo.le(v.u) })).filter(v => v.info || P.exemplo);
  const ls = (P.links || []).filter(l => ICO[l.k] && l.v);
  document.body.className = 'e-' + (P.estilo || 'cheio') + (vs.length ? '' : ' so-links');
  const tipos = [...new Set(vs.map(v => v.t))].filter(t => CaseVideo.TIPOS[t]);
  const o = orcamento(), img = n => n && P.pasta && /^[a-z0-9-]{1,40}\.jpg$/.test(n) ? SUPA.url + '/storage/v1/object/public/caseup/' + P.pasta + '/' + n : null;
  const cta = o ? `<div class="cta"><a class="btn" href="${o.href}"${o.alvo}>${o.rot}</a></div>` : '', foto = img(P.foto);
  $('#app').innerHTML = `<div class="capa"></div><div class="wrap">
    <div class="eu"><div class="foto"><span aria-hidden="true">${esc((P.nome || '?').trim().charAt(0).toUpperCase())}</span>${foto ? `<img src="${esc(foto)}" alt="Foto de ${esc(P.nome)}" onerror="this.remove()">` : ''}</div>
      <h1>${esc(P.nome)}</h1>${P.frase ? `<p class="frase">${esc(P.frase)}</p>` : ''}
      ${(P.selos || []).length ? `<div class="selos">${P.selos.map(s => `<span>${esc(s)}</span>`).join('')}</div>` : ''}
      ${cta}
      ${ls.length ? `<div class="links">${ls.map(l => `<a class="lk" href="${esc(destino(l))}"${l.k === 'email' ? '' : ' target="_blank" rel="noopener"'}><svg viewBox="0 0 24 24" aria-hidden="true">${ICO[l.k]}</svg><span>${esc(l.r || ROTULO[l.k])}</span><i aria-hidden="true">›</i></a>`).join('')}</div>` : ''}</div>
    ${!vs.length ? '' : tipos.length > 1 ? `<div class="filtros" role="group" aria-label="Filtrar por tipo"><button aria-pressed="true" data-f="todos">Todos</button>${tipos.map(t => `<button aria-pressed="false" data-f="${t}">${CaseVideo.TIPOS[t]}</button>`).join('')}</div>` : '<div style="height:26px"></div>'}
    ${vs.length ? '<div class="grade" id="grade"></div>' : ''}
    ${o && vs.length > 5 ? `<div class="fim"><b>Gostou do que viu?</b><p>Me conta o que você precisa. Eu respondo com o valor.</p><div class="cta"><a class="btn" href="${o.href}"${o.alvo}>${o.rot}</a></div></div>` : ''}
    <footer>${P.exemplo ? 'Este é um portfólio de exemplo. ' : ''}Feito com <a href="/conheca/caseup/?de=portfolio">CaseUp</a> · Base FL</footer></div>`;
  const g = $('#grade');
  if (PREVIA || P.exemplo) document.querySelectorAll('#app a').forEach(a => a.addEventListener('click', e => { if (!a.closest('footer')) e.preventDefault(); }));
  if (!g) return;
  const fmt = v => v.f === 'h' || v.f === 'v' ? v.f : ((v.info || { vertical:true }).vertical ? 'v' : 'h');
  const dentro = v => v.info && v.info.embed && v.info.site !== 'instagram';        // o Instagram não deixa tocar fora dele
  function cartao(v){
    const inf = v.info || { site:'youtube', vertical:true }, capa = img(v.k) || v.c || inf.capa;
    return `<button class="v ${fmt(v)}" data-i="${v.i}" aria-label="Assistir: ${esc(v.n || CaseVideo.TIPOS[v.t] || 'vídeo')}">
      ${capa && !P.exemplo ? `<img src="${esc(capa)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}
      <span class="site">${CaseVideo.NOMES[inf.site] || ''}</span>${P.exemplo || dentro(v) ? '' : '<span class="fora" aria-hidden="true">↗</span>'}<span class="pl"></span>
      <span class="rod">${v.n ? `<b>${esc(v.n)}</b>` : ''}<small>${CaseVideo.TIPOS[v.t] || ''}</small></span></button>`;
  }
  function grade(){
    const l = vs.filter(v => filtro === 'todos' || v.t === filtro);
    if (!l.length){ g.innerHTML = '<p class="vazio">Nenhum vídeo deste tipo.</p>'; return; }
    // em pé (9:16) e deitado (16:9) ficam em grades separadas, na ordem em que o editor colocou
    const gr = { v: l.filter(v => fmt(v) === 'v'), h: l.filter(v => fmt(v) === 'h') }, ordem = fmt(l[0]) === 'h' ? ['h','v'] : ['v','h'];
    g.innerHTML = ordem.filter(k => gr[k].length).map(k => `<div class="g${k}">${gr[k].map(cartao).join('')}</div>`).join('');
  }
  grade();
  document.querySelectorAll('.filtros button').forEach(b => b.onclick = () => { filtro = b.dataset.f; document.querySelectorAll('.filtros button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false')); grade(); });
  g.onclick = e => { const b = e.target.closest('.v'); if (!b) return; const v = vs.find(x => x.i === +b.dataset.i); if (P.exemplo || PREVIA) return; toca(v); };
}
// toca dentro da página quando o site deixa; senão, abre o vídeo no próprio site
function toca(v){
  const inf = v.info;
  if (!inf.embed || inf.site === 'instagram'){ window.open(v.u, '_blank', 'noopener'); return; }
  const emPe = v.f ? v.f === 'v' : inf.vertical;
  const d = document.createElement('div'); d.className = 'tela'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-label', 'Vídeo');
  d.innerHTML = `<button class="x" aria-label="Fechar">×</button><div class="cx${emPe ? ' vert' : ''}"><iframe src="${esc(inf.embed)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="Vídeo"></iframe></div>
    <p class="fora"><a href="${esc(v.u)}" target="_blank" rel="noopener">Não abriu? Ver no ${CaseVideo.NOMES[inf.site]}</a></p>`;
  const fecha = () => { d.remove(); document.removeEventListener('keydown', tecla); document.body.style.overflow = ''; };
  const tecla = e => { if (e.key === 'Escape') fecha(); };
  d.addEventListener('click', e => { if (e.target === d || e.target.classList.contains('x')) fecha(); });
  document.addEventListener('keydown', tecla); document.body.style.overflow = 'hidden'; document.body.appendChild(d); d.querySelector('.x').focus();
}
// PRÉVIA: a tela do editor manda o rascunho por mensagem (mesma origem) e esta página só desenha
if (PREVIA){
  addEventListener('message', e => { if (e.origin !== location.origin || !e.data || e.data.fl !== 'previa') return; P = { ok:true, ...e.data.p }; filtro = 'todos'; desenha(); });
  try { parent.postMessage({ fl:'previa-pronta' }, location.origin); } catch {}
}
(async () => {
  if (PREVIA) return;
  const s = slug();
  if (!s) return CURTO ? erro('Página não encontrada', 'Esse endereço não existe.') : erro('Link incompleto', 'Confira o endereço que você recebeu.');
  try { P = await busca(s); } catch { return erro('Sem conexão', 'Não consegui abrir o portfólio agora. Tente de novo em instantes.'); }
  if (!P || !P.ok) return erro('Portfólio não encontrado', 'O link pode estar errado, ou o portfólio saiu do ar.');
  desenha();
})();
addEventListener('hashchange', () => location.reload());
</script>
</body>
</html>
