<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Copia Cor — Base FL</title>
<meta name="description" content="Copie a cor de qualquer vídeo de referência e baixe a sua LUT pronta para o CapCut.">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0B0C0C">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0C0C; --panel:#141716; --panel2:#1A1E1C; --line:#262B28; --ink:#F4F0E4; --mute:#A3A396; --dim:#63625a;
  --a:#FF6FAE; --a2:#B45CFF; --ai:#16070f; --ok:#7fce8f;
  --grad:linear-gradient(120deg,#FFB347,#FF6FAE 45%,#B45CFF 75%,#5AB8FF);
  --d:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--ink);font:16px/1.5 var(--f);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(800px 460px at 85% -10%,rgba(255,111,174,.13),transparent 70%),radial-gradient(700px 420px at -5% 5%,rgba(90,184,255,.08),transparent 70%)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--a);outline-offset:3px;border-radius:10px}
.wrap{position:relative;max-width:1180px;margin:0 auto;padding:16px 18px 48px}
header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
header img{width:34px;height:34px;border-radius:9px}
header .nm{font-family:var(--d);font-weight:800;font-size:16px;line-height:1.1}
header .nm small{display:block;font-family:var(--f);font-weight:500;color:var(--mute);font-size:12px}
header .sp{flex:1}
.link{background:none;border:0;color:var(--mute);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* passos */
.passos{display:flex;gap:6px;margin-bottom:22px}
.passos div{flex:1;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--dim);padding:9px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);white-space:nowrap;overflow:hidden}
.passos i{flex:none;font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--panel2);border:1px solid var(--line)}
.passos .at{color:var(--ink);border-color:rgba(255,111,174,.5)}
.passos .at i{background:var(--grad);color:#111;border:0}
.passos .ok{color:var(--mute)}
.passos .ok i{background:var(--ok);color:#0b1a10;border:0}
@media (max-width:640px){.passos span{display:none}.passos div{justify-content:center}}

h1{font-family:var(--d);font-weight:850;font-stretch:112%;font-size:clamp(26px,5vw,40px);line-height:1.04;letter-spacing:-.03em;margin-bottom:8px;text-wrap:balance}
h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);font-size:15.5px;max-width:60ch;margin-bottom:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;font-weight:750;font-size:16px;border-radius:15px;padding:15px 22px;border:0;background:var(--grad);color:#14070e;transition:transform .12s,filter .15s,box-shadow .2s;box-shadow:0 12px 34px -14px rgba(255,111,174,.8)}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.full{width:100%}
.hide{display:none!important}

/* passo 1: as duas imagens */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;min-height:300px;border-radius:22px;border:1.5px dashed #3a403c;background:var(--panel);cursor:pointer;overflow:hidden;transition:border-color .2s,background .2s,transform .15s}
.drop:hover,.drop.sobre{border-color:var(--a);background:var(--panel2)}
.drop.sobre{transform:scale(1.01)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop .n{font-family:var(--d);font-weight:900;font-size:13px;letter-spacing:.12em;color:var(--a)}
.drop b{font-family:var(--d);font-weight:800;font-size:21px}
.drop p{color:var(--mute);font-size:14px;max-width:26ch}
.drop .up{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);margin-bottom:4px}
.drop .up svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.drop canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop.tem{border-style:solid;border-color:var(--line)}
.drop.tem .txt{display:none}
.drop .tag{position:absolute;left:12px;top:12px;z-index:2;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px)}
.drop .troca{position:absolute;right:12px;top:12px;z-index:2;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:none}
.drop.tem .troca{display:block}
.acoes{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:20px}
.dica{color:var(--dim);font-size:13px}
@media (max-width:720px){.duo{grid-template-columns:1fr}.drop{min-height:210px}}

/* analisando */
.scan{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);max-width:760px;margin:0 auto;aspect-ratio:16/9;background:#111}
.scan canvas{width:100%;height:100%;object-fit:cover;display:block}
.scan::after{content:"";position:absolute;top:0;bottom:0;width:26%;left:-30%;background:linear-gradient(90deg,transparent,rgba(255,111,174,.35),rgba(180,92,255,.5),transparent);animation:varre 1.3s ease-in-out infinite}
@keyframes varre{to{left:110%}}
.scan-t{text-align:center;margin-top:18px;color:var(--mute);font-weight:600}

/* passo 3: ajuste */
.ed{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.pv{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#0e0f0f;touch-action:none;user-select:none;-webkit-user-select:none}
.pv canvas{display:block;width:100%;height:auto}
.pv .dep{position:absolute;inset:0;width:100%;height:100%}
.pv .corte{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 14px rgba(255,255,255,.7);z-index:2;cursor:ew-resize}
.pv .corte span{position:absolute;top:50%;left:50%;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.45);display:grid;place-items:center;color:#111;font-weight:900;font-size:13px;letter-spacing:2px}
.pv .tg{position:absolute;top:12px;z-index:3;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);pointer-events:none}
.pv .tg.l{left:12px}.pv .tg.r{right:12px;background:var(--grad);color:#111}
.sob{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.refm{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px 8px 8px}
.refm canvas{width:64px;height:40px;border-radius:8px;object-fit:cover}
.refm small{display:block;color:var(--mute);font-size:11.5px}
.pal{display:flex;gap:0;border-radius:10px;overflow:hidden;border:1px solid var(--line);height:40px;flex:1;min-width:160px}
.pal i{flex:1}
.cenas{margin-top:16px}
.cenas h3{font-size:14px;font-weight:700;margin-bottom:4px}
.cenas p{color:var(--mute);font-size:13px;margin-bottom:10px}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cn{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:1.5px dashed #3a403c;background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--mute);font-size:13px;font-weight:600;text-align:center}
.cn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.cn canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cn.tem{border-style:solid;border-color:var(--line)}
.cn .x{position:absolute;right:6px;top:6px;z-index:3;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:13px;cursor:pointer;display:none}
.cn.tem .x{display:block}

.painel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px}
.painel h2{font-family:var(--d);font-weight:800;font-size:15px;letter-spacing:.02em;margin-bottom:12px}
.ctl{margin-bottom:14px}
.ctl .l{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:600;margin-bottom:6px}
.ctl .l small{font-weight:500;color:var(--mute);font-size:12px}
.ctl .l output{font-variant-numeric:tabular-nums;color:var(--mute);font-size:13px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;background:var(--trk,#2c322e);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 8px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:0}
.grande input[type=range]{height:8px;--trk:linear-gradient(90deg,#2c322e,var(--a))}
.sw{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;margin:4px 0 16px;cursor:pointer}
.sw b{display:block;font-size:14px}.sw small{display:block;color:var(--mute);font-size:12.5px;line-height:1.3}
.sw .tog{flex:none;width:44px;height:26px;border-radius:26px;background:#2c322e;position:relative;transition:background .2s}
.sw .tog::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on .tog{background:var(--ok)}.sw.on .tog::after{transform:translateX(18px)}
details.fino{border-top:1px solid var(--line);padding-top:12px;margin-bottom:6px}
details.fino summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-bottom:12px}
details.fino summary::-webkit-details-marker{display:none}
details.fino summary::after{content:"+";color:var(--a);font-size:18px}
details.fino[open] summary::after{content:"–"}
.rst{display:block;margin:2px 0 14px auto}
@media (max-width:960px){.ed{grid-template-columns:1fr}}

/* pronto */
.fim{max-width:640px;margin:0 auto;text-align:center}
.arq{display:flex;align-items:center;gap:14px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;margin:22px 0 16px}
.arq .ic{flex:none;width:56px;height:56px;border-radius:16px;background:var(--grad);display:grid;place-items:center;font-family:var(--d);font-weight:900;font-size:13px;color:#111}
.arq b{display:block;font-family:var(--d);font-weight:800;font-size:19px}
.arq small{display:block;color:var(--mute);font-size:13px}
.como{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin-top:18px}
.como h3{font-size:15px;margin-bottom:10px}
.como ol{padding-left:20px;display:flex;flex-direction:column;gap:7px;color:var(--mute);font-size:14.5px}
.como b{color:var(--ink)}
.capcut{display:flex;align-items:center;gap:12px;text-align:left;background:linear-gradient(90deg,rgba(255,111,174,.10),transparent);border:1px dashed rgba(255,111,174,.45);border-radius:18px;padding:14px 16px;margin-top:14px}
.capcut b{display:block;font-size:15px}.capcut small{display:block;color:var(--mute);font-size:13px}
.capcut .breve{margin-left:auto;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--a);border:1px solid rgba(255,111,174,.5);border-radius:99px;padding:4px 9px;white-space:nowrap}
.progs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pg{cursor:pointer;font-weight:700;font-size:13px;color:var(--mute);background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:7px 13px}
.pg.on{background:var(--ink);color:#111;border-color:var(--ink)}
.lock{border-top:1px dashed var(--line);margin-top:16px;padding-top:16px}
.lock p{font-weight:700;margin-bottom:4px}.lock .sm{color:var(--mute);font-size:14px;margin-bottom:12px}
.inp{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font:inherit;font-size:16px;outline:none;margin-bottom:12px}
.inp:focus{border-color:var(--a)}
.err{color:#ff8f7a;font-size:14px;min-height:20px;margin-top:8px}
.toast{pointer-events:none;position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#111;font-weight:700;font-size:14px;padding:11px 16px;border-radius:12px;transition:all .25s;z-index:30;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.entra>*{animation:entra .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes entra{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="/logo.png" alt="">
    <div class="nm">Copia Cor<small>Base FL</small></div>
    <div class="sp"></div>
    <button class="link" id="conta"></button>
  </header>
  <div class="passos" id="passos"></div>
  <main id="tela"></main>
</div>
<div class="toast" id="toast"></div>

<script>
// ===================== CONFIG =====================
const SUPA = { url:'https://otlaexuqyavpzxwzcsfo.supabase.co', key:'sb_publishable_bAaw1t6NpZEgH8ePBztQWg_tE4kDfQR' };
const PACK = 'fl-lut';
const BUY_URL = '';                 // página de vendas (colocar quando existir)
const NOME_LUT = 'LUT Base FL';     // nome fixo das LUTs: a pessoa não escolhe nem edita
const N = 33;                       // tamanho padrão do .cube

// ===================== utilidades =====================
const $ = s => document.querySelector(s);
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch {} } };
const calmo = matchMedia('(prefers-reduced-motion: reduce)').matches;
const espera = ms => new Promise(r => setTimeout(r, calmo ? Math.min(ms, 80) : ms));
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2400); }
function tela(html){ const m = $('#tela'); m.className = 'entra'; m.innerHTML = html; window.scrollTo({ top:0 }); }
function passos(at){
  const P = ['Seu vídeo e a referência','Ajuste','Pronto'];
  $('#passos').innerHTML = P.map((p, i) => `<div class="${i < at ? 'ok' : i === at ? 'at' : ''}"><i>${i < at ? '✓' : i + 1}</i><span>${p}</span></div>`).join('');
}

// ===================== cor: sRGB <-> Lab =====================
const lin = c => c <= .04045 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4);
const gam = c => c <= .0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - .055;
const fL = t => t > .008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;
const fI = t => t > .206893 ? t * t * t : (t - 16 / 116) / 7.787;
function lab(r, g, b){   // r,g,b em 0..1
  r = lin(r); g = lin(g); b = lin(b);
  const x = (.4124564*r + .3575761*g + .1804375*b) / .95047, y = .2126729*r + .7151522*g + .072175*b, z = (.0193339*r + .119192*g + .9503041*b) / 1.08883;
  const fx = fL(x), fy = fL(y), fz = fL(z);
  return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
}
function rgb(L, a, b){
  const fy = (L + 16) / 116, fx = fy + a / 500, fz = fy - b / 200;
  const x = fI(fx) * .95047, y = fI(fy), z = fI(fz) * 1.08883;
  const r = 3.2404542*x - 1.5371385*y - .4985314*z, g = -.969266*x + 1.8760108*y + .041556*z, bb = .0556434*x - .2040259*y + 1.0572252*z;
  return [gam(Math.min(1, Math.max(0, r))), gam(Math.min(1, Math.max(0, g))), gam(Math.min(1, Math.max(0, bb)))];
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const suave = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };

// ===================== imagens =====================
function carrega(file){
  return new Promise((ok, erro) => {
    if (!file || !/^image\//.test(file.type)) return erro(new Error('Envie uma imagem (print em PNG ou JPG).'));
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => { URL.revokeObjectURL(u); ok(im); }; im.onerror = () => erro(new Error('Não consegui abrir essa imagem.')); im.src = u;
  });
}
function paraCanvas(im, max){
  const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k));
  c.getContext('2d', { willReadFrequently:true }).drawImage(im, 0, 0, c.width, c.height); return c;
}
function medidas(cv){   // média e desvio em Lab
  const s = paraCanvas(cv, 220), d = s.getContext('2d').getImageData(0, 0, s.width, s.height).data;
  let n = 0, m = [0,0,0], q = [0,0,0];
  for (let i = 0; i < d.length; i += 4){ const v = lab(d[i]/255, d[i+1]/255, d[i+2]/255); n++; for (let k = 0; k < 3; k++){ m[k] += v[k]; q[k] += v[k]*v[k]; } }
  const med = m.map(x => x / n), dp = q.map((x, k) => Math.sqrt(Math.max(1e-6, x / n - med[k]*med[k])));
  return { med, dp };
}
function paleta(cv, k = 5){   // k-means simples: as cores principais da referência
  const s = paraCanvas(cv, 90), d = s.getContext('2d').getImageData(0, 0, s.width, s.height).data, px = [];
  for (let i = 0; i < d.length; i += 4) px.push([d[i], d[i+1], d[i+2]]);
  let c = Array.from({ length:k }, (_, i) => px[Math.floor((i + .5) * px.length / k)].slice());
  for (let it = 0; it < 8; it++){
    const sm = c.map(() => [0,0,0,0]);
    for (const p of px){ let b = 0, bd = 1e9; for (let j = 0; j < k; j++){ const dd = (p[0]-c[j][0])**2 + (p[1]-c[j][1])**2 + (p[2]-c[j][2])**2; if (dd < bd){ bd = dd; b = j; } } sm[b][0] += p[0]; sm[b][1] += p[1]; sm[b][2] += p[2]; sm[b][3]++; }
    c = sm.map((s2, j) => s2[3] ? [s2[0]/s2[3], s2[1]/s2[3], s2[2]/s2[3]] : c[j]);
  }
  return c.sort((a, b) => (a[0]*.3 + a[1]*.59 + a[2]*.11) - (b[0]*.3 + b[1]*.59 + b[2]*.11)).map(v => `rgb(${v.map(Math.round).join(',')})`);
}

// ===================== o coração: a transformação de cor =====================
let S = null, R = null;     // medidas do seu vídeo e da referência
const PADRAO = { cor:100, luz:70, pele:true, expo:0, contr:0, sat:0, temp:0, tint:0, fade:0 };
let A = { ...PADRAO };
function transforma(r, g, b){
  const [L, a, bb] = lab(r, g, b);
  const kL = clamp(R.dp[0] / S.dp[0], .6, 1.7), ka = clamp(R.dp[1] / S.dp[1], .5, 2.2), kb = clamp(R.dp[2] / S.dp[2], .5, 2.2);
  const cor = A.cor / 100, luz = A.luz / 100;
  let L2 = L + ((R.med[0] + (L - S.med[0]) * kL) - L) * luz;
  let a2 = a + ((R.med[1] + (a - S.med[1]) * ka) - a) * cor;
  let b2 = bb + ((R.med[2] + (bb - S.med[2]) * kb) - bb) * cor;
  if (A.pele){   // tons de pele: segura a mudança de cor para a pele continuar natural

async function api(path, { method='GET', body, auth=true } = {}){
  const h = { apikey:SUPA.key, 'Content-Type':'application/json' };
  if (auth && sess) h.Authorization = 'Bearer ' + sess.access_token;
  const r = await fetch(SUPA.url + path, { method, headers:h, body: body ? JSON.stringify(body) : undefined });
  const t = await r.text(); let j; try { j = t ? JSON.parse(t) : {}; } catch { j = t; }
  if (!r.ok){ const e = new Error(traduz(j?.msg || j?.message || j?.error_description || j?.error || ('Erro ' + r.status))); e.status = r.status; throw e; }
  return j;
}
function traduz(m){
  m = String(m||'');
  if (/only request this after (\d+)/i.test(m)) return 'Aguarde ' + m.match(/after (\d+)/i)[1] + ' segundos para pedir outro código.';
  if (/expired|invalid/i.test(m) && /token|otp/i.test(m)) return 'Código inválido ou expirado. Confira ou peça outro.';
  if (/rate limit/i.test(m)) return 'Muitas tentativas. Aguarde alguns minutos.';
  if (/failed to fetch|network|load failed/i.test(m)) return 'Sem conexão com a internet.';
  return m;
}
const fromAuth = r => ({ access_token:r.access_token, refresh_token:r.refresh_token, expires_at:r.expires_at || Math.floor(Date.now()/1000) + (r.expires_in||3600), email:r.user?.email });

  catch(e){ if (e.status >= 400 && e.status < 500){ salva(null); return false; } return true; }
}

    tela(`<div style="max-width:440px"><button class="link" id="voltar" style="margin-bottom:14px">← Voltar</button>
      <h1>${codigo ? 'Digite o código' : 'Entre com o e-mail da compra'}</h1>
      <p class="sub">${codigo ? 'Enviamos um código para ' + email + '. Confira também o spam.' : 'O mesmo e-mail que você usou para comprar. Vamos mandar um código de acesso.'}</p>
      <input class="inp" id="campo" ${codigo ? 'inputmode="numeric" autocomplete="one-time-code" placeholder="Código"' : 'type="email" autocomplete="email" placeholder="seu@email.com"'}>
      <button class="btn full" id="vai">${codigo ? 'Entrar' : 'Enviar código'}</button><div class="err" id="erro"></div></div>`);
    $('#campo').focus(); $('#campo').onkeydown = e => { if (e.key === 'Enter') $('#vai').click(); };
    $('#voltar').onclick = () => codigo ? etapa(false) : depois();
    $('#vai').onclick = async () => {
      const b = $('#vai'); b.disabled = true; $('#erro').textContent = '';
      try {
        if (!codigo){
          email = $('#campo').value.trim().toLowerCase();
          if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw new Error('Digite um e-mail válido.');
          await api('/auth/v1/otp', { method:'POST', body:{ email, create_user:true }, auth:false }); etapa(true);
        } else {
          const token = $('#campo').value.replace(/\D/g,'');
          if (token.length < 6) throw new Error('Digite o código que chegou no e-mail.');
          const r = await api('/auth/v1/verify', { method:'POST', body:{ type:'email', email, token }, auth:false });
          salva(fromAuth(r)); await checaAcesso();
          toast(acesso ? 'Ferramenta desbloqueada' : 'Entrou, mas o Copia Cor não está nas compras deste e-mail'); depois();
        }
      } catch(e){ $('#erro').textContent = traduz(e.message); b.disabled = false; }
    };
  };
  etapa(false);
}

// ===================== início =====================
botaoConta(); passo1();
checaAcesso().then(() => { if ($('.fim')) passo3(); });
</script>
