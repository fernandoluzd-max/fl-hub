<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mood — Base FL</title>
<meta name="description" content="Copie o mood de qualquer vídeo. Escolha a referência, ajuste e baixe a LUT pronta.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#141615">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..900&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#111312; --panel:#191C1B; --panel2:#202423; --line:#2B302E; --ink:#F4F0E4; --mute:#B3B4A2; --dim:#6F7066;
  --a:#FF6FAE; --a2:#B45CFF; --ok:#7fce8f;
  --grad:linear-gradient(125deg,#FFB347,#FF6FAE 38%,#B45CFF 70%,#5AB8FF);
  --d:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --m:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--ink);font:16px/1.5 var(--f);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(760px 520px at 88% -8%,rgba(180,92,255,.16),transparent 70%),radial-gradient(620px 420px at -6% 4%,rgba(255,179,71,.07),transparent 70%)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--a);outline-offset:3px;border-radius:10px}
.wrap{position:relative;max-width:1180px;margin:0 auto;padding:16px 18px 48px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.mood{font-family:var(--d);font-weight:800;font-size:30px;line-height:1;letter-spacing:-.02em;display:inline-flex;align-items:baseline;color:var(--ink)}
.mood svg{height:.56em;width:1em;margin:0 .035em;flex:none}
header .de{font-family:var(--m);font-size:10.5px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;padding-left:12px;border-left:1px solid var(--line)}
header .sp{flex:1}
.link{background:none;border:0;color:var(--mute);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.mono{font-family:var(--m);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}

.passos{display:flex;gap:6px;margin-bottom:22px}
.passos div{flex:1;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--dim);padding:9px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);white-space:nowrap;overflow:hidden}
.passos i{flex:none;font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--panel2);border:1px solid var(--line)}
.passos .at{color:var(--ink);border-color:rgba(180,92,255,.55)}
.passos .at i{background:var(--grad);color:#111;border:0}
.passos .ok{color:var(--mute)}
.passos .ok i{background:var(--ok);color:#0b1a10;border:0}
@media (max-width:640px){.passos span{display:none}.passos div{justify-content:center}}

.sobre-t{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sobre-t::before{content:"";width:26px;height:2px;border-radius:2px;background:var(--grad)}
h1{font-family:var(--d);font-weight:800;font-size:clamp(28px,5.2vw,44px);line-height:1.02;letter-spacing:-.03em;margin-bottom:10px;text-wrap:balance}
h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);font-size:15.5px;max-width:60ch;margin-bottom:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;font-weight:750;font-size:16px;border-radius:15px;padding:15px 22px;border:0;background:var(--grad);color:#14070e;transition:transform .12s,filter .15s,box-shadow .2s;box-shadow:0 12px 34px -14px rgba(180,92,255,.85)}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.full{width:100%}
.hide{display:none!important}

/* passo 1 */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;min-height:310px;border-radius:22px;border:1.5px dashed #3d4340;background:var(--panel);cursor:pointer;overflow:hidden;transition:border-color .2s,background .2s,transform .15s}
.drop:hover,.drop.sobre{border-color:var(--a2);background:var(--panel2)}
.drop.sobre{transform:scale(1.01)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop .bola{width:62px;height:62px;border-radius:50%;margin-bottom:6px}
.drop .bola.r{background:var(--grad)}
.drop .bola.v{border:9px solid var(--ink)}
.drop .n{font-family:var(--m);font-size:11.5px;letter-spacing:.16em;color:var(--mute)}
.drop b{font-family:var(--d);font-weight:800;font-size:21px;padding:0 14px}
.drop p{color:var(--mute);font-size:14px;max-width:30ch;padding:0 10px}
.drop>canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop.tem{border-style:solid;border-color:var(--line)}
.drop.tem .txt{display:none}
.drop.lendo::after{content:"Abrindo…";position:absolute;inset:0;display:grid;place-items:center;background:rgba(17,19,18,.82);font-weight:700;z-index:4}
.drop .tag,.drop .troca{position:absolute;top:12px;z-index:2;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(0,0,0,.62);backdrop-filter:blur(6px)}
.drop .tag{left:12px}.drop .troca{right:12px;display:none}
.drop.tem .troca{display:block}
.drop .nota{position:absolute;left:12px;right:12px;bottom:12px;z-index:2;font-size:12px;font-weight:600;padding:7px 10px;border-radius:12px;background:rgba(0,0,0,.66);backdrop-filter:blur(6px);text-align:left;line-height:1.3}
.drop .nota.al{color:#ffcf8a}
.tira{position:absolute;left:10px;right:10px;bottom:10px;z-index:3;display:flex;gap:6px;align-items:flex-end}
.tira button{flex:1;min-width:0;aspect-ratio:16/10;border-radius:9px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;background:#000;max-width:88px}
.tira button.on{border-color:#fff}
.tira canvas{width:100%;height:100%;object-fit:cover;display:block}
.tira+.nota{bottom:auto;top:46px;right:auto}
.acoes{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:20px}
.dica{color:var(--dim);font-size:13px}
.dicas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.dicas div{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px 14px;font-size:13.5px;color:var(--mute);line-height:1.4}
.dicas b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}
@media (max-width:720px){.duo{grid-template-columns:1fr}.drop{min-height:220px}.dicas{grid-template-columns:1fr}}

/* analisando: as duas bolas da marca se encontram */
.junta{position:relative;height:250px;max-width:520px;margin:26px auto 0}
.junta .b{position:absolute;top:50%;width:190px;height:190px;margin-top:-95px;border-radius:50%;overflow:hidden}
.junta .b canvas{width:100%;height:100%;object-fit:cover;display:block}
.junta .b.r{left:calc(50% - 170px);box-shadow:0 0 0 4px #FF6FAE,0 0 60px rgba(180,92,255,.5);animation:jr 2.1s cubic-bezier(.6,0,.3,1) both}
.junta .b.v{left:calc(50% - 20px);box-shadow:0 0 0 8px var(--ink);animation:jv 2.1s cubic-bezier(.6,0,.3,1) both}
.junta .b.v::after{content:"";position:absolute;inset:0;background:var(--grad);mix-blend-mode:soft-light;opacity:0;animation:jc 2.1s ease both}
@keyframes jr{from{transform:translateX(-46px)}to{transform:translateX(20px)}}
@keyframes jv{from{transform:translateX(46px)}to{transform:translateX(-20px)}}
@keyframes jc{60%{opacity:0}to{opacity:.85}}
.scan-t{text-align:center;margin-top:10px;color:var(--mute);font-weight:600;min-height:24px}
.barra{max-width:300px;height:5px;border-radius:5px;background:var(--panel2);margin:14px auto 0;overflow:hidden}
.barra i{display:block;height:100%;width:0;background:var(--grad);border-radius:5px;transition:width .5s ease}

/* passo 2 */
.ed{display:grid;grid-template-columns:minmax(0,1fr) 372px;grid-template-areas:"a b" "c b";gap:14px 18px;align-items:start}
.pvw{grid-area:a;min-width:0}.painel{grid-area:b}.extras{grid-area:c;min-width:0}
.modos{display:inline-flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:4px;margin-bottom:10px}
.md{cursor:pointer;border:0;background:none;font-weight:700;font-size:13px;color:var(--mute);padding:7px 12px;border-radius:9px}
.md.on{background:var(--ink);color:#111}
.pv{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#0e0f0f;touch-action:none;user-select:none;-webkit-user-select:none}
.pv canvas{display:block;width:100%;height:auto}
.pv .dep{position:absolute;inset:0;width:100%;height:100%}
.pv .corte{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 14px rgba(255,255,255,.7);z-index:2;cursor:ew-resize}
.pv .corte span{position:absolute;top:50%;left:50%;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.45);display:grid;place-items:center;color:#111;font-weight:900;font-size:13px;letter-spacing:2px}
.tg{position:absolute;top:12px;z-index:3;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);pointer-events:none}
.tg.l{left:12px}.tg.r{right:12px;background:var(--grad);color:#111}
.lado{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lado figure{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#0e0f0f;aspect-ratio:16/10}
.lado canvas{width:100%;height:100%;object-fit:cover;display:block}
.pals{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.pal{display:flex;border-radius:9px;overflow:hidden;height:26px}
.pal i{flex:1;transition:background .25s}
.cenas{margin-top:16px}
.cenas h3{font-size:14px;font-weight:700;margin-bottom:4px}
.cenas p{color:var(--mute);font-size:13px;margin-bottom:10px}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cn{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:1.5px dashed #3d4340;background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--mute);font-size:13px;font-weight:600;text-align:center}
.cn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.cn canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cn.tem{border-style:solid;border-color:var(--line)}
.cn .x{position:absolute;right:6px;top:6px;z-index:3;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:13px;cursor:pointer;display:none}
.cn.tem .x{display:block}

.painel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px}
.med{display:flex;align-items:center;gap:14px;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.med .anel{flex:none;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(from 210deg,#FFB347,#FF6FAE,#B45CFF,#5AB8FF var(--p,0%),#2c322e 0);transition:--p .3s}
.med .anel b{width:60px;height:60px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-family:var(--d);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.med strong{display:block;font-size:15px;line-height:1.25}
.med small{display:block;color:var(--mute);font-size:12.5px;line-height:1.35;margin-top:2px}
.painel .mono{display:block;margin-bottom:9px}
.est{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:16px}
.es{cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:10px 6px;text-align:center;transition:border-color .15s,background .15s}
.es b{display:block;font-size:14px}.es small{display:block;color:var(--mute);font-size:11.5px;line-height:1.25}
.es.on{border-color:transparent;background:linear-gradient(var(--panel2),var(--panel2)) padding-box,var(--grad) border-box;border:1.5px solid transparent}
.ctl{margin-bottom:14px}
.ctl .l{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:600;margin-bottom:6px}
.ctl .l small{font-weight:500;color:var(--mute);font-size:12px}
.ctl .l output{font-variant-numeric:tabular-nums;color:var(--mute);font-size:13px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;background:var(--trk,#2c322e);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 8px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:0}
.grande input[type=range]{height:9px;--trk:linear-gradient(90deg,#2c322e,#FF6FAE 60%,#B45CFF)}
.sw{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;margin:4px 0 16px;cursor:pointer}
.sw b{display:block;font-size:14px}.sw small{display:block;color:var(--mute);font-size:12.5px;line-height:1.3}
.sw .tog{flex:none;width:44px;height:26px;border-radius:26px;background:#2c322e;position:relative;transition:background .2s}
.sw .tog::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on .tog{background:var(--ok)}.sw.on .tog::after{transform:translateX(18px)}
details.fino{border-top:1px solid var(--line);padding-top:12px;margin-bottom:6px}
details.fino summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:14px;margin-bottom:12px}
details.fino summary small{font-weight:500;color:var(--dim);font-size:12px;margin-left:8px;flex:1}
details.fino summary::-webkit-details-marker{display:none}
details.fino summary::after{content:"+";color:var(--a);font-size:18px}
details.fino[open] summary::after{content:"–"}
.rst{display:block;margin:2px 0 14px auto}
@media (max-width:960px){.ed{grid-template-columns:minmax(0,1fr);grid-template-areas:"a" "b" "c"}.pvw{position:sticky;top:0;z-index:6;background:var(--bg);padding:6px 0 8px;margin:-6px 0 0}}

/* pronto */
.fim{max-width:640px;margin:0 auto;text-align:center}
.fim .sobre-t{justify-content:center}
.arq{display:flex;align-items:center;gap:14px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;margin:22px 0 16px}
.arq .ic{flex:none;width:56px;height:56px;border-radius:16px;background:var(--grad);display:grid;place-items:center;font-family:var(--m);font-size:12px;color:#111}
.arq b{display:block;font-family:var(--d);font-weight:800;font-size:19px}
.arq small{display:block;color:var(--mute);font-size:13px}
.como{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin-top:18px}
.como h3{font-size:15px;margin-bottom:10px}
.como ol{padding-left:20px;display:flex;flex-direction:column;gap:7px;color:var(--mute);font-size:14.5px}
.como b{color:var(--ink)}
.capcut{display:flex;align-items:center;gap:12px;text-align:left;background:linear-gradient(90deg,rgba(180,92,255,.12),transparent);border:1px dashed rgba(180,92,255,.5);border-radius:18px;padding:14px 16px;margin-top:14px}
.capcut b{display:block;font-size:15px}.capcut small{display:block;color:var(--mute);font-size:13px}
.capcut .breve{margin-left:auto;font-family:var(--m);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#d7b3ff;border:1px solid rgba(180,92,255,.55);border-radius:99px;padding:4px 9px;white-space:nowrap}
.progs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pg{cursor:pointer;font-weight:700;font-size:13px;color:var(--mute);background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:7px 13px}
.pg.on{background:var(--ink);color:#111;border-color:var(--ink)}
.lock{border-top:1px dashed var(--line);margin-top:16px;padding-top:16px}
.lock p{font-weight:700;margin-bottom:4px}.lock .sm{color:var(--mute);font-size:14px;margin-bottom:12px}
.inp{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font:inherit;font-size:16px;outline:none;margin-bottom:12px}
.inp:focus{border-color:var(--a2)}
.err{color:#ff8f7a;font-size:14px;min-height:20px;margin-top:8px}
.toast{pointer-events:none;position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#111;font-weight:700;font-size:14px;padding:11px 16px;border-radius:12px;transition:all .25s;z-index:30;max-width:92vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.entra>*{animation:entra .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes entra{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="mood" aria-label="Mood">M<svg viewBox="0 0 414 231" aria-hidden="true"><defs><linearGradient id="mg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="298" y2="231"><stop offset="0" stop-color="#FFB347"/><stop offset=".38" stop-color="#FF6FAE"/><stop offset=".7" stop-color="#B45CFF"/><stop offset="1" stop-color="#5AB8FF"/></linearGradient></defs><circle cx="115.5" cy="115.5" r="115.5" fill="url(#mg)"/><circle cx="298" cy="115.5" r="99.9" fill="none" stroke="currentColor" stroke-width="31.2"/></svg>d</span>
    <span class="de">Base FL</span>
    <div class="sp"></div>
    <button class="link" id="conta"></button>
  </header>
  <div class="passos" id="passos"></div>
  <main id="tela"></main>
</div>
<div class="toast" id="toast"></div>

<script>
// ===================== CONFIG =====================
const SUPA = { url:'https://otlaexuqyavpzxwzcsfo.supabase.co', key:'sb_publishable_bAaw1t6NpZEgH8ePBztQWg_tE4kDfQR' };
const PACK = 'fl-lut';
const BUY_URL = '';                 // página de vendas (colocar quando existir)
const NOME_LUT = 'LUT Base FL';     // nome fixo das LUTs: a pessoa não escolhe nem edita
const N = 33;                       // tamanho padrão do .cube

// ===================== utilidades =====================
const $ = s => document.querySelector(s);
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch {} } };
const calmo = matchMedia('(prefers-reduced-motion: reduce)').matches;
const espera = ms => new Promise(r => setTimeout(r, calmo ? Math.min(ms, 60) : ms));
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 3200); }
function tela(html){ const m = $('#tela'); m.className = 'entra'; m.innerHTML = html; window.scrollTo({ top:0 }); }
function passos(at){
  const P = ['Referência e seu vídeo','Ajuste','Pronto'];
  $('#passos').innerHTML = P.map((p, i) => `<div class="${i < at ? 'ok' : i === at ? 'at' : ''}"><i>${i < at ? '✓' : i + 1}</i><span>${p}</span></div>`).join('');
}

// ===================== cor: sRGB <-> Lab =====================
const lin = c => c <= .04045 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4);
const gam = c => c <= .0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - .055;

  const txt = k => k === 'forca' || k === 'cor' || k === 'luz' ? A[k] + '%' : (A[k] > 0 ? '+' : '') + A[k];
  const estilos = () => document.querySelectorAll('.es').forEach(b => b.classList.toggle('on', +b.dataset.v === A.forca));
  const liga = k => { const i = $('#i-' + k), o = $('#o-' + k); i.value = A[k]; o.textContent = txt(k); i.oninput = () => { A[k] = +i.value; o.textContent = txt(k); if (k === 'forca') estilos(); pinta(); }; };
  ['forca', ...FINO.map(f => f[0])].forEach(liga); estilos();
  document.querySelectorAll('.es').forEach(b => b.onclick = () => { A.forca = +b.dataset.v; liga('forca'); estilos(); pinta(); });
  const pele = $('#pele'); const pp = () => { pele.classList.toggle('on', A.pele); pele.setAttribute('aria-checked', A.pele); }; pp();
  pele.onclick = () => { A.pele = !A.pele; pp(); pinta(); }; pele.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); pele.click(); } };
  $('#rst').onclick = () => { FINO.forEach(([k]) => A[k] = PADRAO[k]); FINO.forEach(([k]) => liga(k)); pinta(); };
  const pv = $('#pv'); let arr = false;
  const mov = e => { const r = pv.getBoundingClientRect(); cortar((e.clientX - r.left) / r.width * 100); };
  pv.onpointerdown = e => { arr = true; pv.setPointerCapture(e.pointerId); mov(e); }; pv.onpointermove = e => { if (arr) mov(e); }; pv.onpointerup = pv.onpointercancel = () => arr = false;
  const cg = $('#cg');
  cg.innerHTML = [0,1,2].map(i => `<label class="cn" id="cn${i}"><canvas class="hide"></canvas><span class="t">＋ Cena ${i + 1}</span><button class="x" type="button" data-i="${i}">✕</button><input type="file" accept="image/*" data-i="${i}"></label>`).join('');
  const mostra = i => { const el = $('#cn' + i), c = el.querySelector('canvas'); if (CENAS[i]){ aplica(CENAS[i], c); c.classList.remove('hide'); el.classList.add('tem'); el.querySelector('.t').classList.add('hide'); } else { c.classList.add('hide'); el.classList.remove('tem'); el.querySelector('.t').classList.remove('hide'); } };
  cg.querySelectorAll('input').forEach(inp => inp.onchange = async e => { const i = +inp.dataset.i; try { CENAS[i] = paraCanvas(semBarras(paraCanvas(await carrega(e.target.files[0]), 900)).cv, 480); mostra(i); } catch(er){ toast(er.message); } inp.value = ''; });
  cg.querySelectorAll('.x').forEach(b => b.onclick = e => { e.preventDefault(); CENAS[+b.dataset.i] = null; mostra(+b.dataset.i); });
  montaLUT(); aplica(VID, cD); cortar(corteX); [0,1,2].forEach(mostra); troca(modo); mede();
  if (!calmo && modo === 'ab') (async () => { for (const v of [20, 80, 50]){ await espera(380); if (!arr && $('#ct')) { cD.style.transition = 'clip-path .5s ease'; $('#ct').style.transition = 'left .5s ease'; cortar(v); } } await espera(520); if ($('#ct')){ cD.style.transition = ''; $('#ct').style.transition = ''; } })();
  $('#volta').onclick = passo1;
  $('#pronto').onclick = passo3;
}

// ===================== PASSO 3: pronto =====================
const PROGS = {
  'CapCut': ['Selecione o clipe na timeline.', 'Abra <b>Ajuste › LUT</b> e clique em <b>Importar</b>.', 'Escolha o arquivo {arq}.', 'Regule a <b>intensidade</b> no próprio CapCut, se quiser.'],
  'Premiere': ['Selecione o clipe e abra o painel <b>Lumetri Color</b>.', 'Em <b>Criativo › Look</b>, escolha <b>Procurar…</b>.', 'Selecione o arquivo {arq}.', 'Ajuste a <b>intensidade</b> no controle logo abaixo.'],
  'DaVinci Resolve': ['Abra <b>Configurações do projeto › Gerenciamento de cor</b> e clique em <b>Abrir pasta de LUTs</b>.', 'Copie o arquivo {arq} para essa pasta e clique em <b>Atualizar listas</b>.', 'Na página <b>Color</b>, clique com o botão direito no nó e escolha a LUT.'],
  'Final Cut': ['Selecione o clipe e adicione o efeito <b>LUT Personalizada</b> (Custom LUT).', 'No inspetor, em <b>LUT</b>, escolha <b>Escolher LUT personalizada…</b>.', 'Selecione o arquivo {arq}.', 'Ajuste a <b>mistura</b> (Mix) para regular a intensidade.'],
};
function proximoNome(){ const n = (+store.get('fl_lut_n') || 0) + 1; return { n, nome: NOME_LUT + ' ' + String(n).padStart(3, '0') }; }
function passo3(){
  passos(2);
  montaLUT();
  const { nome } = proximoNome();
  const trava = acesso ? '' : `<div class="lock"><p>${vencido ? 'Seu acesso de 1 ano terminou' : 'Desbloqueie para baixar a sua LUT'}</p><div class="sm">${vencido ? 'Renove para continuar criando LUTs.' : 'Crie quantas LUTs quiser, por 1 ano, no celular e no computador.'}</div>
      <button class="btn full" id="comprar">${vencido ? 'Renovar meu acesso' : 'Desbloquear o Mood'}</button><button class="link" id="entrar" style="display:block;margin:12px auto 0">Já comprei · entrar</button></div>`;
  tela(`<div class="fim"><div class="sobre-t"><span class="mono">Sua LUT</span></div><h1>O mood está <em>copiado</em>.</h1><p class="sub" style="margin:0 auto">A LUT leva a cor da referência para o seu vídeo, com os ajustes que você fez.</p>
    <div class="arq"><span class="ic">.cube</span><span><b>${nome}</b><small>Arquivo ${nome}.cube · padrão ${N}×${N}×${N} · funciona no CapCut, Premiere, DaVinci e Final Cut</small></span></div>
    ${acesso ? `<button class="btn full" id="baixar">Baixar ${nome}</button>` : trava}
    <div class="capcut"><span><b>Instalar direto no CapCut</b><small>Um clique no app Base FL e a LUT aparece em Ajuste › LUT.</small></span><span class="breve">Em breve</span></div>
    <div class="como"><h3>Como usar no seu programa</h3>
      <div class="progs" id="progs">${Object.keys(PROGS).map((k, i) => `<button class="pg${i ? '' : ' on'}" data-k="${k}">${k}</button>`).join('')}</div>
      <ol id="progOl"></ol></div>
    <div class="acoes" style="justify-content:center"><button class="btn ghost" id="aj">← Voltar ao ajuste</button><button class="btn ghost" id="nova">Criar outra LUT</button></div></div>`);
  const prog = k => { $('#progOl').innerHTML = PROGS[k].map(t => `<li>${t.replace('{arq}', `<b>${nome}.cube</b>`)}</li>`).join(''); document.querySelectorAll('.pg').forEach(b => b.classList.toggle('on', b.dataset.k === k)); };
  document.querySelectorAll('.pg').forEach(b => b.onclick = () => prog(b.dataset.k)); prog('CapCut');
  $('#aj').onclick = passo2;
  $('#nova').onclick = () => { VIDS = []; REFS = []; iV = iR = 0; NOTAS = { V:'', R:'' }; CENAS = [null, null, null]; M = null; LUT = null; passo1(); };
  if ($('#baixar')) $('#baixar').onclick = () => {
    const { n, nome: nm } = proximoNome();
    const blob = new Blob([arquivoCube(nm)], { type:'text/plain' }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = nm + '.cube'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    store.set('fl_lut_n', String(n)); toast(nm + ' baixada'); $('#baixar').textContent = 'Baixar de novo';
  };
  if ($('#comprar')) $('#comprar').onclick = () => BUY_URL ? (location.href = BUY_URL) : toast('Link de compra em breve.');
  if ($('#entrar')) $('#entrar').onclick = () => login(passo3);
}

// ===================== login e licença (igual às outras ferramentas) =====================
async function api(path, { method='GET', body, auth=true } = {}){
  const h = { apikey:SUPA.key, 'Content-Type':'application/json' };
  if (auth && sess) h.Authorization = 'Bearer ' + sess.access_token;
  const r = await fetch(SUPA.url + path, { method, headers:h, body: body ? JSON.stringify(body) : undefined });
  const t = await r.text(); let j; try { j = t ? JSON.parse(t) : {}; } catch { j = t; }
  if (!r.ok){ const e = new Error(traduz(j?.msg || j?.message || j?.error_description || j?.error || ('Erro ' + r.status))); e.status = r.status; throw e; }
  return j;
}
function traduz(m){
  m = String(m||'');
  if (/only request this after (\d+)/i.test(m)) return 'Aguarde ' + m.match(/after (\d+)/i)[1] + ' segundos para pedir outro código.';
  if (/expired|invalid/i.test(m) && /token|otp/i.test(m)) return 'Código inválido ou expirado. Confira ou peça outro.';
  if (/rate limit/i.test(m)) return 'Muitas tentativas. Aguarde alguns minutos.';
  if (/failed to fetch|network|load failed/i.test(m)) return 'Sem conexão com a internet.';
  return m;
}
const fromAuth = r => ({ access_token:r.access_token, refresh_token:r.refresh_token, expires_at:r.expires_at || Math.floor(Date.now()/1000) + (r.expires_in||3600), email:r.user?.email });
function salva(s){ sess = s; store.set('fl_sess', s ? JSON.stringify(s) : null); botaoConta(); }
async function sessaoValida(){
  if (!sess) return false;
  if (sess.expires_at - Date.now()/1000 > 90) return true;
  try { const r = await api('/auth/v1/token?grant_type=refresh_token', { method:'POST', body:{ refresh_token:sess.refresh_token }, auth:false }); salva({ ...fromAuth(r), email:r.user?.email || sess.email }); return true; }
  catch(e){ if (e.status >= 400 && e.status < 500){ salva(null); return false; } return true; }
}
async function checaAcesso(){
  acesso = false; vencido = false;
  try {
    if (!(await sessaoValida())) return;
    const lic = await api(`/rest/v1/licenses?select=*&pack_id=eq.${PACK}`);
    const agora = Date.now(), ativa = lic.find(l => l.status === 'active'), venc = ativa?.expires_at ? new Date(ativa.expires_at).getTime() : null;
    acesso = !!ativa && (!venc || venc > agora); vencido = !!ativa && !!venc && venc <= agora;
  } catch {}
}
function botaoConta(){ const b = $('#conta'); b.textContent = sess ? 'Sair' : 'Entrar'; b.onclick = () => { if (sess){ salva(null); acesso = false; toast('Você saiu.'); } else login(() => (VIDS.length && REFS.length && LUT) ? passo3() : passo1()); }; }
function login(depois){
  let email = '';
  const etapa = codigo => {
    tela(`<div style="max-width:440px"><button class="link" id="voltar" style="margin-bottom:14px">← Voltar</button>
      <h1>${codigo ? 'Digite o código' : 'Entre com o e-mail da compra'}</h1>
      <p class="sub">${codigo ? 'Enviamos um código para ' + email + '. Confira também o spam.' : 'O mesmo e-mail que você usou para comprar. Vamos mandar um código de acesso.'}</p>
      <input class="inp" id="campo" ${codigo ? 'inputmode="numeric" autocomplete="one-time-code" placeholder="Código"' : 'type="email" autocomplete="email" placeholder="seu@email.com"'}>
      <button class="btn full" id="vai">${codigo ? 'Entrar' : 'Enviar código'}</button><div class="err" id="erro"></div></div>`);
    $('#campo').focus(); $('#campo').onkeydown = e => { if (e.key === 'Enter') $('#vai').click(); };
    $('#voltar').onclick = () => codigo ? etapa(false) : depois();
    $('#vai').onclick = async () => {
      const b = $('#vai'); b.disabled = true; $('#erro').textContent = '';
      try {
        if (!codigo){
          email = $('#campo').value.trim().toLowerCase();
          if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw new Error('Digite um e-mail válido.');
          await api('/auth/v1/otp', { method:'POST', body:{ email, create_user:true }, auth:false }); etapa(true);
        } else {
          const token = $('#campo').value.replace(/\D/g,'');
          if (token.length < 6) throw new Error('Digite o código que chegou no e-mail.');
          const r = await api('/auth/v1/verify', { method:'POST', body:{ type:'email', email, token }, auth:false });
          salva(fromAuth(r)); await checaAcesso();
          toast(acesso ? 'Ferramenta desbloqueada' : 'Entrou, mas o Mood não está nas compras deste e-mail'); depois();
        }
      } catch(e){ $('#erro').textContent = traduz(e.message); b.disabled = false; }
    };
  };
  etapa(false);
}


// ===================== início =====================
botaoConta(); passo1();
checaAcesso().then(() => { if ($('.fim')) passo3(); });
</script>
