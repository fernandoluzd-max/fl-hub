<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..900&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#111312; --panel:#191C1B; --panel2:#202423; --line:#2B302E; --ink:#F4F0E4; --mute:#B3B4A2; --dim:#8A8B7F;
  --a:#FF6FAE; --a2:#B45CFF; --ok:#7fce8f;
  --grad:linear-gradient(125deg,#FFB347,#FF6FAE 38%,#B45CFF 70%,#5AB8FF);
  --d:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --m:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--ink);font:16px/1.5 var(--f);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(760px 520px at 88% -8%,rgba(180,92,255,.16),transparent 70%),radial-gradient(620px 420px at -6% 4%,rgba(255,179,71,.07),transparent 70%)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--a);outline-offset:3px;border-radius:10px}
.wrap{position:relative;max-width:1180px;margin:0 auto;padding:16px 18px 48px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.mood{font-family:var(--d);font-weight:800;font-size:30px;line-height:1;letter-spacing:-.02em;display:inline-flex;align-items:baseline;color:var(--ink)}
.mood svg{height:.56em;width:1em;margin:0 .035em;flex:none}
header .de{font-family:var(--m);font-size:10.5px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;padding-left:12px;border-left:1px solid var(--line)}
header .sp{flex:1}
.link{background:none;border:0;color:var(--mute);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.mono{font-family:var(--m);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}

.passos{display:flex;gap:6px;margin-bottom:22px}
.passos div{flex:1;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--dim);padding:9px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);white-space:nowrap;overflow:hidden}
.passos i{flex:none;font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--panel2);border:1px solid var(--line)}
.passos .at{color:var(--ink);border-color:rgba(180,92,255,.55)}
.passos .at i{background:var(--grad);color:#111;border:0}
.passos .ok{color:var(--mute)}
.passos .ok i{background:var(--ok);color:#0b1a10;border:0}
@media (max-width:640px){.passos span{display:none}.passos div{justify-content:center}}

.sobre-t{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sobre-t::before{content:"";width:26px;height:2px;border-radius:2px;background:var(--grad)}
h1{font-family:var(--d);font-weight:800;font-size:clamp(28px,5.2vw,44px);line-height:1.02;letter-spacing:-.03em;margin-bottom:10px;text-wrap:balance}
h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);font-size:15.5px;max-width:60ch;margin-bottom:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;font-weight:750;font-size:16px;border-radius:15px;padding:15px 22px;border:0;background:var(--grad);color:#14070e;transition:transform .12s,filter .15s,box-shadow .2s;box-shadow:0 12px 34px -14px rgba(180,92,255,.85)}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.full{width:100%}
.hide{display:none!important}

/* passo 1 */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;min-height:310px;border-radius:22px;border:1.5px dashed #3d4340;background:var(--panel);cursor:pointer;overflow:hidden;transition:border-color .2s,background .2s,transform .15s}
.drop:hover,.drop.sobre{border-color:var(--a2);background:var(--panel2)}
.drop.sobre{transform:scale(1.01)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop .bola{width:62px;height:62px;border-radius:50%;margin-bottom:6px}
.drop .bola.r{background:var(--grad)}
.drop .bola.v{border:9px solid var(--ink)}
.drop .n{font-family:var(--m);font-size:11.5px;letter-spacing:.16em;color:var(--mute)}
.drop b{font-family:var(--d);font-weight:800;font-size:21px;padding:0 14px}
.drop p{color:var(--mute);font-size:14px;max-width:30ch;padding:0 10px}
.drop>canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0b0c0c}   /* a imagem aparece inteira, em pé ou deitada */
.drop.tem{border-style:solid;border-color:var(--line)}
.drop.tem .txt{display:none}
.drop.lendo::after{content:"Abrindo…";position:absolute;inset:0;display:grid;place-items:center;background:rgba(17,19,18,.82);font-weight:700;z-index:4}
.drop .tag,.drop .troca{position:absolute;top:12px;z-index:2;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(0,0,0,.62);backdrop-filter:blur(6px)}
.drop .tag{left:12px}.drop .troca{right:12px;display:none}
.drop.tem .troca{display:block}
.drop .nota{position:absolute;left:12px;right:12px;bottom:12px;z-index:2;font-size:12px;font-weight:600;padding:7px 10px;border-radius:12px;background:rgba(0,0,0,.66);backdrop-filter:blur(6px);text-align:left;line-height:1.3}
.drop .nota.al{color:#ffcf8a}
.tira{position:absolute;left:10px;right:10px;bottom:10px;z-index:3;display:flex;gap:6px;align-items:flex-end}
.tira button{flex:1;min-width:0;aspect-ratio:16/10;border-radius:9px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;background:#000;max-width:88px}
.tira button.on{border-color:#fff}
.tira canvas{width:100%;height:100%;object-fit:cover;display:block}
.tira+.nota{bottom:auto;top:46px;right:auto}
.acoes{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:20px}
.dica{color:var(--dim);font-size:13px}
.dicas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.dicas div{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px 14px;font-size:13.5px;color:var(--mute);line-height:1.4}
.dicas b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}
@media (max-width:720px){.duo{grid-template-columns:1fr}.drop{min-height:220px}.dicas{grid-template-columns:1fr}}

/* analisando: as duas bolas da marca se encontram */
.junta{position:relative;height:250px;max-width:520px;margin:26px auto 0}
/* as duas bolhas são iguais: mesmo tamanho, mesmo aro, imagem recortada em quadrado antes de entrar (nada escapa do círculo) */
.junta .b{position:absolute;top:50%;width:190px;height:190px;margin-top:-95px;border-radius:50%;padding:4px;background:#FF6FAE}
.junta .b canvas{position:absolute;left:4px;top:4px;width:182px;height:182px;border-radius:50%;display:block}
.junta .b.r{left:calc(50% - 170px);box-shadow:0 0 60px rgba(180,92,255,.5);animation:jr 2.1s cubic-bezier(.6,0,.3,1) both;z-index:2}
.junta .b.v{left:calc(50% - 20px);background:var(--ink);animation:jv 2.1s cubic-bezier(.6,0,.3,1) both;transition:background .5s,box-shadow .7s}
@keyframes jr{from{transform:translateX(-46px)}to{transform:translateX(20px)}}
@keyframes jv{from{transform:translateX(46px)}to{transform:translateX(-20px)}}
/* a transformação: a cor da referência "escorre" para o vídeo. O que aparece é o resultado de verdade, feito com a LUT pronta. */
.junta #jv2{clip-path:circle(0% at 0% 50%);transition:clip-path 1.25s cubic-bezier(.5,0,.2,1)}
.junta.muda #jv2{clip-path:circle(150% at 0% 50%)}
.junta.muda .b.v{background:var(--grad);box-shadow:0 0 70px rgba(255,111,174,.45)}
.junta .luz{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:#fff;opacity:0;pointer-events:none;z-index:3}
.junta.muda .luz{animation:jluz 1.1s ease-out both}
@keyframes jluz{0%{opacity:.8;transform:scale(.4)}40%{opacity:.28}100%{opacity:0;transform:scale(12)}}
.junta.muda .b.r{animation:jr 2.1s cubic-bezier(.6,0,.3,1) both,jpulso .7s ease both}
@keyframes jpulso{50%{box-shadow:0 0 90px rgba(255,111,174,.9)}}
.scan-t{text-align:center;margin-top:10px;color:var(--mute);font-weight:600;min-height:24px}
.barra{max-width:300px;height:5px;border-radius:5px;background:var(--panel2);margin:14px auto 0;overflow:hidden}
.barra i{display:block;height:100%;width:0;background:var(--grad);border-radius:5px;transition:width .5s ease}

/* passo 2 */
.ed{display:grid;grid-template-columns:minmax(0,1fr) 372px;grid-template-areas:"a b" "c b";gap:14px 18px;align-items:start}
.pvw{grid-area:a;min-width:0}.painel{grid-area:b}.extras{grid-area:c;min-width:0}
.modos{display:inline-flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:4px;margin-bottom:10px}
.md{cursor:pointer;border:0;background:none;font-weight:700;font-size:13px;color:var(--mute);padding:7px 12px;border-radius:9px}
.md.on{background:var(--ink);color:#111}
/* a prévia acompanha o formato do vídeo (em pé ou deitado) e nunca passa da altura da tela */
.ed{--ar:1.7778;--mh:min(68vh,640px)}
.pv{width:min(100%,calc(var(--mh) * var(--ar)));margin:0 auto;position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#0e0f0f;touch-action:none;user-select:none;-webkit-user-select:none}
.pv canvas{display:block;width:100%;height:auto}
.pv .dep{position:absolute;inset:0;width:100%;height:100%}
.pv .corte{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 14px rgba(255,255,255,.7);z-index:2;cursor:ew-resize}
.pv .corte span{position:absolute;top:50%;left:50%;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.45);display:grid;place-items:center;color:#111;font-weight:900;font-size:13px;letter-spacing:2px}
.tg{position:absolute;top:12px;z-index:3;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);pointer-events:none}
.tg.l{left:12px}.tg.r{right:12px;background:var(--grad);color:#111}
.lado{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(100%,calc(var(--mh) * var(--ar) * 2 + 8px));margin:0 auto}
.lado figure{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#0e0f0f;aspect-ratio:var(--ar);margin:0}
.lado canvas{width:100%;height:100%;object-fit:contain;display:block}
.pals{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.pal{display:flex;border-radius:9px;overflow:hidden;height:26px}
.pal i{flex:1;transition:background .25s}
.cenas{margin-top:16px}
.perfil{margin:18px 0 4px}.perfil .mono{display:block;margin-bottom:9px}.pfs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pf{font:inherit;text-align:left;cursor:pointer;padding:10px 12px;border-radius:13px;border:1px solid var(--line);background:var(--panel);color:inherit}
.pf b{display:block;font-size:14px}.pf small{display:block;color:var(--mute);font-size:11.5px;margin-top:2px;line-height:1.3}
.pf.on{background:linear-gradient(var(--panel2),var(--panel2)) padding-box,var(--grad) border-box;border:1.5px solid transparent}
.pfn{color:var(--mute);font-size:12.5px;margin-top:8px;min-height:1em}
@media (max-width:640px){.pfs{grid-template-columns:1fr 1fr}}
.scp{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.scp .tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.scp .tabs button{font:inherit;font-size:12px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--mute);cursor:pointer}
.scp .tabs button.on{color:#111;background:var(--grad);border-color:transparent}
.scp .par{display:grid;grid-template-columns:1fr 1fr;gap:10px}.scp figure{margin:0}.scp canvas{width:100%;display:block;border-radius:10px;background:#000;image-rendering:auto}
.scp figcaption{font-size:11px;color:var(--mute);margin-top:4px;font-family:var(--m);letter-spacing:.08em;text-transform:uppercase}
.qa{margin-top:12px;display:grid;gap:6px}.qa div{display:flex;gap:8px;align-items:baseline;font-size:13px}.qa b{flex:none;width:18px;text-align:center}.qa small{color:var(--mute);margin-left:auto;font-family:var(--m);font-size:11px}
@media (max-width:640px){.scp .par{grid-template-columns:1fr}}
.cenas h3{font-size:14px;font-weight:700;margin-bottom:4px}
.cenas p{color:var(--mute);font-size:13px;margin-bottom:10px}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(100%,calc(var(--mh) * var(--ar) * 1.5));}
.cn{position:relative;aspect-ratio:var(--ar);border-radius:14px;overflow:hidden;border:1.5px dashed #3d4340;background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--mute);font-size:13px;font-weight:600;text-align:center}
.cn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.cn canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cn.tem{border-style:solid;border-color:var(--line)}
.cn .x{position:absolute;right:6px;top:6px;z-index:3;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:13px;cursor:pointer;display:none}
.cn.tem .x{display:block}

.painel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px}
.med{display:flex;align-items:center;gap:14px;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.med .anel{flex:none;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(from 210deg,#FFB347,#FF6FAE,#B45CFF,#5AB8FF var(--p,0%),#2c322e 0);transition:--p .3s}
.med .anel b{width:60px;height:60px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-family:var(--d);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.med strong{display:block;font-size:15px;line-height:1.25}
.med small{display:block;color:var(--mute);font-size:12.5px;line-height:1.35;margin-top:2px}
.painel .mono{display:block;margin-bottom:9px}
.est{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:16px}
.es{cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:10px 6px;text-align:center;transition:border-color .15s,background .15s}
.es b{display:block;font-size:14px}.es small{display:block;color:var(--mute);font-size:11.5px;line-height:1.25}
.es.on{border-color:transparent;background:linear-gradient(var(--panel2),var(--panel2)) padding-box,var(--grad) border-box;border:1.5px solid transparent}
.ctl{margin-bottom:14px}
.ctl .l{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:600;margin-bottom:6px}
.ctl .l small{font-weight:500;color:var(--mute);font-size:12px}
.ctl .l output{font-variant-numeric:tabular-nums;color:var(--mute);font-size:13px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;background:var(--trk,#2c322e);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 8px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:0}
.grande input[type=range]{height:9px;--trk:linear-gradient(90deg,#2c322e,#FF6FAE 60%,#B45CFF)}
.sw{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;margin:4px 0 16px;cursor:pointer}
.sw b{display:block;font-size:14px}.sw small{display:block;color:var(--mute);font-size:12.5px;line-height:1.3}
.sw .tog{flex:none;width:44px;height:26px;border-radius:26px;background:#2c322e;position:relative;transition:background .2s}
.sw .tog::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on .tog{background:var(--ok)}.sw.on .tog::after{transform:translateX(18px)}
details.fino{margin:14px 0 10px}
details.fino summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid color-mix(in srgb,var(--a2) 45%,var(--line));background:linear-gradient(120deg,rgba(255,111,174,.10),rgba(180,92,255,.10));transition:border-color .2s,background .2s}
details.fino summary:hover{border-color:var(--a);background:linear-gradient(120deg,rgba(255,111,174,.18),rgba(180,92,255,.18))}
details.fino summary::-webkit-details-marker{display:none}
details.fino summary .fi{flex:none;width:38px;height:38px;border-radius:11px;background:var(--grad);display:grid;place-items:center}
details.fino summary .fi svg{width:20px;height:20px;fill:none;stroke:#141414;stroke-width:2.2;stroke-linecap:round}
details.fino summary .ft{flex:1;min-width:0;display:grid;gap:1px}
details.fino summary .ft b{font-weight:750;font-size:15px}
details.fino summary .ft small{font-weight:500;color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.fino summary .fa{flex:none;display:inline-flex;align-items:center;gap:6px;font-weight:750;font-size:13px;color:#141414;background:var(--ink);border-radius:99px;padding:7px 12px}
details.fino summary .fa::after{content:"";width:7px;height:7px;border-right:2.2px solid currentColor;border-bottom:2.2px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .2s}
details.fino[open] summary{margin-bottom:14px}
details.fino[open] summary .fa::after{transform:translateY(2px) rotate(-135deg)}
details.fino summary .fa .f1{display:inline}details.fino summary .fa .f2{display:none}
details.fino[open] summary .fa .f1{display:none}details.fino[open] summary .fa .f2{display:inline}
.rst{display:block;margin:2px 0 14px auto}
@media (max-width:960px){.ed{--mh:44vh;grid-template-columns:minmax(0,1fr);grid-template-areas:"a" "b" "c"}.pvw{position:sticky;top:0;z-index:6;background:var(--bg);padding:6px 0 8px;margin:-6px 0 0}}

/* pronto */
.fim{max-width:640px;margin:0 auto;text-align:center}
.fim .sobre-t{justify-content:center}
.arq{display:flex;align-items:center;gap:14px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;margin:22px 0 16px}
.arq .ic{flex:none;width:56px;height:56px;border-radius:16px;background:var(--grad);display:grid;place-items:center;font-family:var(--m);font-size:12px;color:#111}
.arq b{display:block;font-family:var(--d);font-weight:800;font-size:19px}
.arq small{display:block;color:var(--mute);font-size:13px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.link.aula{position:relative;display:inline-flex;align-items:center;gap:7px;text-decoration:none;font-weight:800;font-size:13.5px;color:#14070e;background:var(--grad);border:0;border-radius:99px;padding:8px 14px 8px 10px;margin-right:6px;box-shadow:0 8px 22px -10px rgba(255,111,174,.9)}

@keyframes aulaPulso{0%{opacity:.85;transform:scale(.96)}100%{opacity:0;transform:scale(1.12)}}
.ajuda{margin:-6px 0 22px}
.ac-k{display:block;font:700 11px var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0 0 2px!important}

.aula-card{display:flex;align-items:center;gap:14px;margin:0;padding:14px 16px;border-radius:18px;background:linear-gradient(var(--panel),var(--panel)) padding-box,var(--grad) border-box;border:1.5px solid transparent;cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.aula-card:hover{background:linear-gradient(var(--panel2),var(--panel2)) padding-box,var(--grad) border-box}

.aula-card .ac-ic::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid #FF6FAE;opacity:0;animation:aulaPulso 2.2s ease-out infinite}
.aula-card.vista .ac-ic::after{display:none}

/* aula antes do teste */

.rever{display:inline-flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);border-radius:999px;color:var(--mute);font-size:13.5px;font-weight:600;padding:7px 14px 7px 9px;cursor:pointer;margin:-8px 0 20px;transition:border-color .15s,color .15s}
.rever:hover{color:var(--ink);border-color:#3c4240}

.rever b svg{width:10px;height:10px;margin-left:1px}

/* ===== Player da aula · v3 (Smart Autoplay + controles temáticos) ===== */
.pl{--p:0;--b:0;position:relative;border-radius:22px;overflow:hidden;background:#0a0b0b;aspect-ratio:16/9;isolation:isolate;box-shadow:0 30px 80px -40px rgba(180,92,255,.55),0 0 0 1px rgba(255,255,255,.06);-webkit-tap-highlight-color:transparent}
.pl::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);opacity:.35;pointer-events:none;transition:opacity .3s}
.pl.toca::after{opacity:.12}
.pl video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;cursor:pointer}

/* capa (play manual: autoplay bloqueado ou rede lenta) */
.pl .capa{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(70% 70%,rgba(10,11,11,.15),rgba(10,11,11,.72));cursor:pointer;transition:opacity .35s;z-index:2;border:0;width:100%;padding:0}
.pl.iniciou .capa,.pl.auto-tenta .capa,.pl.erro .capa{opacity:0;pointer-events:none}
.pl .play{position:relative;width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:var(--grad);color:#14070e;box-shadow:0 18px 50px -12px rgba(255,111,174,.8);transition:transform .2s}
.pl .play::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(255,255,255,.28);animation:aro 2.4s ease-out infinite}
.pl .capa:hover .play{transform:scale(1.06)}
.pl .play svg{width:30px;height:30px;margin-left:5px}
.pl .rot{position:absolute;left:22px;bottom:20px;text-align:left;font-family:var(--d);font-weight:700;font-size:15px;color:var(--ink)}
.pl .rot small{display:block;font-family:var(--m);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}

/* carregando */
.pl .giro{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;border:3px solid rgba(255,255,255,.16);border-top-color:#FF6FAE;border-right-color:#B45CFF;animation:gira .8s linear infinite;opacity:0;transition:opacity .2s;z-index:3;pointer-events:none}
.pl.carrega .giro{opacity:1}
.pl:not(.iniciou):not(.auto-tenta) .giro{opacity:0}   /* capa de play manual à mostra: só ela, sem spinner por cima */
.pl.carrega.mudo-auto .giro{opacity:0}
.pl .lento-t{position:absolute;left:0;right:0;top:14px;text-align:center;font:700 11px var(--m);letter-spacing:.08em;color:var(--mute);opacity:0;transition:opacity .3s;z-index:3;pointer-events:none}
.pl.carrega.lento:not(.mudo-auto) .lento-t{opacity:1}

.pl .flash{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px;border-radius:50%;background:rgba(10,11,11,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;opacity:0;pointer-events:none;z-index:2}
.pl .flash svg{width:24px;height:24px;color:#fff}
.pl .flash.on{animation:pisca .5s ease-out}

/* Smart Autoplay: o vídeo já está rodando mudo por baixo */
.pl .somon{position:absolute;inset:0;z-index:4;display:grid;place-content:center;justify-items:center;gap:14px;width:100%;height:100%;padding:16px;border:0;border-radius:0;cursor:pointer;color:#fff;font:inherit;background:radial-gradient(65% 75% at 50% 50%,rgba(5,6,6,.5),rgba(5,6,6,.12) 72%,transparent),linear-gradient(to top,rgba(5,6,6,.5),transparent 42%);opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s linear .35s}
.pl.mudo-auto .somon{opacity:1;visibility:visible;transition:opacity .35s ease}
.pl .somon .ao-vivo{display:inline-flex;align-items:center;gap:8px;font:700 11px var(--m);letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.94);padding:7px 12px 7px 10px;border-radius:999px;background:rgba(10,11,11,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.pl .somon .ao-vivo i{width:7px;height:7px;border-radius:50%;background:#FF6FAE;animation:vivo 1.6s ease-out infinite}
.pl .somon .pilula{position:relative;display:inline-flex;align-items:center;gap:10px;background:var(--grad);color:#14070e;font:800 17px var(--f);padding:15px 24px 15px 18px;border-radius:999px;box-shadow:0 18px 50px -12px rgba(255,111,174,.85);white-space:nowrap;transition:transform .18s}
.pl .somon .pilula::before{content:"";position:absolute;inset:-8px;border-radius:inherit;border:1px solid rgba(255,255,255,.35);animation:aro 2.2s ease-out infinite}
.pl .somon:hover .pilula{transform:scale(1.03)}
.pl .somon:active .pilula{transform:scale(.97)}
.pl .somon .pilula svg{width:22px;height:22px}
.pl .mudo-barra{position:absolute;left:0;right:0;bottom:0;height:3px;z-index:4;background:rgba(255,255,255,.12);opacity:0;transition:opacity .35s;pointer-events:none}
.pl .mudo-barra::before{content:"";position:absolute;inset:0 auto 0 0;width:calc(var(--p)*100%);background:var(--grad);background-size:calc(100% / max(var(--p),.001)) 100%}

/* falha de carregamento: estado honesto, com saída */
.pl .falha{position:absolute;inset:0;z-index:5;display:none;place-content:center;justify-items:center;gap:14px;text-align:center;padding:20px;background:rgba(10,11,11,.94)}
.pl.erro .falha{display:grid}
.pl .falha p{margin:0;max-width:34ch;color:var(--mute);font-size:14px;line-height:1.45}
.pl .falha strong{display:block;color:var(--ink);font:700 17px var(--d);margin-bottom:4px}
.pl .falha button{border:0;cursor:pointer;font:700 14px var(--f);color:var(--ink);background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);padding:11px 18px;border-radius:999px;min-height:44px}
.pl .falha button[hidden]{display:none}

/* controles: sutis, na paleta da página */
.pl .ctl{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:28px 14px 10px;background:linear-gradient(to top,rgba(10,11,11,.78),rgba(10,11,11,.35) 60%,transparent);transition:opacity .25s,transform .25s}
.pl:not(.iniciou) .ctl,.pl.mudo-auto .ctl,.pl.erro .ctl{opacity:0;pointer-events:none}
.pl.quieto .ctl{opacity:0;transform:translateY(6px);pointer-events:none}
.pl.quieto{cursor:none}
.pl .barra{position:relative;height:18px;display:flex;align-items:center;cursor:pointer;touch-action:none;margin:0 0 4px;max-width:none;background:none;border-radius:0;overflow:visible}   /* neutraliza o .barra genérico da página (max-width 300px + overflow hidden) */
.pl .trilho{position:relative;width:100%;height:3px;border-radius:3px;background:rgba(244,240,228,.14);transition:height .15s}
.pl .barra:hover .trilho,.pl .barra.arrasta .trilho{height:5px}
.pl .buf{position:absolute;inset:0 auto 0 0;width:calc(var(--b)*100%);border-radius:inherit;background:rgba(244,240,228,.16)}
.pl .feito{position:absolute;inset:0 auto 0 0;width:calc(var(--p)*100%);border-radius:inherit;background:var(--grad);background-size:calc(100% / max(var(--p),.001)) 100%}
.pl .bolinha{position:absolute;top:50%;left:calc(var(--p)*100%);width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 3px rgba(255,111,174,.32),0 2px 8px rgba(0,0,0,.4);transform:scale(0);transition:transform .15s}
.pl .barra:hover .bolinha,.pl .barra.arrasta .bolinha{transform:scale(1)}
.pl .dica{position:absolute;bottom:22px;left:0;transform:translateX(-50%);font:700 11.5px var(--m);background:rgba(10,11,11,.92);border:1px solid var(--line);border-radius:8px;padding:4px 7px;color:var(--ink);opacity:0;pointer-events:none;transition:opacity .12s;white-space:nowrap}
.pl .barra:hover .dica,.pl .barra.arrasta .dica{opacity:1}
.pl .lin{display:flex;align-items:center;gap:4px}
.pl .bt{flex:0 0 auto;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:none;border:0;color:rgba(244,240,228,.82);cursor:pointer;transition:background .15s,color .15s}
.pl .bt:hover{background:rgba(244,240,228,.08);color:var(--ink)}
.pl .bt svg{width:20px;height:20px}
.pl #ptoca{width:36px;height:36px;margin-right:4px;background:var(--grad);color:#14070e;box-shadow:0 6px 18px -8px rgba(255,111,174,.9)}
.pl #ptoca svg{width:16px;height:16px}
.pl #ptoca:hover{filter:brightness(1.06)}
.pl .vol{display:flex;align-items:center}
.pl .vol input{width:0;opacity:0;transition:width .2s,opacity .2s;accent-color:#FF6FAE;cursor:pointer}
.pl .vol:hover input,.pl .vol:focus-within input{width:76px;opacity:1;margin:0 6px 0 2px}
.pl .tempo{font:600 12px var(--m);color:rgba(244,240,228,.88);letter-spacing:.02em;margin-left:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pl .tempo span{color:var(--dim)}
.pl .vel{display:flex;gap:2px;margin-left:auto;border-radius:999px;padding:3px;background:rgba(244,240,228,.06)}
.pl .vel button{border:0;background:none;color:var(--mute);font:700 12px var(--m);padding:6px 9px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s}
.pl .vel button:hover{color:var(--ink)}
.pl .vel button[aria-pressed="true"]{background:rgba(244,240,228,.1);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,111,174,.45)}
.pl .vel1{display:none}
.pl .bt:focus-visible,.pl .vel button:focus-visible,.pl .barra:focus-visible,.pl .somon:focus-visible .pilula,.pl .capa:focus-visible .play{outline:2px solid #FF6FAE;outline-offset:2px}

/* tela cheia (Android/desktop; iPhone usa a do próprio vídeo) */
.pl:fullscreen{border-radius:0;aspect-ratio:auto;width:100%;height:100%;margin:0;box-shadow:none}
.pl:-webkit-full-screen{border-radius:0;aspect-ratio:auto;width:100%;height:100%;margin:0;box-shadow:none}
.pl:fullscreen::after{display:none}
.pl:fullscreen .ctl{padding:28px max(18px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}

/* botão para seguir: aparece sozinho, centralizado sob o vídeo */
.acoes.aula{justify-content:center;min-height:54px;margin-top:20px}

@keyframes aro{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.35);opacity:0}}

}

/* ===================== modo aluno · Prova de cor ===================== */
:root{--aluno:#F2A541}
body.modo-aluno::before{display:none}
.al-fita{position:sticky;top:0;z-index:40;display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:0 18px;border:0;border-bottom:1px solid var(--line);background:var(--panel);color:var(--aluno);font:700 11px/1.3 var(--m);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;text-align:left}
.al-fita b{color:var(--ink)}
.al-fita .al-ver{color:var(--mute);flex:none}
.al-fita .al-desk{display:none}
.al-fita[hidden]{display:none}
.al-fita:focus-visible{outline-offset:-3px}
@media (min-width:981px){.al-fita .al-cel{display:none}.al-fita .al-desk{display:inline}.al-fita{justify-content:center;gap:28px}}
body.modo-aluno .passos{display:block;margin-bottom:18px}
body.modo-aluno .passos[hidden]{display:none}
.al-prog{font:700 11px var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
.al-prog b{color:var(--ink)}
.al-segs{display:flex;gap:4px}
.al-segs i{flex:1;height:2px;border-radius:2px;background:var(--line)}

.al-quadro .rg{position:absolute;width:14px;height:14px;border:0 solid #5A615E;pointer-events:none}

}

<div class="wrap">

<script>
// ===================== CONFIG =====================
const PACK = 'fl-lut';
const NOME_LUT = 'LUT Base FL';     // nome fixo das LUTs: a pessoa não escolhe nem edita
const N = 33;                       // tamanho padrão do .cube

// ===================== utilidades =====================
const $ = s => document.querySelector(s);
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch {} } };
const calmo = matchMedia('(prefers-reduced-motion: reduce)').matches;
const espera = ms => new Promise(r => setTimeout(r, calmo ? Math.min(ms, 60) : ms));
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 3200); }
function tela(html){ const m = $('#tela'); m.className = 'entra'; m.innerHTML = html; window.scrollTo({ top:0 }); }
function passos(at){
  const P = ['Referência e seu vídeo','Ajuste','Pronto'];
  $('#passos').innerHTML = P.map((p, i) => `<div class="${i < at ? 'ok' : i === at ? 'at' : ''}"><i>${i < at ? '✓' : i + 1}</i><span>${p}</span></div>`).join('');
}

// ===================== cor: sRGB <-> Lab =====================
const lin = c => c <= .04045 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4);
const gam = c => c <= .0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - .055;
const fL = t => t > .008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;
const fI = t => t > .206893 ? t * t * t : (t - 16 / 116) / 7.787;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const suave = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
function lab(r, g, b){   // r,g,b em 0..1
  r = lin(r); g = lin(g); b = lin(b);
  const x = (.4124564*r + .3575761*g + .1804375*b) / .95047, y = .2126729*r + .7151522*g + .072175*b, z = (.0193339*r + .119192*g + .9503041*b) / 1.08883;
  const fx = fL(x), fy = fL(y), fz = fL(z);
  return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
}
function linear(L, a, b){   // Lab -> RGB linear (pode sair da faixa 0..1)
  const fy = (L + 16) / 116, fx = fy + a / 500, fz = fy - b / 200;
  const x = fI(fx) * .95047, y = fI(fy), z = fI(fz) * 1.08883;
  return [3.2404542*x - 1.5371385*y - .4985314*z, -.969266*x + 1.8760108*y + .041556*z, .0556434*x - .2040259*y + 1.0572252*z];
}
function rgb(L, a, b){   // Lab -> sRGB. Cor que não cabe na tela perde saturação aos poucos, sem mudar de tom.
  let v = linear(L, a, b);
  const fora = v => v[0] < -.0005 || v[1] < -.0005 || v[2] < -.0005 || v[0] > 1.0005 || v[1] > 1.0005 || v[2] > 1.0005;
  if (fora(v)){
    let lo = 0, hi = 1;
    for (let i = 0; i < 7; i++){ const m = (lo + hi) / 2; if (fora(linear(L, a * m, b * m))) hi = m; else lo = m; }
    v = linear(L, a * lo, b * lo);
  }
  return [gam(clamp(v[0], 0, 1)), gam(clamp(v[1], 0, 1)), gam(clamp(v[2], 0, 1))];
}

// ===================== GRAVADO EM LOG =====================
// Converte o sinal Log da câmera para imagem normal (Rec.709) com as fórmulas oficiais publicadas pelos fabricantes:
// curva Log -> luz da cena -> cores da câmera para Rec.709 -> curva de exibição suave (sem estourar) -> tela.
// O valor que o navegador entrega é o sinal do arquivo (faixa de vídeo já esticada para 0..1).
const PERFIS = {
  normal: { nome:'Normal', curto:'Normal', dica:'Gravou no modo normal da câmera ou do celular' },
  applelog: { nome:'Apple Log (iPhone)', curto:'Apple Log', dica:'iPhone 15 Pro em diante',
    dec: v => { const R0 = -.05641088, sg = 47.28711236, Pt = sg * (.01 - R0) ** 2; return v >= Pt ? Math.pow(2, (v - .69336945) / .08550479) - .00964052 : v >= 0 ? Math.sqrt(v / sg) + R0 : R0; },
    M: [[1.660491, -.58764114, -.07284986], [-.12455047, 1.1328999, -.00834942], [-.01815076, -.1005789, 1.11872966]] },
  slog3: { nome:'Sony S-Log3 · S-Gamut3.Cine', curto:'S-Log3', dica:'Sony A7, FX3, FX30, ZV-E1…',
    dec: v => { const y = (64 + 876 * v) / 1023; return y >= 171.2102946929 / 1023 ? Math.pow(10, (y * 1023 - 420) / 261.5) * .19 - .01 : (y * 1023 - 95) * .01125 / (171.2102946929 - 95); },
    M: [[1.62694741, -.54013854, -.08680887], [-.17851553, 1.41794093, -.2394254], [-.04443611, -.19591997, 1.24035608]] },
  slog2: { nome:'Sony S-Log2 · S-Gamut', curto:'S-Log2', dica:'Sony A7 III, A6500 e anteriores',
    dec: v => (v >= .030001222851889303 ? Math.pow(10, (v - .646596) / .432699) - .037584 : (v - .030001222851889303) / 5) * .9 * 219 / 155,
    M: [[1.87791513, -.79416876, -.08374637], [-.17680698, 1.35099962, -.17419264], [-.02620113, -.14842226, 1.17462339]] },
};
let PERFIL = (() => { const p = store.get('fl_mood_perfil'); return PERFIS[p] && p !== 'normal' ? p : null; })();
const exibe = x => { x = Math.max(0, x) * .6; return clamp(x * (2.51 * x + .03) / (x * (2.43 * x + .59) + .14), 0, 1); };   // curva de exibição com roll-off (cinza 18% vai a ~41%)
function entrada(r, g, b, o){   // sinal do arquivo -> imagem normal (sRGB 0..1)
  const P = PERFIL && PERFIS[PERFIL]; if (!P){ o[0] = r; o[1] = g; o[2] = b; return o; }
  const lr = P.dec(r), lg = P.dec(g), lb = P.dec(b), M = P.M;
  let R = M[0][0]*lr + M[0][1]*lg + M[0][2]*lb, G = M[1][0]*lr + M[1][1]*lg + M[1][2]*lb, B = M[2][0]*lr + M[2][1]*lg + M[2][2]*lb;
  // cor que não cabe no Rec.709: perde saturação em direção ao cinza da mesma luz (mantém o tom, sem canal negativo)

    const i = (y * w + x) * 4, r = d[i] / 255, g = d[i+1] / 255, b = d[i+2] / 255, Y = .2126*r + .7152*g + .0722*b;
    if (tipo === 'wf'){ const X = (x * W / w) | 0, yy = Math.round((1 - Y) * (H - 1)); poe(X, yy, 0); poe(X, yy, 1); poe(X, yy, 2); }

    else { const cb = (b - Y) / 1.8556, cr = (r - Y) / 1.5748, X = Math.round((cb * 2 + .5) * (W - 1)), YY = Math.round((.5 - cr * 2) * (H - 1)); poe(X, YY, 0); poe(X, YY, 1); poe(X, YY, 2); }
  }

  alvo.width = W; alvo.height = H; const g = alvo.getContext('2d'), im = g.createImageData(W, H);

    for (let k = 0; k < 3; k++){ const v = Math.min(1, 1.6 * Math.log1p(acc[p*3+k]) / lm);
      let c = v; if (tipo === 'wf') c = v * (k === 1 ? 1 : .62); if (tipo === 'vec'){ const X = p % W, YY = (p / W) | 0, cbv = (X / (W - 1) - .5) / 2, crv = (.5 - YY / (H - 1)) / 2, rr = .5 + 1.5748 * crv, bb = .5 + 1.8556 * cbv, gg = (.5 - .2126 * rr - .0722 * bb) / .7152; c = v * (clamp([rr, gg, bb][k], 0, 1) * .6 + .4); }
      im.data[p*4+k] = c * 255; }
    im.data[p*4+3] = 255;
  }
  g.putImageData(im, 0, 0); g.strokeStyle = 'rgba(255,255,255,.16)'; g.lineWidth = 1; g.fillStyle = 'rgba(255,255,255,.4)'; g.font = '10px monospace';
  if (tipo === 'vec'){ g.beginPath(); g.arc(W/2, H/2, W * .45, 0, 7); g.stroke(); g.beginPath(); g.moveTo(W/2, 0); g.lineTo(W/2, H); g.moveTo(0, H/2); g.lineTo(W, H/2); g.stroke();
    const a = 123 * Math.PI / 180; g.strokeStyle = 'rgba(230,170,120,.7)'; g.beginPath(); g.moveTo(W/2, H/2); g.lineTo(W/2 + Math.cos(a) * W * .48, H/2 - Math.sin(a) * H * .48); g.stroke(); g.fillText('pele', W/2 + Math.cos(a) * W * .4 - 30, H/2 - Math.sin(a) * H * .4); }
  else for (const v of [0, 25, 50, 75, 100]){ const y = Math.round((1 - v / 100) * (H - 1)) + .5; g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); g.fillText(String(v), 3, Math.max(10, y - 2)); }
}

    <div class="pl" id="pl">
      <video id="pv-aula" preload="auto" muted playsinline webkit-playsinline disablepictureinpicture poster="${AULA_CAPA}" src="${AULA_URL}"></video>
      <div class="giro"></div><span class="lento-t">Conexão lenta · carregando</span><div class="flash" id="pflash"></div>
      <button class="somon" id="psomon" type="button" aria-label="Ativar o som e assistir a aula do começo"><span class="ao-vivo"><i></i>Seu vídeo já começou</span><span class="pilula">${IC_AULA.mudo}Toque para ativar o som</span></button>
      <div class="mudo-barra" aria-hidden="true"></div>
      <button class="capa" id="pcapa" type="button" aria-label="Assistir a aula"><span class="play">${IC_AULA.play}</span><span class="rot"><small>Aula do Mood</small>Como ter o melhor resultado</span></button>
      <div class="falha" id="pfalha" role="alert"><p><strong>Não deu para carregar a aula.</strong><span id="pfalha-t">A conexão falhou. Confira a internet e tente de novo.</span></p><button type="button" id="prenova">Tentar de novo</button></div>
      <div class="ctl">
        <div class="barra" id="pbarra" role="slider" aria-label="Posição do vídeo" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0"><div class="trilho"><div class="buf"></div><div class="feito"></div><div class="bolinha"></div></div><span class="dica" id="pdica">0:00</span></div>
        <div class="lin">
          <button class="bt" id="ptoca" type="button" aria-label="Tocar">${IC_AULA.play}</button>
          <div class="vol"><button class="bt" id="psom" type="button" aria-label="Tirar o som">${IC_AULA.som}</button><input id="pvol" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume"></div>
          <div class="tempo" id="ptempo">0:00 <span>/ 0:00</span></div>
          <div class="vel" role="group" aria-label="Velocidade">${[1, 1.25, 1.5, 2].map(v => `<button type="button" data-v="${v}" aria-pressed="${v === VEL_INICIAL}">${String(v).replace('.', ',')}x</button>`).join('')}</div>
          <button class="bt vel1" id="pvel1" type="button" aria-label="Velocidade: 1,5x">1,5x</button>
          <button class="bt" id="ptela" type="button" aria-label="Tela cheia">${IC_AULA.tela}</button>
        </div>
      </div>
    </div>
    <div class="acoes aula">
      <button class="btn" id="ja-vi" type="button" hidden>Já assisti, quero testar</button>
    </div>
  </div>`);
  montaPlayer();
  const sai = (como) => {
    const v = $('#pv-aula');
    evAula('aula_teste_saiu', { como, assistiu_s: Math.round(v ? v.currentTime : 0), pct: v && v.duration ? Math.round(v.currentTime / v.duration * 100) : 0 });
    if (v){ try { v.pause(); } catch {} }
    if (paraPlayer){ paraPlayer(); paraPlayer = null; }
    store.set(AULA_VISTA, '1');
    passo1();
  };
  $('#ja-vi').onclick = () => sai('ja_assisti');
  evAula('aula_teste_mostrou');
}

// Player da aula (Smart Autoplay): começa mudo e em movimento; o primeiro toque liga o som e volta a aula para 0:00.
// Estados na classe do .pl: auto-tenta (tentando o autoplay) · carrega (esperando dados) · mudo-auto (prévia muda)
// · iniciou (a pessoa já está assistindo) · toca · quieto (controles escondidos) · erro (não carregou).
function montaPlayer(){
  const pl = $('#pl'), v = $('#pv-aula'), barra = $('#pbarra'), dica = $('#pdica');
  const bToca = $('#ptoca'), bSom = $('#psom'), vol = $('#pvol'), tempo = $('#ptempo'), bTela = $('#ptela'), flash = $('#pflash'), bVel1 = $('#pvel1');
  const toque = matchMedia('(pointer:coarse)').matches;
  const celular = toque || /iPhone|iPad|Android/i.test(navigator.userAgent);
  let arrastando = false, timer = 0, marcos = {}, inicio = false, tentativas = 0, vigia = 0, lento = 0, ultT = 0, comSom = false;

  const marca = () => { const p = v.duration ? v.currentTime / v.duration : 0;
    [25, 50, 75, 95].forEach(m => { if (!marcos[m] && p * 100 >= m){ marcos[m] = 1; evAula('aula_teste_progresso', { pct: m }); } }); };
  const pinta = () => {
    const p = v.duration ? v.currentTime / v.duration : 0;
    pl.style.setProperty('--p', p);
    barra.setAttribute('aria-valuenow', Math.round(p * 100));
    tempo.innerHTML = mmss(v.currentTime) + ' <span>/ ' + mmss(v.duration) + '</span>';
    try { const b = v.buffered; if (b.length && v.duration) pl.style.setProperty('--b', b.end(b.length - 1) / v.duration); } catch {}
  };
  const estado = () => { const t = !v.paused; bToca.innerHTML = t ? IC_AULA.pausa : IC_AULA.play; bToca.setAttribute('aria-label', t ? 'Pausar' : 'Tocar'); pl.classList.toggle('toca', t); if (!t) pl.classList.remove('quieto'); };
  const somIcone = () => { const m = v.muted || v.volume === 0; bSom.innerHTML = m ? IC_AULA.mudo : IC_AULA.som; bSom.setAttribute('aria-label', m ? 'Ligar o som' : 'Tirar o som'); vol.value = m ? 0 : v.volume; };
  const pisca = ic => { flash.innerHTML = ic; flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on'); };
  const acorda = () => { pl.classList.remove('quieto'); clearTimeout(timer); timer = setTimeout(() => { if (!v.paused && !arrastando) pl.classList.add('quieto'); }, toque ? 3200 : 2600); };
  const carregando = on => {
    pl.classList.toggle('carrega', on); clearTimeout(lento); pl.classList.remove('lento');
    if (on) lento = setTimeout(() => pl.classList.add('lento'), 6000);
  };
  // play() devolve promessa: rejeição de autoplay vira capa com play manual, nunca player "travado"
  const tocar = () => { const p = v.play(); if (p && p.catch) p.catch(e => { if (e && e.name === 'NotAllowedError'){ inicio = false; pl.classList.remove('iniciou', 'mudo-auto', 'auto-tenta'); carregando(false); } }); };
  const alterna = () => { if (v.paused){ tocar(); pisca(IC_AULA.play); } else { v.pause(); pisca(IC_AULA.pausa); } };

  // toque da pessoa: pode tocar com som
  const comeca = () => {
    if (pl.classList.contains('erro')) return;
    if (pl.classList.contains('mudo-auto')) return ligaSom();
    if (!inicio){ inicio = true; pl.classList.add('iniciou'); evAula('aula_teste_play'); }
    pl.classList.remove('auto-tenta');
    if (previa && !comSom){ try { v.currentTime = 0; } catch {} previa = false; }
    v.muted = false; if (v.volume === 0) v.volume = 1; somIcone(); comSom = true;
    if (v.readyState < 3) carregando(true);
    tocar(); acorda();
  };
  // o navegador só deixa começar sozinho SEM som: a aula já começa tocando muda, e o primeiro toque liga o som do começo
  function ligaSom(){
    pl.classList.remove('mudo-auto'); comSom = true; previa = false;
    v.muted = false; if (v.volume === 0) v.volume = 1;
    try { v.currentTime = 0; } catch {}
    tocar(); somIcone(); evAula('aula_teste_som'); acorda();
  }
  $('#psomon').onclick = e => { e.stopPropagation(); ligaSom(); };

  // a prévia muda começa no gancho (3:53, já ensinando na prática); com som, a aula sempre começa do 0:00
  const GANCHO = 233;
  let previa = false;
  const vaiProGancho = () => { if (inicio && !pl.classList.contains('mudo-auto')) return; try { v.currentTime = GANCHO; previa = true; } catch {} };
  const mudoAuto = () => { v.muted = true; v.defaultMuted = true;
    if (v.readyState >= 1) vaiProGancho(); else v.addEventListener('loadedmetadata', vaiProGancho, { once: true });
    return v.play().then(() => {
    if (inicio || pl.classList.contains('erro')) return;   // a pessoa tocou antes (vale o toque dela) ou o player está em falha
    inicio = true; pl.classList.remove('auto-tenta'); pl.classList.add('iniciou', 'mudo-auto'); somIcone();
    evAula('aula_teste_autoplay', { som: false });
  }); };
  const bloqueado = () => { if (inicio) return; pl.classList.remove('auto-tenta'); carregando(false); v.muted = false; };
  const autoplay = () => {
    pl.classList.add('auto-tenta'); carregando(true);
    // rede lenta: depois de 6 s sem começar, mostra também o play manual (o autoplay continua tentando por baixo)
    setTimeout(() => { if (!inicio) pl.classList.remove('auto-tenta'); }, 6000);
    const deNovo = e => {
      if (v.error) return;
      if (e && e.name === 'NotAllowedError') return bloqueado();
      v.addEventListener('canplay', () => { if (!inicio && !pl.classList.contains('erro')) mudoAuto().catch(bloqueado); }, { once: true });
    };
    // no celular o navegador nunca deixa começar com som: já começa mudo
    if (celular){ mudoAuto().catch(deNovo); return; }
    v.muted = false;
    v.play().then(() => { if (inicio) return; inicio = true; pl.classList.remove('auto-tenta'); pl.classList.add('iniciou'); evAula('aula_teste_autoplay', { som: true }); acorda(); })
      .catch(e => { if (v.error) return; mudoAuto().catch(deNovo); });
  };

  // o botão de seguir para o teste aparece sozinho depois de ~10 s de aula com som (30 s sem som; ou na hora, se o vídeo não carregar)
  let ouvido = 0, ult = 0;
  const libera = () => { const b = $('#ja-vi'); if (b && b.hidden){ b.hidden = false; b.classList.add('surge'); } };
  v.addEventListener('timeupdate', () => { const t = v.currentTime; if (!v.paused && t > ult && t - ult < 1.5) ouvido += (t - ult) / (v.playbackRate || 1) * (v.muted ? 1 / 3 : 1); ult = t; if (t > 0) ultT = t; if (ouvido >= 10) libera(); });
  v.addEventListener('seeking', () => { ult = v.currentTime; });

  // falhas: tenta recarregar sozinho (rede), depois mostra um estado claro com "Tentar de novo" e libera o teste
  const recarrega = () => {
    const t = ultT;
    carregando(true); v.load();
    v.addEventListener('loadedmetadata', () => { if (t) try { v.currentTime = t; } catch {} }, { once: true });
    if (inicio) tocar(); else autoplay();
  };
  const falha = c => {
    clearTimeout(vigia); carregando(false);
    pl.classList.remove('auto-tenta', 'mudo-auto', 'quieto'); pl.classList.add('erro');
    const naoAbre = c === 4 && !v.canPlayType('video/mp4; codecs="avc1.640028, mp4a.40.2"');   // sem H.264/AAC (ex.: Chromium/Firefox sem codecs)
    $('#pfalha-t').textContent = naoAbre ? 'Este navegador não abre o vídeo da aula. Tente abrir o link no Chrome ou no Safari.' : 'A conexão falhou. Confira a internet e tente de novo.';
    $('#prenova').hidden = naoAbre;
    libera(); evAula('aula_teste_erro', { codigo: c });
  };
  v.addEventListener('error', () => {
    const c = v.error ? v.error.code : 0;
    if ((c === 2 || c === 3) && tentativas < 2){ tentativas++; recarrega(); return; }
    falha(c);
  });
  $('#prenova').onclick = () => {
    pl.classList.remove('erro', 'mudo-auto', 'auto-tenta'); tentativas = 0;
    if (!inicio){ inicio = true; pl.classList.add('iniciou'); }
    v.muted = false; if (v.volume === 0) v.volume = 1; somIcone(); carregando(true);
    const t = comSom ? ultT : 0; comSom = true; v.load();   // quem só viu a prévia muda recomeça do 0:00
    v.addEventListener('loadedmetadata', () => { if (t) try { v.currentTime = t; } catch {} }, { once: true });
    tocar(); acorda();   // dentro do toque: o navegador aceita tocar com som
  };
  // travou esperando dados por muito tempo: recarrega uma vez no mesmo ponto
  const vigiar = () => { clearTimeout(vigia); vigia = setTimeout(() => { if (!v.paused && v.readyState < 3 && !v.error && tentativas < 2){ tentativas++; recarrega(); } }, 15000); };

  $('#pcapa').onclick = comeca;
  v.addEventListener('click', () => {
    if (!inicio || pl.classList.contains('mudo-auto')) return comeca();
    if (toque && pl.classList.contains('quieto')) return acorda();   // no dedo: 1º toque mostra os controles
    alterna(); acorda();
  });
  if (!toque) v.addEventListener('dblclick', () => telaCheia());
  bToca.onclick = () => { if (!inicio) return comeca(); alterna(); acorda(); };
  ['play', 'pause', 'ended'].forEach(e => v.addEventListener(e, estado));
  v.addEventListener('ended', () => { evAula('aula_teste_terminou'); const b = $('#ja-vi'); if (b){ libera(); b.focus(); } });
  v.addEventListener('timeupdate', () => { if (!arrastando) pinta(); marca(); });
  ['loadedmetadata', 'progress', 'durationchange'].forEach(e => v.addEventListener(e, pinta));
  v.addEventListener('waiting', () => { carregando(true); vigiar(); });
  v.addEventListener('stalled', () => { if (!v.paused && v.readyState < 3) vigiar(); });
  // só tira o "carregando" quando a reprodução começou de verdade (ou a pessoa pausou)
  ['playing', 'pause'].forEach(e => v.addEventListener(e, () => { clearTimeout(vigia); carregando(false); }));
  v.addEventListener('playing', () => { tentativas = 0; });

  // barra de progresso: clicar, arrastar (mouse e dedo) e teclado
  const posicao = x => { const r = barra.getBoundingClientRect(); return Math.min(1, Math.max(0, (x - r.left) / r.width)); };
  const mostraDica = x => { const p = posicao(x), r = barra.getBoundingClientRect(); dica.style.left = (p * r.width) + 'px'; dica.textContent = mmss(p * (v.duration || 0)); return p; };
  barra.addEventListener('pointermove', e => { if (!arrastando && e.pointerType === 'mouse') mostraDica(e.clientX); });
  barra.addEventListener('pointerdown', e => {
    if (!v.duration) return; arrastando = true; barra.classList.add('arrasta'); try { barra.setPointerCapture(e.pointerId); } catch {}
    const p = mostraDica(e.clientX); pl.style.setProperty('--p', p); acorda();
  });
  barra.addEventListener('pointermove', e => { if (!arrastando) return; const p = mostraDica(e.clientX); pl.style.setProperty('--p', p); acorda(); });
  const solta = e => { if (!arrastando) return; arrastando = false; barra.classList.remove('arrasta'); v.currentTime = posicao(e.clientX) * v.duration; if (!inicio) comeca(); pinta(); acorda(); };
  barra.addEventListener('pointerup', solta); barra.addEventListener('pointercancel', solta);
  barra.addEventListener('keydown', e => { if (e.key === 'ArrowRight'){ v.currentTime = Math.min(v.duration || 0, v.currentTime + 5); e.preventDefault(); } if (e.key === 'ArrowLeft'){ v.currentTime = Math.max(0, v.currentTime - 5); e.preventDefault(); } });

  // som
  bSom.onclick = () => { if (v.muted || v.volume === 0){ v.muted = false; if (v.volume === 0) v.volume = 1; } else v.muted = true; somIcone(); acorda(); };
  vol.oninput = () => { v.volume = Number(vol.value); v.muted = v.volume === 0; somIcone(); };
  v.addEventListener('volumechange', somIcone);

  // velocidade (desktop: grupo; celular: um botão que alterna)
  const VELS = [1, 1.25, 1.5, 2];
  const velocidade = n => {
    v.defaultPlaybackRate = v.playbackRate = n;   // default: o load()/retry não volta para 1x
    pl.querySelectorAll('.vel button').forEach(x => x.setAttribute('aria-pressed', Number(x.dataset.v) === n));
    bVel1.textContent = String(n).replace('.', ',') + 'x'; bVel1.setAttribute('aria-label', 'Velocidade: ' + bVel1.textContent);
    evAula('aula_teste_velocidade', { v: n });
  };
  pl.querySelectorAll('.vel button').forEach(b => b.onclick = () => velocidade(Number(b.dataset.v)));
  bVel1.onclick = () => { velocidade(VELS[(VELS.indexOf(v.playbackRate) + 1) % VELS.length] || 1); acorda(); };

  // tela cheia: Android e desktop usam o player inteiro; iPhone usa a tela cheia do próprio vídeo
  function telaCheia(){
    const d = document;
    if (d.fullscreenElement || d.webkitFullscreenElement){ (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
    const nativo = () => { if (v.webkitEnterFullscreen) try { v.webkitEnterFullscreen(); } catch {} };
    if (d.fullscreenEnabled && pl.requestFullscreen){
      pl.requestFullscreen({ navigationUI: 'hide' }).then(() => { try { if (toque && screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch {} }).catch(nativo);
    } else if (d.webkitFullscreenEnabled && pl.webkitRequestFullscreen) pl.webkitRequestFullscreen();
    else nativo();
  }
  bTela.onclick = telaCheia;
  const mudouTela = () => { const f = !!(document.fullscreenElement || document.webkitFullscreenElement); bTela.innerHTML = f ? IC_AULA.sai : IC_AULA.tela; bTela.setAttribute('aria-label', f ? 'Sair da tela cheia' : 'Tela cheia'); if (!f){ try { screen.orientation && screen.orientation.unlock && screen.orientation.unlock(); } catch {} } acorda(); };
  document.addEventListener('fullscreenchange', mudouTela); document.addEventListener('webkitfullscreenchange', mudouTela);

  // controles somem quando o vídeo está tocando e o mouse para
  pl.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') acorda(); });
  pl.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !v.paused) pl.classList.add('quieto'); });

  // volta para a aba / reabre a página (cache de voltar): a prévia muda continua rodando
  const voltou = () => { if (document.visibilityState === 'visible' && pl.classList.contains('mudo-auto') && v.paused && !v.ended) v.play().catch(() => {}); };
  const reabriu = e => { if (e.persisted) voltou(); };
  document.addEventListener('visibilitychange', voltou); window.addEventListener('pageshow', reabriu);

  // atalhos: espaço/K tocar, ←/→ 5 s, M som, F tela cheia
  const teclas = e => {
    if (!document.body.contains(pl) || /input|textarea|select/i.test(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.closest && e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
    const k = e.key.toLowerCase();
    if (k === ' ' || k === 'k'){ e.preventDefault(); if (!inicio || pl.classList.contains('mudo-auto')) comeca(); else alterna(); acorda(); }
    else if (k === 'arrowright' && e.target !== barra){ v.currentTime = Math.min(v.duration || 0, v.currentTime + 5); acorda(); }
    else if (k === 'arrowleft' && e.target !== barra){ v.currentTime = Math.max(0, v.currentTime - 5); acorda(); }
    else if (k === 'm'){ if (pl.classList.contains('mudo-auto')) ligaSom(); else bSom.click(); acorda(); }
    else if (k === 'f'){ telaCheia(); }
  };
  document.addEventListener('keydown', teclas);
  paraPlayer = () => {
    document.removeEventListener('keydown', teclas); document.removeEventListener('fullscreenchange', mudouTela); document.removeEventListener('webkitfullscreenchange', mudouTela);
    document.removeEventListener('visibilitychange', voltou); window.removeEventListener('pageshow', reabriu);
    clearTimeout(timer); clearTimeout(vigia); clearTimeout(lento);
  };
  somIcone(); pinta();
  v.defaultPlaybackRate = v.playbackRate = VEL_INICIAL;   // a aula já começa em 1,5x; a pessoa pode mudar
  // a prévia muda roda mesmo com "reduzir movimento": a pessoa pediu a aula, e o toque já pausa/liga o som
  autoplay();
}

// ===================== início =====================
// a aula aparece SEMPRE antes do teste para quem ainda não comprou; quem já tem o Mood vai direto para a ferramenta
// veio por um botão de teste (página de vendas ou dos alunos)? mostra a aula mesmo para quem está logado

// ===================== MODO ALUNO · "Prova de cor" =====================
// Só roda para quem chegou como aluno (ehAluno). O modo normal da ferramenta não muda.
const AL_SETA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l-6 6 6 6M15 6l6 6-6 6"/></svg>';
const AL_OK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';
function evAluno(nome, dados){ try { Base.evento(ehAluno ? nome : nome.replace(/^aluno_/, 'mood_'), PACK, dados); } catch {} }
// jornada "Prova de cor": alunos (preço de aluno) e público que ainda não tem o Mood (preço normal)
const PROVA = ehAluno || !acesso;
if (PROVA) document.body.classList.add('modo-aluno');
// SÓ NA PÁGINA DE TESTE: com ?recepcao=1 a prévia finge que a conta ainda não tem o Mood,
// para quem já comprou (o Fernando) ver a jornada inteira, com fita e credencial.
const PREVIA = false && /[?&]recepcao=1/.test(location.search);
if (PREVIA){ acesso = false; vencido = false; }

// fita de aluno + folha "Sua condição"
function atualizaFita(){
  const f = $('#alFita'); if (!f) return;
  f.hidden = !(PROVA && !acesso);
  const pr = (Base.produto('mood') || {}).preco || 147;
  if (ehAluno){ f.innerHTML = `<span class="al-cel">Por tempo limitado · <b>R$ ${ALUNO.preco}</b></span><span class="al-desk">Condição especial por tempo limitado: <b>R$ ${ALUNO.preco}</b> ou 12x de R$ ${ALUNO.parc}</span><span class="al-ver" aria-hidden="true">Ver ›</span>`; return; }
  f.innerHTML = `<span class="al-cel">Oferta de lançamento · <b>R$ ${pr}</b></span><span class="al-desk">Mood · Oferta de lançamento: <b>R$ ${pr}</b> ou 12x de R$ 15,11</span><span class="al-ver" aria-hidden="true">Ver ›</span>`;
}
let alFoco = null;
function abreCondicao(){
  const s = $('#alSheet'), c = s.querySelector('.al-sheet-c');
  const pr = (Base.produto('mood') || {}).preco || 147;
  if (ehAluno) c.innerHTML = `<span class="al-rot">Condição especial por tempo limitado</span><h2 id="alSheetT">Mood por R$ ${ALUNO.preco}, ou 12x de R$ ${ALUNO.parc}.</h2>
    <p>1 ano de acesso, com LUTs ilimitadas, e 7 dias de garantia. Depois dessa condição, o Mood volta a custar R$ ${ALUNO.normal}. Primeiro você faz a prova com o seu vídeo; o preço aparece de novo quando a sua LUT estiver pronta.</p>
    <button class="btn" type="button" data-fecha>Continuar minha prova</button>`;
  else c.innerHTML = `<span class="al-rot">Oferta de lançamento</span><h2 id="alSheetT">Mood por R$ ${pr}, ou 12x de R$ 15,11.</h2>
    <p>1 ano de acesso, com LUTs ilimitadas, e 7 dias de garantia. Primeiro você faz a prova com o seu vídeo; o preço aparece de novo quando a sua LUT estiver pronta.</p>
    <button class="btn" type="button" data-fecha>Continuar minha prova</button>`;
  alFoco = document.activeElement; s.hidden = false; c.querySelector('.btn').focus();
  evAluno('aluno_condicao_aberta');
}

// demo da recepção: vídeo do Fernando gravado em Log e as 4 LUTs que o Mood fez a partir de cada referência
const AL_DEMO = '/lut/demo/';
const AL_LOOKS = [
  { k:'natural', nome:'Natural' }, { k:'dourado', nome:'Dourado' }, { k:'urbano', nome:'Urbano' }, { k:'pastel', nome:'Pastel' }
];
function varreAlca(cmp, inp, curta){
  if (calmo){ cmp.style.setProperty('--p', '50%'); inp.value = 50; return; }
  const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2, t0 = performance.now() + (curta ? 0 : 350);
  if (curta){ // ao trocar de cor: a nova cor entra pela direita até o meio
    const passo = agora => { if (!cmp.isConnected) return; const t = Math.min(1, (agora - t0) / 520), p = 92 - 42 * ease(t); cmp.style.setProperty('--p', p + '%'); inp.value = Math.round(p); if (t < 1) requestAnimationFrame(passo); };
    requestAnimationFrame(passo); return;
  }
  let parou = false; const para = () => { parou = true; }; inp.addEventListener('pointerdown', para, { once:true }); inp.addEventListener('keydown', para, { once:true });
  const passo = agora => {
    if (parou || !cmp.isConnected) return;
    const t = agora - t0; let p;
    if (t < 0) p = 15; else if (t < 1300) p = 15 + 70 * ease(t / 1300); else if (t < 2400) p = 85 - 35 * ease((t - 1300) / 1100); else p = 50;
    cmp.style.setProperty('--p', p + '%'); inp.value = Math.round(p);
    if (t < 2400) requestAnimationFrame(passo);
  };
  requestAnimationFrame(passo);
}

    if (!html){ if (velho) velho.remove(); rever.style.display = ""; return; }
    let c = velho;
    if (!c){ c = document.createElement('div'); c.id = 'aulaCard'; c.className = 'ajuda'; rever.after(c);
      c.addEventListener('click', e => { if (e.target.closest('[data-ac]')){ evAula('aulas_card_clicou'); Aulas.abre(['fl-lut'], OP); } }); }
    if (c.dataset.h !== html){ c.innerHTML = html; c.dataset.h = html; }
    rever.style.display = "none";
  }
  Aulas.carrega().then(poe);
  const b = $('#aula'); if (b) new MutationObserver(poe).observe(b, { attributes:true, attributeFilter:['data-aula','hidden'] });
  const t = $('#tela'); if (t) new MutationObserver(() => { if ($('#rever') && !$('#aulaCard')) poe(); }).observe(t, { childList:true });
})();
</script>
