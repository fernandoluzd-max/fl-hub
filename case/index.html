<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CaseUp — seu portfólio de editor | Base FL</title>
<meta name="description" content="CaseUp: monte uma página com os seus vídeos, mande o link para o cliente e receba pedidos de orçamento.">
<meta name="theme-color" content="#0D0F0E">
<meta property="og:title" content="CaseUp — Base FL">
<meta property="og:description" content="Mostre seus vídeos e receba pedidos de orçamento.">
<meta property="og:image" content="https://basefl.com/capas/caseup.jpg">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0D0F0E;--panel:#151816;--panel2:#1B1F1C;--line:#272D29;--ink:#F4F0E4;--mute:#9A968A;--dim:#5f5c55;--accent:#D4E157;--accent-ink:#171A06;--err:#ff8f7a;
  --f:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--ink);font:16px/1.5 var(--f);min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(700px 420px at 85% -8%,rgba(212,225,87,.09),transparent 70%)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
.wrap{position:relative;max-width:560px;margin:0 auto;padding:16px 18px 60px}
header{display:flex;align-items:center;gap:10px;margin-bottom:22px}
header img{width:38px;height:38px;border-radius:11px;box-shadow:0 0 0 1px rgba(255,255,255,.10);flex:none}
header .nm{font-weight:800;font-stretch:112%;font-size:15px;letter-spacing:-.01em;line-height:1.1}
header .nm small{display:block;font-weight:500;font-stretch:100%;color:var(--mute);font-size:12px}
header .sp{flex:1}
.link{background:none;border:0;color:var(--mute);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
h1{font-weight:850;font-stretch:118%;font-size:clamp(27px,7.6vw,34px);line-height:1.04;letter-spacing:-.025em;margin-bottom:8px;text-wrap:balance}
.sub{color:var(--mute);font-size:15px;margin-bottom:22px;max-width:46ch}
h2{font-size:16px;font-weight:750;margin:26px 0 4px}
.dica{color:var(--mute);font-size:13.5px;margin-bottom:10px}
label{display:block;font-size:13px;font-weight:700;color:var(--mute);margin:16px 0 6px}
.inp{width:100%;min-height:50px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:0 14px;font-size:16px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--accent)}
.inp.ruim{border-color:var(--err)}
.lk{display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding-left:14px;transition:border-color .2s}
.lk:focus-within{border-color:var(--accent)}.lk.ruim{border-color:var(--err)}
.lk span{color:var(--mute);font-size:15px;white-space:nowrap}
.lk input{flex:1;min-width:0;min-height:50px;background:none;border:0;outline:none;font-size:16px;font-weight:700;padding:0 12px 0 0}
.msg{font-size:13px;margin-top:6px;min-height:18px;color:var(--mute)}.msg.ok{color:var(--accent)}.msg.ruim{color:var(--err)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:15px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:16.5px;cursor:pointer;margin-top:22px;text-decoration:none;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.985)}.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:10px}
.row{display:flex;gap:10px}.row .btn{margin-top:10px}
/* vídeos */
.add{display:flex;gap:8px}
.add .inp{flex:1;min-width:0}
.add button{flex:none;min-width:54px;border:0;border-radius:13px;background:var(--panel2);border:1px solid var(--line);font-weight:800;font-size:22px;cursor:pointer}
.vl{list-style:none;display:grid;gap:8px;margin-top:10px}
.vl li{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 8px}
.th{width:44px;height:62px;border-radius:8px;background:linear-gradient(160deg,rgba(212,225,87,.28),#101210) center/cover;display:grid;place-items:center;font-size:9px;font-weight:800;letter-spacing:.04em;color:rgba(255,255,255,.8);text-transform:uppercase;overflow:hidden;text-align:center}
.vm{min-width:0;display:grid;gap:6px}
.vm input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:14.5px;outline:none}
.vm input:focus{border-color:var(--accent)}
.vm select{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:13.5px;max-width:100%}
.vm small{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.va{display:grid;gap:4px}
.va button{width:34px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:14px;cursor:pointer;color:var(--mute)}
.va button:disabled{opacity:.3}
.va .x{color:var(--err)}
.vazio{border:1px dashed #3a403c;border-radius:14px;padding:18px;text-align:center;color:var(--mute);font-size:14.5px;margin-top:10px}
/* cor, selos, opções */
.cores{display:flex;gap:10px;flex-wrap:wrap}
.cores button{width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;background:var(--c)}
.cores button[aria-pressed=true]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.tog{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;cursor:pointer}
.tog input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin-top:1px}
.tog b{display:block;font-size:15px}.tog small{display:block;color:var(--mute);font-size:13.5px}
/* link pronto */
.pronto{border:1px solid rgba(212,225,87,.45);background:linear-gradient(180deg,rgba(212,225,87,.08),transparent),var(--panel);border-radius:18px;padding:18px;margin-bottom:8px}
.pronto small{display:block;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.pronto code{display:block;font:700 17px/1.3 var(--f);margin:6px 0 2px;overflow-wrap:anywhere}
.pronto p{color:var(--mute);font-size:13.5px}
/* vitrine */
.lock{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:18px;margin-top:18px}
.lock ul{list-style:none;display:grid;gap:8px;margin-bottom:6px}
.lock li{position:relative;padding-left:24px;font-size:15px}.lock li::before{content:"✓";position:absolute;left:0;color:var(--accent);font-weight:900}
.demo{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#0B0C0C;margin-top:6px}
.demo iframe{display:block;width:100%;height:560px;border:0}
.foot{color:var(--dim);font-size:12.5px;text-align:center;margin-top:28px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:#141414;font-weight:700;font-size:14.5px;padding:11px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:all .25s;z-index:60;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.entra{animation:entra .3s ease both}@keyframes entra{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.entra{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header id="topo"></header>
  <main id="tela"><p class="sub">Carregando…</p></main>
  <p class="foot" id="foot"></p>
</div>
<div class="toast" id="toast"></div>

<script src="/catalogo.js"></script>
<script src="/base.js"></script>
<script src="/case/video.js"></script>
<script>
/* CaseUp — tela do EDITOR. O cliente vê o portfólio em /e/ (página pública, sem nada interno). */
const PACK = 'fl-case';
const CORES = { lima:'#D4E157', agua:'#3FD0C2', ambar:'#F2A541', roxo:'#A98BFF', rosa:'#FF6FAE', azul:'#5AB8FF' };
const MAX = 24;
const $ = s => document.querySelector(s), esc = Base.esc;
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2600); }
function tela(html){ const m = $('#tela'); m.className = 'entra'; m.innerHTML = html; }
async function copia(t){ try { await navigator.clipboard.writeText(t); } catch { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); } }
const semAcento = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '');
const paraSlug = s => semAcento(String(s || '').toLowerCase()).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 30);
const slugOk = s => /^[a-z0-9](?:[a-z0-9-]{1,28})[a-z0-9]$/.test(s);
const link = s => location.origin + '/e/?' + s;

let P = null, EXTRA = {}, sujo = false;     // P: o portfólio em edição
const prod = () => Base.produto('case') || { nome:'CaseUp', preco:'' };
const acesso = () => Base.tem(PACK);

function topo(){
  const s = Base.sessao();
  $('#topo').innerHTML = `<img src="/icones/case.png" alt=""><span class="nm">CaseUp<small>Base FL</small></span><span class="sp"></span>
    ${s ? '<button class="link" id="conta">Sair</button>' : '<button class="link" id="conta">Entrar</button>'}`;
  $('#conta').onclick = async () => { if (Base.sessao()) { sujo = false; Base.sair(); inicio(); } else if (await Base.login()) inicio(); };
  $('#foot').textContent = 'O cliente não precisa de conta nem de app. Só abre o link.';
}

// ---------- quem ainda não tem: mostra o que é, com um portfólio de exemplo de verdade ----------
function vitrine(){
  const venc = Base.vencido(PACK), p = prod();
  tela(`<h1>Seu portfólio num link.</h1>
    <p class="sub">Junte os seus melhores vídeos numa página, mande o link para o cliente e receba o pedido de orçamento por ela.</p>
    <div class="demo"><iframe src="/e/?exemplo" title="Portfólio de exemplo" loading="lazy"></iframe></div>
    <div class="lock"><ul><li>Seu link, com o seu nome</li><li>Vídeos do Instagram, TikTok, YouTube, Vimeo e Drive</li><li>Botão de orçamento que abre o seu briefing ou o seu WhatsApp</li></ul>
      <button class="btn" id="comprar">${venc ? 'Renovar meu acesso' : 'Criar o meu portfólio' + (p.preco ? ' · R$ ' + p.preco : '')}</button>
      ${Base.sessao() ? '' : '<button class="link" id="entrar" style="display:block;margin:14px auto 0">Já comprei · entrar</button>'}</div>`);
  $('#comprar').onclick = () => Base.comprar('case', 'ferramenta');
  if ($('#entrar')) $('#entrar').onclick = async () => { if (await Base.login()) inicio(); };
}

// ---------- editor ----------
function novo(){
  const nome = EXTRA.perfil_nome || '';
  return { slug: paraSlug(nome), nome, frase:'', whatsapp: EXTRA.perfil_whatsapp || '', cor:'lima', selos:[], videos:[], briefing:true, publicado:true, visitas:0, _novo:true };
}
function editor(){
  const p = P, publicado = !p._novo;
  tela(`${publicado ? `<div class="pronto"><small>${p.publicado ? 'Seu portfólio está no ar' : 'Seu portfólio está fora do ar'}</small><code id="lkTxt">${esc(link(p.slug).replace(/^https?:\/\//, ''))}</code>
        <p>${p.visitas ? p.visitas + (p.visitas === 1 ? ' abertura' : ' aberturas') + ' até agora.' : 'Mande para um cliente ou coloque na bio.'}</p>
        <div class="row"><button class="btn" id="copiar">Copiar link</button><a class="btn ghost" id="abrir" href="${esc(link(p.slug))}" target="_blank" rel="noopener">Ver a página</a></div></div>`
      : `<h1>Monte o seu portfólio.</h1><p class="sub">Leva uns 3 minutos. Você pode mudar tudo depois.</p>`}

    <label for="nome">Seu nome ou o nome do seu estúdio</label><input class="inp" id="nome" maxlength="60" value="${esc(p.nome)}" placeholder="Ex.: João Editor" autocomplete="name">
    <label for="frase">O que você faz, em uma frase</label><input class="inp" id="frase" maxlength="120" value="${esc(p.frase || '')}" placeholder="Ex.: Edito Reels e anúncios para negócios locais">

    <label for="slug">O final do seu link</label>
    <div class="lk" id="lkBox"><span>${esc(location.host)}/e/?</span><input id="slug" maxlength="30" value="${esc(p.slug)}" autocapitalize="none" autocomplete="off" spellcheck="false" placeholder="seu-nome"></div>
    <p class="msg" id="slugMsg"></p>

    <h2>Seus vídeos</h2>
    <p class="dica">Cole o link de cada vídeo: Instagram, TikTok, YouTube, Vimeo ou Google Drive. Até ${MAX}.</p>
    <div class="add"><input class="inp" id="url" inputmode="url" placeholder="Cole o link do vídeo aqui" autocomplete="off"><button id="mais" aria-label="Adicionar vídeo">+</button></div>
    <p class="msg" id="urlMsg"></p>
    <ul class="vl" id="vl"></ul>

    <h2>Três destaques (opcional)</h2>
    <p class="dica">Aparecem embaixo do seu nome. Ex.: “Reels”, “Anúncios”, “Entrega em 3 dias”.</p>
    <div class="row">${[0,1,2].map(i => `<input class="inp selo" maxlength="28" value="${esc(p.selos[i] || '')}" aria-label="Destaque ${i+1}">`).join('')}</div>

    <h2>Cor da página</h2>
    <div class="cores" role="group" aria-label="Cor da página">${Object.entries(CORES).map(([k, c]) => `<button type="button" data-c="${k}" style="--c:${c}" aria-pressed="${p.cor === k}" aria-label="${k}"></button>`).join('')}</div>

    <h2>O botão “Pedir orçamento”</h2>
    <label for="zap" style="margin-top:8px">Seu WhatsApp, com DDD</label><input class="inp" id="zap" inputmode="tel" maxlength="20" value="${esc(zapBonito(p.whatsapp))}" placeholder="(11) 99999-9999" autocomplete="tel">
    ${EXTRA.tem_briefing
      ? `<label class="tog"><input type="checkbox" id="brf" ${p.briefing ? 'checked' : ''}><span><b>Abrir o meu briefing</b><small>O cliente responde as perguntas e o pedido chega organizado no Gerador de Briefing. Desmarcado, o botão abre o seu WhatsApp.</small></span></label>`
      : `<p class="dica" style="margin-top:10px">O botão abre o seu WhatsApp. Quem tem o Gerador de Briefing pode fazer o botão abrir o briefing, e o pedido já chega organizado.</p>`}
    ${publicado ? `<label class="tog"><input type="checkbox" id="pub" ${p.publicado ? 'checked' : ''}><span><b>Portfólio no ar</b><small>Desmarque para tirar a página do ar sem apagar nada.</small></span></label>` : ''}

    <button class="btn" id="salvar">${publicado ? 'Salvar alterações' : 'Publicar o meu portfólio'}</button>`);

  lista();
  $('#nome').oninput = e => { p.nome = e.target.value; if (p._novo && !p._slugMexido){ $('#slug').value = p.slug = paraSlug(p.nome); confereSlug(); } sujo = true; };
  $('#frase').oninput = e => { p.frase = e.target.value; sujo = true; };
  $('#slug').oninput = e => { const v = paraSlug(e.target.value.replace(/\s/g, '-')); if (v !== e.target.value) e.target.value = v; p.slug = v; p._slugMexido = true; sujo = true; confereSlug(); };
  $('#zap').oninput = e => { p.whatsapp = e.target.value; sujo = true; };
  document.querySelectorAll('.selo').forEach((el, i) => el.oninput = () => { p.selos[i] = el.value; sujo = true; });
  document.querySelectorAll('.cores button').forEach(b => b.onclick = () => { p.cor = b.dataset.c; document.querySelectorAll('.cores button').forEach(x => x.setAttribute('aria-pressed', x === b)); sujo = true; });
  if ($('#brf')) $('#brf').onchange = e => { p.briefing = e.target.checked; sujo = true; };
  if ($('#pub')) $('#pub').onchange = e => { p.publicado = e.target.checked; sujo = true; };
  $('#mais').onclick = adiciona;
  $('#url').onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); adiciona(); } };
  $('#url').onpaste = () => setTimeout(adiciona, 30);
  $('#salvar').onclick = salva;
  if ($('#copiar')) $('#copiar').onclick = async () => { await copia(link(P.slug)); toast('Link copiado'); };
  confereSlug();
}
function zapBonito(z){ const d = String(z || '').replace(/\D/g, '').replace(/^55(?=\d{10,11}$)/, ''); return d.length >= 10 ? `(${d.slice(0,2)}) ${d.slice(2, d.length - 4)}-${d.slice(-4)}` : (z || ''); }

let tSlug;
function confereSlug(){
  const s = P.slug, m = $('#slugMsg'), box = $('#lkBox'); clearTimeout(tSlug);
  const poe = (cls, t) => { m.className = 'msg ' + cls; m.textContent = t; box.classList.toggle('ruim', cls === 'ruim'); };
  if (!s) return poe('', 'Só letras, números e traço. Ex.: joao-editor');
  if (!slugOk(s)) return poe('ruim', 'Use de 3 a 30 letras ou números, sem espaço e sem acento.');
  poe('', 'Conferindo…');
  tSlug = setTimeout(async () => {
    try { const livre = await Base.rpc('portfolio_livre', { p_slug: s }); if (P.slug !== s) return; poe(livre ? 'ok' : 'ruim', livre ? 'Esse link está livre.' : 'Esse final de link já está em uso. Tente outro.'); }
    catch { poe('', ''); }
  }, 350);
}

function lista(){
  const ul = $('#vl'), vs = P.videos;
  if (!vs.length){ ul.outerHTML = '<div class="vazio" id="vl">Nenhum vídeo ainda. Cole o primeiro link ali em cima.</div>'; return; }
  if (ul.tagName !== 'UL'){ ul.outerHTML = '<ul class="vl" id="vl"></ul>'; }
  $('#vl').innerHTML = vs.map((v, i) => { const inf = CaseVideo.le(v.u) || {}, capa = v.c || inf.capa;
    return `<li><div class="th"${capa ? ` style="background-image:url('${esc(capa).replace(/'/g, '%27')}')"` : ''}>${capa ? '' : esc(CaseVideo.NOMES[inf.site] || '')}</div>
      <div class="vm"><input value="${esc(v.n || '')}" maxlength="60" placeholder="Título (opcional). Ex.: Reels de receita" data-i="${i}" class="vn" aria-label="Título do vídeo ${i+1}">
        <div style="display:flex;gap:8px;align-items:center;min-width:0"><select data-i="${i}" class="vt" aria-label="Tipo do vídeo ${i+1}">${Object.entries(CaseVideo.TIPOS).map(([k, t]) => `<option value="${k}"${v.t === k ? ' selected' : ''}>${t}</option>`).join('')}</select><small>${esc(v.u.replace(/^https:\/\/(www\.)?/, ''))}</small></div></div>
      <div class="va"><button data-a="cima" data-i="${i}" ${i ? '' : 'disabled'} aria-label="Subir">↑</button><button data-a="baixo" data-i="${i}" ${i < vs.length - 1 ? '' : 'disabled'} aria-label="Descer">↓</button><button class="x" data-a="tira" data-i="${i}" aria-label="Remover">×</button></div></li>`; }).join('');
  document.querySelectorAll('.vn').forEach(el => el.oninput = () => { P.videos[+el.dataset.i].n = el.value; sujo = true; });
  document.querySelectorAll('.vt').forEach(el => el.onchange = () => { P.videos[+el.dataset.i].t = el.value; sujo = true; });
  document.querySelectorAll('.va button').forEach(b => b.onclick = () => { const i = +b.dataset.i, a = b.dataset.a;
    if (a === 'tira') vs.splice(i, 1); else { const j = a === 'cima' ? i - 1 : i + 1; [vs[i], vs[j]] = [vs[j], vs[i]]; }
    sujo = true; lista(); });
}
function adiciona(){
  const el = $('#url'), m = $('#urlMsg'), u = el.value.trim(); if (!u) return;
  const diz = (cls, t) => { m.className = 'msg ' + cls; m.textContent = t; el.classList.toggle('ruim', cls === 'ruim'); };
  if (P.videos.length >= MAX) return diz('ruim', 'O portfólio aceita até ' + MAX + ' vídeos. Tire um para colocar outro.');
  const limpo = u.split('?')[0].includes('youtube.com/watch') ? u : u.replace(/[?&](igsh|igshid|utm_[a-z]+|si|is_from_webapp|sender_device)=[^&]*/g, '').replace(/\?$/, '');
  const inf = CaseVideo.le(limpo);
  if (!inf) return diz('ruim', 'Não reconheci esse link. Use o link do vídeo no Instagram, TikTok, YouTube, Vimeo ou Google Drive.');
  if (P.videos.some(v => v.u === limpo)) return diz('ruim', 'Esse vídeo já está na lista.');
  const tipo = inf.site === 'youtube' && !inf.vertical ? 'youtube' : inf.vertical ? 'reels' : 'outro';
  const v = { u: limpo, t: tipo, n: '', c: inf.capa || null };
  P.videos.push(v); el.value = ''; sujo = true; lista();
  diz('ok', inf.site === 'drive' ? 'Adicionado. No Drive, deixe o arquivo como “Qualquer pessoa com o link”.' : inf.site === 'tiktok' && !inf.embed ? 'Adicionado. Esse link curto abre no TikTok; o link completo do vídeo toca dentro da página.' : 'Adicionado.');
  if (!v.c) CaseVideo.buscaCapa(limpo).then(c => { if (c){ v.c = c; lista(); } });
}

async function salva(){
  const b = $('#salvar'), p = P;
  if (!p.nome.trim()){ toast('Escreva o seu nome'); $('#nome').focus(); return; }
  if (!slugOk(p.slug)){ toast('Confira o final do seu link'); $('#slug').focus(); return; }
  if (!p.videos.length){ toast('Coloque pelo menos um vídeo'); $('#url').focus(); return; }
  const z = String(p.whatsapp || '').replace(/\D/g, '');
  if (z && !/^(55)?\d{10,11}$/.test(z)){ toast('Confira o WhatsApp, com DDD'); $('#zap').focus(); return; }
  if (!z && !(EXTRA.tem_briefing && p.briefing)){ toast('Coloque o seu WhatsApp para o cliente pedir orçamento'); $('#zap').focus(); return; }
  b.disabled = true; b.textContent = 'Salvando…';
  try {
    const r = await Base.rpc('portfolio_salvar', { p: { slug:p.slug, nome:p.nome, frase:p.frase, whatsapp:p.whatsapp, cor:p.cor, selos:p.selos.filter(s => s && s.trim()), videos:p.videos, briefing:!!p.briefing, publicado:p.publicado !== false } });
    const era = p._novo; P = { ...r, selos: r.selos || [], videos: r.videos || [] }; sujo = false;
    editor(); window.scrollTo({ top:0, behavior:'smooth' }); toast(era ? 'Portfólio no ar!' : 'Alterações salvas');
  } catch(e){ b.disabled = false; b.textContent = p._novo ? 'Publicar o meu portfólio' : 'Salvar alterações'; toast(Base.traduz(e.message)); }
}
addEventListener('beforeunload', e => { if (sujo){ e.preventDefault(); e.returnValue = ''; } });

async function inicio(){
  topo();
  await Base.pronto; await Base.carrega();
  topo();
  if (!acesso()) return vitrine();
  try {
    const r = await Base.rpc('portfolio');
    EXTRA = r || {};
    P = r && r.portfolio ? { ...r.portfolio, selos: r.portfolio.selos || [], videos: r.portfolio.videos || [] } : novo();
    editor();
  } catch(e){ tela(`<h1>Não consegui abrir.</h1><p class="sub">${esc(Base.traduz(e.message))}</p><button class="btn" onclick="location.reload()">Tentar de novo</button>`); }
}
// só redesenha quando a pessoa entrou ou saiu (em outra aba, por exemplo)
Base.aoMudar(() => { if (!!Base.sessao() !== ($('#conta')?.textContent === 'Sair')) { sujo = false; inicio(); } });
inicio();
</script>
