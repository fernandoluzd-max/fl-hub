<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CaseUp — seu portfólio de editor | Base FL</title>
<meta name="description" content="CaseUp: monte uma página com os seus vídeos, mande o link para o cliente e receba pedidos de orçamento.">
<meta name="theme-color" content="#0D0F0E">
<meta property="og:title" content="CaseUp — Base FL">
<meta property="og:description" content="Mostre seus vídeos e receba pedidos de orçamento.">
<meta property="og:image" content="https://basefl.com/capas/caseup.jpg">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0D0F0E;--panel:#151816;--panel2:#1B1F1C;--line:#272D29;--ink:#F4F0E4;--mute:#9A968A;--dim:#5f5c55;--accent:#D4E157;--accent-ink:#171A06;--err:#ff8f7a;
  --f:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--ink);font:16px/1.5 var(--f);min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(700px 420px at 85% -8%,rgba(212,225,87,.09),transparent 70%)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
.wrap{position:relative;max-width:560px;margin:0 auto;padding:16px 18px 150px}
header{display:flex;align-items:center;gap:10px;margin-bottom:22px}
header img{width:38px;height:38px;border-radius:11px;box-shadow:0 0 0 1px rgba(255,255,255,.10);flex:none}
header .nm{font-weight:800;font-stretch:112%;font-size:15px;letter-spacing:-.01em;line-height:1.1}
header .nm small{display:block;font-weight:500;font-stretch:100%;color:var(--mute);font-size:12px}
header .sp{flex:1}
.link{background:none;border:0;color:var(--mute);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
h1{font-weight:850;font-stretch:118%;font-size:clamp(27px,7.6vw,34px);line-height:1.04;letter-spacing:-.025em;margin-bottom:8px;text-wrap:balance}
.sub{color:var(--mute);font-size:15px;margin-bottom:22px;max-width:46ch}
.dica{color:var(--mute);font-size:13.5px;margin-bottom:10px}
label{display:block;font-size:13px;font-weight:700;color:var(--mute);margin:14px 0 6px}
.inp{width:100%;min-height:50px;background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:0 14px;font-size:16px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--accent)}.inp.ruim{border-color:var(--err)}
.lkb{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:13px;padding-left:14px;transition:border-color .2s}
.lkb:focus-within{border-color:var(--accent)}.lkb.ruim{border-color:var(--err)}
.lkb span{color:var(--mute);font-size:15px;white-space:nowrap}
.lkb input{flex:1;min-width:0;min-height:50px;background:none;border:0;outline:none;font-size:16px;font-weight:700;padding:0 12px 0 0}
.msg{font-size:13px;margin-top:6px;min-height:18px;color:var(--mute)}.msg.ok{color:var(--accent)}.msg.ruim{color:var(--err)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:15px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:16.5px;cursor:pointer;margin-top:22px;text-decoration:none;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.985)}.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:10px}
.row{display:flex;gap:10px}.row .btn{margin-top:10px}
/* blocos numerados */
.bloco{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px 16px 18px;margin-top:14px;transition:border-color .3s}
.bloco.feito{border-color:rgba(212,225,87,.35)}
.bh{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.bh i{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px;border:1px solid var(--line);color:var(--mute);transition:all .3s}
.bloco.feito .bh i{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.bloco.feito .bh i::before{content:"✓"}.bloco.feito .bh i span{display:none}
.bh b{font-size:17px;font-weight:800;font-stretch:108%;letter-spacing:-.01em}
.bh small{margin-left:auto;font-size:12px;color:var(--dim);font-weight:600}
/* botões de link */
.tipos{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.tipos button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:9px 14px;font-size:14px;font-weight:650;cursor:pointer;transition:border-color .2s,transform .15s}
.tipos button:hover{border-color:var(--accent)}.tipos button:active{transform:scale(.96)}
.tipos svg,.li svg{width:18px;height:18px;fill:none;stroke:var(--accent);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ll{list-style:none;display:grid;gap:8px;margin-top:12px}
.li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px;animation:entra .3s ease both}
.li .cm{display:grid;gap:6px;min-width:0}
.li input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:15px;outline:none}
.li input:focus{border-color:var(--accent)}.li input.ruim{border-color:var(--err)}
.li input.r{font-weight:700}
/* vídeos */
.add{display:flex;gap:8px}
.add .inp{flex:1;min-width:0}
.add button{flex:none;min-width:54px;border-radius:13px;background:var(--accent);color:var(--accent-ink);border:0;font-weight:800;font-size:22px;cursor:pointer}
.fotoL{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.fotoV{width:72px;height:72px;border-radius:50%;flex:none;background:var(--accent);color:var(--accent-ink,#171A06);display:grid;place-items:center;font-weight:900;font-size:28px;background-size:cover;background-position:center;overflow:hidden}
.fotoL .bts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mini{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;font-weight:650;cursor:pointer}
.mini:hover{border-color:var(--accent)}.mini.x{color:var(--mute)}.mini[disabled]{opacity:.5}
.vl .th{cursor:pointer;position:relative;width:54px;aspect-ratio:9/16;height:auto;border-radius:9px;background-color:var(--panel2);background-size:cover;background-position:center;display:grid;place-items:center;font-size:9.5px;font-weight:700;color:var(--mute);text-align:center;border:1px dashed transparent;padding:0;overflow:hidden}
.vl .th.h{aspect-ratio:16/9;width:72px}.vl .th.sem{border-color:var(--line)}
.vl .th:hover{border-color:var(--accent)}.vl .th u{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.62);color:#fff;font-size:9px;font-weight:700;text-decoration:none;padding:2px 0;font-style:normal}
.vl .ops{display:flex;gap:6px;align-items:center;min-width:0;flex-wrap:wrap}
.trava{border:1px dashed var(--line);border-radius:14px;padding:14px;display:grid;gap:8px;background:var(--bg)}
.trava b{display:flex;align-items:center;gap:8px;font-size:15px}.trava p{color:var(--mute);font-size:13.5px;line-height:1.45;margin:0}
.trava .btn{justify-self:start;margin-top:4px}
.vl{list-style:none;display:grid;gap:8px;margin-top:10px}
.vl li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:8px;animation:entra .3s ease both}
.th{width:44px;height:62px;border-radius:8px;background:linear-gradient(160deg,rgba(212,225,87,.28),#101210) center/cover;display:grid;place-items:center;font-size:9px;font-weight:800;letter-spacing:.04em;color:rgba(255,255,255,.8);text-transform:uppercase;overflow:hidden;text-align:center}
.vm{min-width:0;display:grid;gap:6px}
.vm input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:14.5px;outline:none}
.vm input:focus{border-color:var(--accent)}
.vm select{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:13.5px;max-width:100%}
.vm small{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.va{display:grid;gap:4px}
.va button{width:34px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:14px;cursor:pointer;color:var(--mute)}
.va button:disabled{opacity:.3}.va .x{color:var(--err)}
.li .va{grid-auto-flow:column}
.vazio{border:1px dashed #3a403c;border-radius:14px;padding:16px;text-align:center;color:var(--mute);font-size:14.5px;margin-top:10px}
/* visual */
.cores{display:flex;gap:10px;flex-wrap:wrap}
.cores button{width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;background:var(--c);transition:transform .15s}
.cores button:active{transform:scale(.9)}
.cores button[aria-pressed=true]{box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--ink)}
.estilos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.estilos button{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 8px 10px;cursor:pointer;font-size:12.5px;font-weight:650;color:var(--mute);display:grid;gap:8px;justify-items:center}
.estilos button[aria-pressed=true]{border-color:var(--accent);color:var(--ink)}
.estilos i{display:block;width:100%;height:26px;border-radius:9px;background:var(--panel2);border:1px solid var(--line)}
.estilos .contorno i{background:transparent;border-color:var(--accent)}
.estilos .vidro i{border-radius:99px;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16)}
.tog{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;cursor:pointer}
.tog input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin-top:1px}
.tog b{display:block;font-size:15px}.tog small{display:block;color:var(--mute);font-size:13.5px}
/* link pronto */
.pronto{border:1px solid rgba(212,225,87,.45);background:linear-gradient(180deg,rgba(212,225,87,.08),transparent),var(--panel);border-radius:18px;padding:18px;margin-bottom:8px}
.pronto small{display:block;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.pronto code{display:block;font:700 17px/1.3 var(--f);margin:6px 0 2px;overflow-wrap:anywhere}
.pronto p{color:var(--mute);font-size:13.5px}
/* barra fixa: progresso + prévia + salvar */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(13,15,14,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.barra-in{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center}
.prog{min-width:0}
.prog b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog i{display:block;height:7px;border-radius:7px;background:var(--panel2);overflow:hidden;margin-top:6px}
.prog u{display:block;height:100%;width:0;border-radius:7px;background:linear-gradient(90deg,#9fb23a,var(--accent));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.barra .btn{margin:0;width:auto;min-height:48px;padding:0 20px;font-size:15.5px;white-space:nowrap}
.barra .btn.ghost{padding:0 14px}
/* prévia */
.previa{display:none}
.fone{width:330px;height:660px;border-radius:38px;border:8px solid #232826;background:#0B0C0C;overflow:hidden;box-shadow:0 40px 90px -30px #000}
.fone iframe{display:block;width:100%;height:100%;border:0}
.previa p{text-align:center;color:var(--dim);font-size:12.5px;margin-top:10px}
.folha{position:fixed;inset:0;z-index:40;background:rgba(4,4,4,.92);display:none;flex-direction:column}
.folha.on{display:flex}
.folha .fh{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;color:var(--mute);font-size:14px}
.folha .fh button{background:none;border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-weight:700;cursor:pointer}
.folha iframe{flex:1;width:100%;border:0;background:#0B0C0C;border-radius:22px 22px 0 0}
/* vitrine */
.lock{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:18px;margin-top:18px}
.lock ul{list-style:none;display:grid;gap:8px;margin-bottom:6px}
.lock li{position:relative;padding-left:24px;font-size:15px}.lock li::before{content:"✓";position:absolute;left:0;color:var(--accent);font-weight:900}
.demo{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#0B0C0C;margin-top:6px}
.demo iframe{display:block;width:100%;height:560px;border:0}
.foot{color:var(--dim);font-size:12.5px;text-align:center;margin-top:28px}
.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);background:var(--ink);color:#141414;font-weight:700;font-size:14.5px;padding:11px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:all .25s;z-index:60;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.conf{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:70;pointer-events:none;animation:cai linear forwards}
@keyframes cai{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
.entra{animation:entra .3s ease both}@keyframes entra{from{opacity:0;transform:translateY(8px)}}
@media (min-width:980px){
  .wrap.largo{max-width:1040px;display:grid;grid-template-columns:minmax(0,560px) 1fr;gap:0 50px;align-items:start}
  .wrap.largo header,.wrap.largo .foot{grid-column:1/-1}
  .wrap.largo .previa{display:block;position:sticky;top:20px;justify-self:center}
  #verPrevia{display:none!important}
}
@media (prefers-reduced-motion:reduce){.entra,.li,.vl li{animation:none}.conf{display:none}}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header id="topo"></header>
  <main id="tela"><p class="sub">Carregando…</p></main>
  <aside class="previa" id="previa" aria-label="Prévia da sua página"><div class="fone"><iframe id="fPrev" title="Prévia" src="about:blank"></iframe></div><p>É assim que o cliente vê. Atualiza enquanto você mexe.</p></aside>
  <p class="foot" id="foot"></p>
</div>
<div class="barra" id="barra" hidden><div class="barra-in"><div class="prog"><b id="pgT"></b><i><u id="pgU"></u></i></div><button class="btn ghost" id="verPrevia" type="button">Prévia</button><button class="btn" id="salvar" type="button">Publicar</button></div></div>
<div class="folha" id="folha"><div class="fh"><span>É assim que o cliente vê</span><button id="fechaFolha" type="button">Fechar</button></div><iframe id="fFolha" title="Prévia" src="about:blank"></iframe></div>
<div class="toast" id="toast"></div>

<script src="/catalogo.js"></script>
<script src="/base.js?v=4"></script>
<script src="/case/video.js?v=2"></script>
<script>
/* CaseUp — tela do EDITOR. O cliente vê a página em /e/ (pública, sem nada interno). */
const PACK = 'fl-case';
const CORES = { lima:'#D4E157', agua:'#3FD0C2', ambar:'#F2A541', roxo:'#A98BFF', rosa:'#FF6FAE', azul:'#5AB8FF' };
const MAXV = 24, MAXL = 12;
const ICO = {
  whatsapp:'<path d="M4 20l1.300-4.200A8 8 0 1 1 8.400 19z"/><path d="M9 9.500c0 3 2.500 5.500 5.500 5.500l1.200-1.500-2-1-.800.800a4 4 0 0 1-2.200-2.200l.800-.800-1-2z"/>',
  instagram:'<rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.600"/><path d="M16.800 7.200v.01"/>',
  tiktok:'<path d="M14 4v10.500a3.500 3.500 0 1 1-3.500-3.500"/><path d="M14 4c.400 2.600 2 4.200 4.500 4.500"/>',
  youtube:'<rect x="3" y="6" width="18" height="12" rx="4"/><path d="M10.500 9.500v5l4.200-2.500z"/>',
  email:'<rect x="3.500" y="5.500" width="17" height="13" rx="2.500"/><path d="M4.500 7.500l7.500 5.500 7.500-5.500"/>',
  site:'<circle cx="12" cy="12" r="8.500"/><path d="M3.500 12h17M12 3.500c2.500 2.600 2.500 14.400 0 17M12 3.500c-2.500 2.600-2.500 14.400 0 17"/>' };
// cada tipo de botão: nome, texto padrão, o que pedir, e como transformar o que a pessoa digita num endereço
const TIPO = {
  whatsapp:  { n:'WhatsApp',  r:'Chamar no WhatsApp', ph:'(11) 99999-9999', modo:'tel',  ok: v => { const d = v.replace(/\D/g, ''); return /^(55)?\d{10,11}$/.test(d) ? d : null; } },
  instagram: { n:'Instagram', r:'Instagram', ph:'@seuperfil', modo:'text', ok: v => perfil(v, 'instagram.com', u => 'https://instagram.com/' + u) },
  tiktok:    { n:'TikTok',    r:'TikTok',    ph:'@seuperfil', modo:'text', ok: v => perfil(v, 'tiktok.com', u => 'https://www.tiktok.com/@' + u) },
  youtube:   { n:'YouTube',   r:'YouTube',   ph:'@seucanal ou o link do canal', modo:'text', ok: v => perfil(v, 'youtube.com', u => 'https://www.youtube.com/@' + u) },
  email:     { n:'E-mail',    r:'Mandar um e-mail', ph:'voce@email.com', modo:'email', ok: v => /^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/i.test(v.trim()) ? v.trim().toLowerCase() : null },
  site:      { n:'Outro link', r:'', ph:'Cole o endereço. Ex.: seusite.com.br', modo:'url', ok: v => endereco(v) },
};
function endereco(v){ v = v.trim(); if (!v) return null; if (!/^https?:\/\//i.test(v)) v = 'https://' + v; v = v.replace(/^http:\/\//i, 'https://'); try { const u = new URL(v); return /\.[a-z]{2,}$/i.test(u.hostname) ? u.toString() : null; } catch { return null; } }
function perfil(v, dominio, monta){ v = v.trim(); if (!v) return null;
  if (/^https?:\/\//i.test(v) || v.includes(dominio)) { const e = endereco(v); return e && new URL(e).hostname.replace(/^www\./, '').endsWith(dominio) ? e : null; }
  const u = v.replace(/^@/, ''); return /^[\w.\-]{2,40}$/.test(u) ? monta(u) : null; }

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)], esc = Base.esc;
const calmo = matchMedia('(prefers-reduced-motion: reduce)').matches;
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2600); }
function tela(html){ const m = $('#tela'); m.className = 'entra'; m.innerHTML = html; }
async function copia(t){ try { await navigator.clipboard.writeText(t); } catch { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); } }
function confete(){ if (calmo) return; const cs = Object.values(CORES); for (let i = 0; i < 46; i++){ const d = document.createElement('i'); d.className = 'conf'; d.style.left = Math.random() * 100 + 'vw'; d.style.background = cs[i % cs.length]; d.style.animationDuration = (1.6 + Math.random() * 1.6) + 's'; d.style.animationDelay = Math.random() * .4 + 's'; document.body.appendChild(d); setTimeout(() => d.remove(), 3800); } }
const semAcento = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '');
const paraSlug = s => semAcento(String(s || '').toLowerCase()).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 30);
const slugOk = s => /^[a-z0-9](?:[a-z0-9-]{1,28})[a-z0-9]$/.test(s);
const link = s => location.origin + '/' + s;
const img = n => n && EXTRA.pasta ? Base.arquivo('caseup/' + EXTRA.pasta + '/' + n) : null;
const svg = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICO[k]}</svg>`;

let P = null, EXTRA = {}, sujo = false, cheio = false;
const prod = () => Base.produto('case') || { nome:'CaseUp', preco:'' };
const acesso = () => Base.tem(PACK);

function topo(){
  const s = Base.sessao();
  $('#topo').innerHTML = `<img src="/icones/case.png" alt=""><span class="nm">CaseUp<small>Base FL</small></span><span class="sp"></span>
    ${s ? '<button class="link" id="conta">Sair</button>' : '<button class="link" id="conta">Entrar</button>'}`;

// ---------- progresso (o que falta para a página ficar completa) ----------
function progresso(){
  const p = P;
  const linksOk = p.links.filter(l => l.v).length, itens = [
    [1, !!p.nome.trim() && slugOk(p.slug) && !!(p.frase || '').trim(), !p.nome.trim() ? 'escreva o seu nome' : !(p.frase || '').trim() ? 'conte o que você faz, em uma frase' : 'confira o final do link'],
    [0, !!p.foto, 'coloque a sua foto'],
    [2, linksOk >= 1, 'coloque pelo menos um botão'],
    [3, p.videos.length >= 3, p.videos.length ? 'coloque mais ' + (3 - p.videos.length) + (3 - p.videos.length === 1 ? ' vídeo' : ' vídeos') : 'cole o link de um vídeo'],
    [4, p.selos.filter(s => s && s.trim()).length >= 1, 'escreva um destaque'],
  ];
  const feitos = itens.filter(i => i[1]).length, falta = itens.find(i => !i[1]);
  return { itens, pct: Math.round(feitos / itens.length * 100), falta: falta ? falta[2] : null };
}
// ---------- imagens: a foto e as capas são reduzidas aqui mesmo e guardadas na pasta do editor ----------
function reduz(arq, larg, alt){
  return new Promise((ok, erro) => {
    const u = URL.createObjectURL(arq), im = new Image();
    im.onload = () => {
      const c = document.createElement('canvas'); c.width = larg; c.height = alt;
      const e = Math.max(larg / im.naturalWidth, alt / im.naturalHeight), w = im.naturalWidth * e, h = im.naturalHeight * e;     // corta no centro, sem esticar
      c.getContext('2d').drawImage(im, (larg - w) / 2, (alt - h) / 2, w, h); URL.revokeObjectURL(u);
      c.toBlob(b => b ? ok(b) : erro(new Error('Não consegui ler essa imagem.')), 'image/jpeg', .84);
    };
    im.onerror = () => { URL.revokeObjectURL(u); erro(new Error('Não consegui ler essa imagem. Use uma foto JPG ou PNG.')); };
    im.src = u;
  });
}
async function guarda(arq, prefixo, larg, alt){
  if (!EXTRA.pasta) throw new Error('Atualize a página e tente de novo.');
  const blob = await reduz(arq, larg, alt), nome = prefixo + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6) + '.jpg';
  await Base.envia('caseup/' + EXTRA.pasta + '/' + nome, blob); return nome;
}

  P.videos.push(v); el.value = ''; listaVideos(); mexeu();
  diz('ok', inf.site === 'drive' ? 'Adicionado. No Drive, deixe o arquivo como “Qualquer pessoa com o link”.' : inf.site === 'tiktok' && !inf.embed ? 'Adicionado. Esse link curto abre no TikTok; o link completo do vídeo toca dentro da página.' : inf.site === 'instagram' ? 'Adicionado. O Instagram não mostra a capa sozinho: toque na miniatura para colocar uma.' : 'Adicionado.');
  if (!v.c) CaseVideo.buscaCapa(limpo).then(c => { if (c){ v.c = c; listaVideos(); mandaPrevia(); } });
}

async function salva(){
  const b = $('#salvar'), p = P;
  const vai = (t, sel) => { toast(t); const e = $(sel); if (e){ e.scrollIntoView({ block:'center', behavior: calmo ? 'auto' : 'smooth' }); e.focus({ preventScroll:true }); } };
  if (!p.nome.trim()) return vai('Escreva o seu nome', '#nome');
  if (!slugOk(p.slug)) return vai('Confira o final do seu link', '#slug');
  const ruim = p.links.findIndex(l => !l.v);
  if (ruim >= 0) return vai(p.links[ruim]._t ? 'Confira este botão: ' + TIPO[p.links[ruim].k].n : 'Preencha ou remova o botão vazio', '#ll .li:nth-child(' + (ruim + 1) + ') .v');
  if (!p.videos.length && !p.links.length) return vai('Coloque pelo menos um botão ou um vídeo', '#tipos button');
  b.disabled = true; b.textContent = 'Salvando…';
  try {
    const r = await Base.rpc('portfolio_salvar', { p: { slug:p.slug, nome:p.nome, frase:p.frase, whatsapp:p.whatsapp, cor:p.cor, estilo:p.estilo, foto:p.foto || null, selos:p.selos.filter(s => s && s.trim()),
      links:p.links.map(l => ({ k:l.k, r:l.r, v:l.v })), videos:p.videos, briefing:!!p.briefing, publicado:p.publicado !== false } });
    const era = p._novo; P = { ...r, selos: r.selos || [], links: r.links || [], videos: r.videos || [] }; sujo = false;
    b.disabled = false; editor(); window.scrollTo({ top:0, behavior: calmo ? 'auto' : 'smooth' });
    if (era){ confete(); toast('Sua página está no ar!'); } else toast('Alterações salvas');
  } catch(e){ b.disabled = false; b.textContent = p._novo ? 'Publicar' : 'Salvar'; toast(Base.traduz(e.message)); }
}
$('#salvar').onclick = salva;
$('#verPrevia').onclick = () => { ligaPrevia($('#fFolha')); $('#folha').classList.add('on'); document.body.style.overflow = 'hidden'; mandaPrevia(); };
$('#fechaFolha').onclick = () => { $('#folha').classList.remove('on'); document.body.style.overflow = ''; };
addEventListener('keydown', e => { if (e.key === 'Escape') $('#fechaFolha').click(); });
addEventListener('beforeunload', e => { if (sujo){ e.preventDefault(); e.returnValue = ''; } });

async function inicio(){
  topo();
  await Base.pronto; await Base.carrega();
  topo();
  if (!acesso()) return vitrine();
  try {
    const r = await Base.rpc('portfolio');
    EXTRA = r || {};
    P = r && r.portfolio ? { ...r.portfolio, selos: r.portfolio.selos || [], links: r.portfolio.links || [], videos: r.portfolio.videos || [] } : novo();
    if (matchMedia('(min-width:980px)').matches) ligaPrevia($('#fPrev'));
    editor();
  } catch(e){ modo(false); tela(`<h1>Não consegui abrir.</h1><p class="sub">${esc(Base.traduz(e.message))}</p><button class="btn" onclick="location.reload()">Tentar de novo</button>`); }
}
// só redesenha quando a pessoa entrou ou saiu (em outra aba, por exemplo)
Base.aoMudar(() => { if (!!Base.sessao() !== ($('#conta')?.textContent === 'Sair')) { sujo = false; inicio(); } });
addEventListener('resize', () => { if (P && acesso() && matchMedia('(min-width:980px)').matches) ligaPrevia($('#fPrev')); });
inicio();
</script>
